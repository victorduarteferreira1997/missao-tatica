<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Missão Tática — Prévia de Layout</title>
  <style>
    html,body{margin:0;width:100%;height:100%;background:#020617;overflow:hidden}
    #preview-frame{width:100%;height:100%;border:0;display:none;background:#020617}
    #status{position:fixed;inset:0;display:grid;place-items:center;color:#cbd5e1;font-family:system-ui;text-align:center;padding:24px}
    .muted{color:#64748b;font-size:13px;margin-top:8px}
  </style>
</head>
<body>
  <div id="status">
    <div><strong>Carregando prévia do novo layout…</strong><div class="muted">Branch codex/layout-simplification</div></div>
  </div>
  <iframe id="preview-frame" title="Missão Tática — prévia"></iframe>
  <script>
    (async () => {
      const status = document.getElementById('status');
      const frame = document.getElementById('preview-frame');
      try {
        const response = await fetch('https://raw.githubusercontent.com/victorduarteferreira1997/missao-tatica/codex/layout-simplification/app.html?v=915494355773d3e8828f81a1e7e4e9db53afac9a', { cache: 'no-store' });
        if (!response.ok) throw new Error('HTTP ' + response.status);
        let html = await response.text();

        // A prévia precisa rodar como um documento real. Injetar o HTML com document.write
        // após o carregamento impedia o <script type="module"> principal de inicializar,
        // então o botão de login existia visualmente, mas window.login não era registrado.
        html = html.replace(
          '<base href="https://victorduarteferreira1997.github.io/missao-tatica/">',
          '<base href="https://victorduarteferreira1997.github.io/missao-tatica/">'
        );

        frame.srcdoc = html;
        frame.style.display = 'block';
        status.style.display = 'none';
      } catch (err) {
        status.innerHTML = '<div><strong>Não foi possível carregar a prévia.</strong><div class="muted">' + String(err.message || err) + '</div></div>';
      }
    })();
  </script>
</body>
</html>
