    <style>
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        
        .timer-pulse { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .7; } }
        
        .modal-enter { animation: modalFadeIn 0.25s ease-out forwards; }
        @keyframes modalFadeIn { 
            from { opacity: 0; transform: scale(0.95) translateY(10px); } 
            to { opacity: 1; transform: scale(1) translateY(0); } 
        }
        
        .float-text {
            position: fixed; pointer-events: none; animation: floatUp 1.2s cubic-bezier(0.2, 1, 0.3, 1) forwards;
            font-weight: 900; text-shadow: 0 2px 10px rgba(0,0,0,0.5); z-index: 100;
        }
        @keyframes floatUp {
            0% { opacity: 0; transform: translateY(0) scale(0.5); }
            20% { opacity: 1; transform: translateY(-20px) scale(1.2); }
            100% { opacity: 0; transform: translateY(-60px) scale(1); }
        }

        .toast-enter { animation: slideInRight 0.4s cubic-bezier(0.2, 1, 0.3, 1) forwards; }
        @keyframes slideInRight { 
            from { transform: translateX(100%); opacity: 0; } 
            to { transform: translateX(0); opacity: 1; } 
        }

        .task-drag-over {
            outline: 2px dashed rgba(34, 211, 238, 0.75);
            outline-offset: 4px;
            background: rgba(8, 47, 73, 0.45) !important;
        }
        .drag-handle { cursor: grab; }
        .drag-handle:active { cursor: grabbing; }
    </style>

        function getMondayStartDate(date = new Date()) {
            const d = new Date(date);
            d.setHours(0, 0, 0, 0);
            const jsDay = d.getDay(); // domingo=0, segunda=1...
            const diff = jsDay === 0 ? -6 : 1 - jsDay;
            d.setDate(d.getDate() + diff);
            return d;
        }

        function addDaysToDate(date, days) {
            const d = new Date(date);
            d.setDate(d.getDate() + days);
            return d;
        }

        function dateKeyFromDate(date) {
            const d = new Date(date);
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        }

        function dateFromDateKey(dateKey) {
            const [year, month, day] = String(dateKey || '').split('-').map(Number);
            if (!year || !month || !day) return getMondayStartDate(new Date());
            return new Date(year, month - 1, day);
        }

        function formatPtShortDate(date, withWeekday = false) {
            const options = withWeekday
                ? { weekday: 'short', day: '2-digit', month: '2-digit' }
                : { day: '2-digit', month: '2-digit' };
            return new Date(date).toLocaleDateString('pt-BR', options).replace('.', '');
        }

        function normalizeClockTime(value) {
            const raw = String(value || '').trim();
            if (!raw) return '';
            const match = raw.match(/^(\d{1,2})(?::?(\d{2}))?$/);
            if (!match) return '';
            const hours = parseInt(match[1], 10);
            const minutes = typeof match[2] !== 'undefined' ? parseInt(match[2], 10) : 0;
            if (!Number.isFinite(hours) || !Number.isFinite(minutes) || hours < 0 || hours > 23 || minutes < 0 || minutes > 59) return '';
            return `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}`;
        }

        function minutesFromClock(time) {
            const normalized = normalizeClockTime(time);
            if (!normalized) return null;
            const [hours, minutes] = normalized.split(':').map(Number);
            return (hours * 60) + minutes;
        }

        function addMinutesToClock(time, minutesToAdd = 60) {
            const start = minutesFromClock(time);
            if (start === null) return '';
            const total = Math.max(0, Math.min((24 * 60) - 1, start + (parseInt(minutesToAdd, 10) || 60)));
            const hours = Math.floor(total / 60);
            const minutes = total % 60;
            return `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}`;
        }

        function isValidClockRange(startTime, endTime) {
            const start = minutesFromClock(startTime);
            const end = minutesFromClock(endTime);
            if (start === null || end === null) return true;
            return end > start;
        }

        window.normalizeClockTime = normalizeClockTime;
        window.addMinutesToClock = addMinutesToClock;

        window.getCalendarTimeLabel = function(item, fallbackMinutes = 60) {
            const start = normalizeClockTime(item?.startTime);
            const end = normalizeClockTime(item?.endTime);
            if (start && end) return `${start}–${end}`;
            if (start) return `${start} · ${parseInt(fallbackMinutes, 10) || 60} min`;
            return 'Dia inteiro';
        };

        window.readCalendarTimeFields = function(prefix, fallbackMinutes = 60) {
            const start = normalizeClockTime(document.getElementById(`${prefix}-start-time`)?.value || '');
            const end = normalizeClockTime(document.getElementById(`${prefix}-end-time`)?.value || '');
            if (end && !start) {
                window.showAlertModal('Preencha o horário de início ou deixe os dois campos de agenda em branco.');
                return null;
            }
            if (start && end && !isValidClockRange(start, end)) {
                window.showAlertModal('O horário final precisa ser depois do horário inicial.');
                return null;
            }
            return {
                startTime: start,
                endTime: start ? end : '',
                estimatedCalendarMinutes: parseInt(fallbackMinutes, 10) || 60
            };
        };


        window.getCalendarSortMinutes = function(item) {
            const minutes = minutesFromClock(item?.startTime);
            return minutes === null ? 99999 : minutes;
        };

        window.hasCalendarTime = function(item) {
            return window.getCalendarSortMinutes(item) < 99999;
        };

        window.compareCalendarItems = function(a, b, options = {}) {
            const aTime = window.getCalendarSortMinutes(a);
            const bTime = window.getCalendarSortMinutes(b);
            if (aTime !== bTime) return aTime - bTime;
            const completedStatus = options.completedStatus;
            if (completedStatus) {
                const aDone = completedStatus(a) ? 1 : 0;
                const bDone = completedStatus(b) ? 1 : 0;
                if (aDone !== bDone) return aDone - bDone;
            }
            const aOrder = typeof a?.order === 'number' ? a.order : 999999;
            const bOrder = typeof b?.order === 'number' ? b.order : 999999;
            if (aOrder !== bOrder) return aOrder - bOrder;
            const priorityRank = { essencial: 4, alta: 3, media: 2, baixa: 1 };
            const priorityDelta = (priorityRank[b?.priority] || 0) - (priorityRank[a?.priority] || 0);
            if (priorityDelta !== 0) return priorityDelta;
            return String(a?.text || a?.title || '').localeCompare(String(b?.text || b?.title || ''));
        };

        window.sortTasksBySchedule = function(tasks = []) {
            return [...tasks].sort((a, b) => window.compareCalendarItems(a, b, { completedStatus: item => Boolean(item.completed) }));
        };

        window.sortStudyBlocksBySchedule = function(blocks = []) {
            return [...blocks].sort((a, b) => window.compareCalendarItems(a, b, { completedStatus: item => item.status === 'completed' }));
        };


        window.getTaskNextOrderLocal = function(dayId) {
            const orders = (state.tasks || []).filter(t => t.day === dayId).map(t => typeof t.order === 'number' ? t.order : 0);
            return orders.length ? Math.max(...orders) + 1 : 1;
        };

        window.cloneTaskSubtasksForOccurrence = function(subtasks = []) {
            return (Array.isArray(subtasks) ? subtasks : []).map((st, index) => ({

        window.cleanTaskRewardFields = function(task) {
            if (!task) return task;
            delete task.rewardedXp;
            delete task.rewardedCoins;
            delete task.rewardedEnergyCost;
            delete task.rewardedBadgeIds;
            return task;

        window.upsertRecurringTaskOccurrences = function(templateTask, recurrenceDays = [], options = {}) {
            if (!templateTask || !Array.isArray(state.tasks)) return [];
            const validDays = daysOfWeek.map(d => d.id);
            const days = [...new Set((recurrenceDays || []).filter(day => validDays.includes(day)))];
            if (!days.length) return [templateTask];

            const groupId = templateTask.recurrenceGroupId || options.groupId || `rec-${Date.now()}-${Math.random().toString(16).slice(2)}`;
            templateTask.recurrenceGroupId = groupId;
            const templateSubtasks = Array.isArray(templateTask.subtasks) ? templateTask.subtasks : [];

            if (options.removeUnselected !== false) {
                state.tasks = state.tasks.filter(t => !(String(t.recurrenceGroupId || '') === String(groupId) && !days.includes(t.day)));
            }

            const applyFullTemplate = (target, targetDay, isNew = false) => {
                target.day = targetDay;
                target.category = templateTask.category;
                target.text = templateTask.text;
                target.xp = templateTask.xp;
                target.energyCost = templateTask.energyCost;
                target.priority = templateTask.priority;
                target.time = templateTask.time;
                target.complexity = templateTask.complexity;
                target.impactType = templateTask.impactType;
                target.startTime = normalizeClockTime(templateTask.startTime);
                target.endTime = target.startTime ? normalizeClockTime(templateTask.endTime) : '';
                if (target.startTime && target.endTime && !isValidClockRange(target.startTime, target.endTime)) target.endTime = '';
                target.isRecurring = true;
                target.recurrenceDays = [...days];
                target.recurrenceGroupId = groupId;
                if (typeof target.order !== 'number') target.order = window.getTaskNextOrderLocal(targetDay);
                if (isNew) {
                    target.completed = false;
                    target.skipped = false;
                    target.subtasks = window.cloneTaskSubtasksForOccurrence(templateSubtasks);
                    target.createdAt = target.createdAt || new Date().toISOString();
                    window.cleanTaskRewardFields(target);
                }
                return target;
            };

            const touched = [];
            days.forEach((dayId, index) => {
                let occurrence = state.tasks.find(t => String(t.recurrenceGroupId || '') === String(groupId) && t.day === dayId);
                if (!occurrence) {
                    occurrence = {
                        ...templateTask,
                        id: Date.now() + Math.random() + index,
                        order: window.getTaskNextOrderLocal(dayId)
                    };
                    window.cleanTaskRewardFields(occurrence);
                    state.tasks.push(occurrence);
                    applyFullTemplate(occurrence, dayId, true);
                } else {
                    applyFullTemplate(occurrence, dayId, false);
                }
                touched.push(occurrence);
            });

            // Evita cards duplicados do mesmo grupo no mesmo dia, mantendo o primeiro encontrado.
            const seen = new Set();
            state.tasks = state.tasks.filter(t => {
                if (String(t.recurrenceGroupId || '') !== String(groupId)) return true;
                const key = `${groupId}::${t.day}`;
                if (seen.has(key)) return false;
                seen.add(key);
                return true;
            });

            days.forEach(dayId => {
                if (typeof window.reindexTaskOrderForDay === 'function') window.reindexTaskOrderForDay(dayId);
            });
            return touched;
        };

        window.normalizeRecurringTaskSchedules = function() {
            if (!Array.isArray(state.tasks)) return;
            const validDays = daysOfWeek.map(d => d.id);
            const groups = new Map();
            state.tasks.forEach(t => {
                if (!t) return;
                const days = Array.isArray(t.recurrenceDays) ? t.recurrenceDays.filter(day => validDays.includes(day)) : [];
                if (!t.recurrenceGroupId || !(t.isRecurring || days.length)) return;
                const key = String(t.recurrenceGroupId);
                if (!groups.has(key)) groups.set(key, []);
                groups.get(key).push(t);
            });
            groups.forEach(groupTasks => {
                const days = [...new Set(groupTasks.flatMap(t => Array.isArray(t.recurrenceDays) ? t.recurrenceDays : []).filter(day => validDays.includes(day)))];
                if (!days.length) return;
                const source = groupTasks.find(t => normalizeClockTime(t.startTime)) || groupTasks[0];
                source.recurrenceDays = [...days];
                source.isRecurring = true;
                window.upsertRecurringTaskOccurrences(source, days, { removeUnselected: false });
            });
        };

        function formatIcsDate(date) {
            const d = new Date(date);
            return `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}`;
        }

        function formatIcsDateTime(date, clockTime) {
            const [hours, minutes] = normalizeClockTime(clockTime).split(':').map(Number);
            const d = new Date(date);
            d.setHours(hours || 0, minutes || 0, 0, 0);
            return `${formatIcsDate(d)}T${String(d.getHours()).padStart(2, '0')}${String(d.getMinutes()).padStart(2, '0')}00`;
        }

        function icsEscape(value) {
            return String(value ?? '')
                .replace(/\\/g, '\\\\')
                .replace(/;/g, '\\;')
                .replace(/,/g, '\\,')
                .replace(/\r?\n/g, '\\n');
        }

        function foldIcsLine(line) {
            const limit = 72;
            let result = '';
            let current = String(line || '');
            while (current.length > limit) {
                result += current.slice(0, limit) + '\r\n ';
                current = current.slice(limit);
            }
            return result + current;
        }

        function extractMinutesFromTask(task) {
            const raw = parseInt(String(task?.time || '').replace(/[^0-9]/g, ''), 10);
            return Number.isFinite(raw) && raw > 0 ? raw : 30;
        }

        function getIcsByDay(dayId) {
            const map = { monday: 'MO', tuesday: 'TU', wednesday: 'WE', thursday: 'TH', friday: 'FR', saturday: 'SA', sunday: 'SU' };
            return map[dayId] || '';
        }

        function sortDayIdsByWeek(dayIds = []) {
            const order = new Map(daysOfWeek.map((day, index) => [day.id, index]));
            return [...new Set((dayIds || []).filter(dayId => order.has(dayId)))]
                .sort((a, b) => order.get(a) - order.get(b));
        }

        function buildWeeklyRecurrenceRule(dayIds = [], count = 0) {
            const sortedDays = sortDayIdsByWeek(dayIds);
            if (sortedDays.length <= 1 || count <= 1) return '';
            const byday = sortedDays.map(getIcsByDay).filter(Boolean).join(',');
            return byday ? `FREQ=WEEKLY;COUNT=${count};BYDAY=${byday}` : '';
        }

        function buildIcsEvent({ uid, summary, date, startTime, endTime, durationMinutes, description, recurrenceRule }) {
            const now = new Date().toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';
            const cleanStart = normalizeClockTime(startTime);
            const cleanEnd = normalizeClockTime(endTime);
            const cleanRecurrenceRule = String(recurrenceRule || '').trim();
            const lines = ['BEGIN:VEVENT', `UID:${icsEscape(uid)}`, `DTSTAMP:${now}`];
            if (cleanStart) {
                const finalEnd = cleanEnd || addMinutesToClock(cleanStart, durationMinutes || 60);
                lines.push(`DTSTART:${formatIcsDateTime(date, cleanStart)}`);
                lines.push(`DTEND:${formatIcsDateTime(date, finalEnd)}`);
            } else {
                lines.push(`DTSTART;VALUE=DATE:${formatIcsDate(date)}`);
                lines.push(`DTEND;VALUE=DATE:${formatIcsDate(addDaysToDate(date, 1))}`);
            }
            if (cleanRecurrenceRule) lines.push(`RRULE:${cleanRecurrenceRule}`);
            lines.push(`SUMMARY:${icsEscape(summary)}`);
            if (description) lines.push(`DESCRIPTION:${icsEscape(description)}`);
            lines.push('CATEGORIES:Missão Tática');
            lines.push('END:VEVENT');
            return lines.map(foldIcsLine).join('\r\n');
        }

        window.exportVisibleWeekToIcs = function() {
            if (typeof window.normalizeRecurringTaskSchedules === 'function') window.normalizeRecurringTaskSchedules();

            const tasks = Array.isArray(state.tasks) ? state.tasks : [];
            const studyBlocks = (state.studyData?.studyPlan?.weeklyBlocks || []).filter(b => b.status !== 'cancelled');
            const subjects = state.studyData?.subjects || [];
            const weekStart = window.getActivePlanningWeekStartDate();
            const weekEnd = addDaysToDate(weekStart, 6);
            const weekLabel = `${formatPtShortDate(weekStart)} a ${formatPtShortDate(weekEnd)}`;
            const dayIndexMap = new Map(daysOfWeek.map((day, index) => [day.id, index]));
            const items = [];

            const getDayDate = (dayId) => addDaysToDate(weekStart, dayIndexMap.get(dayId) || 0);
            const getDayLabel = (dayId) => daysOfWeek.find(day => day.id === dayId)?.label || dayId;
            const getVisibleDaysFromTasks = (groupTasks, fallbackDays = []) => {
                const taskDays = groupTasks.map(t => t.day).filter(dayId => dayIndexMap.has(dayId));
                const declaredDays = (fallbackDays || []).filter(dayId => dayIndexMap.has(dayId));
                return sortDayIdsByWeek(taskDays.length ? taskDays : declaredDays);
            };

            const addTaskItem = (task, options = {}) => {
                if (!task || !dayIndexMap.has(task.day)) return;
                const cat = window.getTaskCategory(task.category);
                const duration = extractMinutesFromTask(task);
                const subtasks = Array.isArray(task.subtasks) && task.subtasks.length
                    ? `\nSubtarefas: ${task.subtasks.map(st => `${st.completed ? '✓' : '○'} ${st.text}`).join(' | ')}`
                    : '';
                const recurrenceDescription = options.recurrenceDayIds?.length > 1
                    ? `\nRecorrência no arquivo: ${options.recurrenceDayIds.map(getDayLabel).join(', ')}\nObservação: ao editar no Google Agenda, escolha “todos os eventos da série” para aplicar a todos os dias importados.`
                    : '';
                items.push({
                    type: 'task',
                    id: options.id || task.id,
                    day: task.day,
                    date: options.date || getDayDate(task.day),
                    startTime: task.startTime,
                    endTime: task.endTime,
                    sortTime: normalizeClockTime(task.startTime) || '99:99',
                    summary: `Missão Tática — ${task.text || 'Missão'}`,
                    description: `Origem: Missão Tática\nTipo: Missão do board\nDia: ${getDayLabel(task.day)}\nCategoria: ${cat.label || 'Geral'}\nPrioridade: ${task.priority || 'média'}\nStatus: ${task.completed ? 'Concluída' : 'Pendente'}\nDuração estimada: ${duration} min${recurrenceDescription}${subtasks}`,
                    durationMinutes: duration,
                    recurrenceRule: options.recurrenceRule || '',
                    recurrenceDayIds: options.recurrenceDayIds || null,
                    uid: options.uid || null
                });
            };

            const exportedTaskGroups = new Set();
            tasks.forEach(task => {
                if (!task || !dayIndexMap.has(task.day)) return;
                const recurrenceDays = Array.isArray(task.recurrenceDays) ? task.recurrenceDays.filter(dayId => dayIndexMap.has(dayId)) : [];
                const groupId = task.recurrenceGroupId ? String(task.recurrenceGroupId) : '';
                const isRecurringSeries = Boolean(groupId && (task.isRecurring || recurrenceDays.length > 1));

                if (isRecurringSeries) {
                    if (exportedTaskGroups.has(groupId)) return;
                    const groupTasks = tasks.filter(t => String(t.recurrenceGroupId || '') === groupId && dayIndexMap.has(t.day));
                    const seriesDays = getVisibleDaysFromTasks(groupTasks, recurrenceDays);
                    const firstDay = seriesDays[0] || task.day;
                    const source = groupTasks.find(t => t.day === firstDay) || task;
                    const doneCount = groupTasks.filter(t => t.completed).length;
                    const recurrenceRule = buildWeeklyRecurrenceRule(seriesDays, seriesDays.length);
                    addTaskItem(source, {
                        id: `rec-${groupId}`,
                        date: getDayDate(firstDay),
                        recurrenceRule,
                        recurrenceDayIds: seriesDays,
                        uid: `missao-tatica-task-series-${groupId}-${dateKeyFromDate(weekStart)}@missao-tatica`
                    });
                    const lastItem = items[items.length - 1];
                    if (lastItem && recurrenceRule) {
                        lastItem.description += `\nStatus da série na semana: ${doneCount}/${seriesDays.length} ocorrência(s) concluída(s).`;
                    }
                    exportedTaskGroups.add(groupId);
                    return;
                }

                addTaskItem(task);
            });

            const addStudyItem = (block, options = {}) => {
                if (!block || !dayIndexMap.has(block.day)) return;
                const track = window.getStudyTrack(block.trackId);
                const subject = block.subjectId ? subjects.find(s => String(s.id) === String(block.subjectId)) : null;
                const duration = parseInt(block.plannedMinutes, 10) || 30;
                const recurrenceDescription = options.recurrenceDayIds?.length > 1
                    ? `\nRecorrência no arquivo: ${options.recurrenceDayIds.map(getDayLabel).join(', ')}\nObservação: ao editar no Google Agenda, escolha “todos os eventos da série” para aplicar a todos os dias importados.`
                    : '';
                items.push({
                    type: 'study',
                    id: options.id || block.id,
                    day: block.day,
                    date: options.date || getDayDate(block.day),
                    startTime: block.startTime,
                    endTime: block.endTime,
                    sortTime: normalizeClockTime(block.startTime) || '99:99',
                    summary: `Missão Tática — Estudo: ${block.title || 'Bloco de estudo'}`,
                    description: `Origem: Missão Tática\nTipo: Estudo planejado\nDia: ${getDayLabel(block.day)}\nTrilha: ${track.name || 'Trilha'}\nDisciplina: ${subject ? subject.name : 'Sem disciplina vinculada'}\nMétodo: ${window.getStudyTypeLabel(block.studyType)}\nStatus: ${window.getStudyBlockStatusLabel(block.status)}\nDuração planejada: ${duration} min${recurrenceDescription}${block.notes ? `\nObservações: ${block.notes}` : ''}`,
                    durationMinutes: duration,
                    recurrenceRule: options.recurrenceRule || '',
                    recurrenceDayIds: options.recurrenceDayIds || null,
                    uid: options.uid || null
                });
            };

            const exportedStudySeries = new Set();
            studyBlocks.forEach(block => {
                if (!block || !dayIndexMap.has(block.day)) return;
                const seriesId = block.seriesId ? String(block.seriesId) : '';
                const seriesBlocks = seriesId
                    ? studyBlocks.filter(item => String(item.seriesId || '') === seriesId && dayIndexMap.has(item.day))
                    : [];

                if (seriesId && seriesBlocks.length > 1) {
                    if (exportedStudySeries.has(seriesId)) return;
                    const seriesDays = sortDayIdsByWeek(seriesBlocks.map(item => item.day));
                    const firstDay = seriesDays[0] || block.day;
                    const source = seriesBlocks.find(item => item.day === firstDay) || block;
                    const doneCount = seriesBlocks.filter(item => item.status === 'completed').length;
                    const recurrenceRule = buildWeeklyRecurrenceRule(seriesDays, seriesDays.length);
                    addStudyItem(source, {
                        id: `series-${seriesId}`,
                        date: getDayDate(firstDay),
                        recurrenceRule,
                        recurrenceDayIds: seriesDays,
                        uid: `missao-tatica-study-series-${seriesId}-${dateKeyFromDate(weekStart)}@missao-tatica`
                    });
                    const lastItem = items[items.length - 1];
                    if (lastItem && recurrenceRule) {
                        lastItem.description += `\nStatus da série na semana: ${doneCount}/${seriesDays.length} ocorrência(s) concluída(s).`;
                    }
                    exportedStudySeries.add(seriesId);
                    return;
                }

                addStudyItem(block);
            });

            if (!items.length) {
                window.showAlertModal('Não há missões ou estudos planejados na semana visível para exportar.');
                return;
            }

            items.sort((a, b) => (a.date - b.date) || String(a.sortTime).localeCompare(String(b.sortTime)) || String(a.summary).localeCompare(String(b.summary)));
            const events = items.map(item => buildIcsEvent({
                uid: item.uid || `missao-tatica-${item.type}-${item.id}-${dateKeyFromDate(item.date)}@missao-tatica`,
                summary: item.summary,
                date: item.date,
                startTime: item.startTime,
                endTime: item.endTime,
                durationMinutes: item.durationMinutes,
                description: item.description,
                recurrenceRule: item.recurrenceRule
            })).join('\r\n');

            const calendar = [
                'BEGIN:VCALENDAR',
                'VERSION:2.0',
                'PRODID:-//Missao Tatica//Agenda Semanal//PT-BR',
                'CALSCALE:GREGORIAN',
                'METHOD:PUBLISH',
                `X-WR-CALNAME:${icsEscape('Missão Tática — Semana ' + weekLabel)}`,
                events,
                'END:VCALENDAR'
            ].join('\r\n');

            const blob = new Blob([calendar], { type: 'text/calendar;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `missao_tatica_agenda_${dateKeyFromDate(weekStart)}.ics`;
            document.body.appendChild(link);
            link.click();
            link.remove();
            setTimeout(() => URL.revokeObjectURL(url), 1000);

            const occurrenceCount = items.reduce((total, item) => total + (Array.isArray(item.recurrenceDayIds) && item.recurrenceDayIds.length > 1 ? item.recurrenceDayIds.length : 1), 0);
            const seriesCount = items.filter(item => item.recurrenceRule).length;
            const seriesText = seriesCount ? ` ${seriesCount} série(s) recorrente(s) unificada(s).` : '';
            window.showToast('Agenda exportada', `${occurrenceCount} ocorrência(s) gerada(s) em ${items.length} evento(s) do .ics.${seriesText}`, 'calendar-plus', 'text-cyan-300');
        };

        window.getCurrentlyQualifiedBadgeIds = function() {
            const activeBadges = [];
            if (state.tasks.length > 0 && state.tasks.some(t => t.completed)) activeBadges.push('primeiro_sangue');
            if (state.waterCount >= 5) activeBadges.push('oasis');

            if (state.stats.rewardsBought >= 1) activeBadges.push('shopaholic');
            if (state.tasks.filter(t => t.completed && t.category === 'work').length >= 5) activeBadges.push('work_demon');
            if (state.tasks.filter(t => t.completed && t.category === 'law').length >= 3) activeBadges.push('legal_eagle');
            if (state.tasks.filter(t => t.completed && t.category === 'home').length >= 3) activeBadges.push('home_architect');
            if (state.waterCount >= 10) activeBadges.push('hydro_god');
            if (state.stats.pomodorosCompleted >= 4) activeBadges.push('deep_focus');

            let perfectDayCompleted = false;
            daysOfWeek.forEach(day => { const dayTasks = state.tasks.filter(t => t.day === day.id); if (dayTasks.length > 0 && dayTasks.every(t => t.completed)) perfectDayCompleted = true; });
            if (perfectDayCompleted) activeBadges.push('perfect_day');

            if (state.studyData?.reviews?.filter(r => r.status === 'archived').length >= 1) activeBadges.push('arquivo_organizado');
            if (state.healthData?.workouts?.length >= 1) activeBadges.push('corpo_em_movimento');
            
            const hasFinanceData = (state.financeData?.incomes?.length > 0 || state.financeData?.fixedExpenses?.length > 0 || state.financeData?.variableExpenses?.length > 0 || state.financeData?.moneyJournal?.length > 0);
            if (hasFinanceData) activeBadges.push('tesoureiro_tatico');
            if (state.financeData?.moneyJournal?.some(m => m.action && (m.action.includes('Adiou') || m.action.includes('Cancelou')))) activeBadges.push('blindagem_financeira');

        window.rollbackTaskBadges = function(task) {
            const badgeIds = Array.isArray(task?.rewardedBadgeIds) ? task.rewardedBadgeIds : [];
            if (badgeIds.length === 0) return;

            const stillQualified = window.getCurrentlyQualifiedBadgeIds();
            const badgesToRemove = badgeIds.filter(badgeId => !stillQualified.includes(badgeId));
            if (badgesToRemove.length > 0) {
                state.unlockedBadges = state.unlockedBadges.filter(badgeId => !badgesToRemove.includes(badgeId));
                state.xp = Math.max(0, state.xp - (badgesToRemove.length * 100));
                state.coins = Math.max(0, state.coins - (badgesToRemove.length * 50));
                if (typeof getCorrectLevel === 'function') state.level = getCorrectLevel(state.xp);
                const names = badgesToRemove.map(id => BADGES_DB.find(b => b.id === id)?.title || id).join(', ');
                window.showToast('Conquista revertida', `${names}. A medalha saiu porque a missão foi desmarcada.`, 'rotate-ccw', 'text-orange-400');
            }
            task.rewardedBadgeIds = [];

        window.toggleTask = function(taskId, event) {
            const task = state.tasks.find(t => t.id == taskId);
            if (!task) return;

            if (task.completed) {
                task.completed = false; task.skipped = false;
                const deductedXp = task.rewardedXp || task.xp; const deductedCoins = task.rewardedCoins || Math.round(task.xp * 0.2);
                const energyToRestore = typeof task.rewardedEnergyCost === 'number' ? task.rewardedEnergyCost : task.energyCost;
                state.xp = Math.max(0, state.xp - deductedXp); state.coins = Math.max(0, state.coins - deductedCoins);
                window.changeEnergy(energyToRestore); state.combo = Math.max(0, state.combo - 1);
                window.rollbackTaskBadges(task);
                if (typeof getCorrectLevel === 'function') state.level = getCorrectLevel(state.xp);
                window.spawnFloatingText(event, `-${deductedXp} XP`, 'text-red-400');
            } else {
                const badgesBefore = [...state.unlockedBadges];
                const multiplier = window.getComboMultiplier(); const finalXp = Math.round(task.xp * multiplier); const earnedCoins = Math.round(finalXp * 0.2); 
                task.completed = true; task.rewardedXp = finalXp; task.rewardedCoins = earnedCoins; task.rewardedEnergyCost = task.energyCost; 
                state.xp += finalXp; state.coins += earnedCoins; window.changeEnergy(-task.energyCost); state.combo += 1;
                window.checkGameTriggers();
                task.rewardedBadgeIds = state.unlockedBadges.filter(badgeId => !badgesBefore.includes(badgeId));
                window.spawnFloatingText(event, `+${finalXp} XP`, 'text-indigo-400');

        window.confirmDeleteMainTask = async function(reason = 'cancelada', event = null) {
            if (event) { event.stopPropagation(); event.preventDefault(); }
            const taskId = uiState.deleteTaskPrompt?.taskId;
            const task = state.tasks.find(t => String(t.id) === String(taskId));
            if (!task) { uiState.deleteTaskPrompt = { show: false, taskId: null }; render(); return; }
            const reasonLabels = {
                substituida: 'Substituída por outra missão',
                nao_fiz: 'Não fiz / não vou conseguir fazer',
                cancelada: 'Cancelada ou perdeu prioridade'
            };
            const preserveCombo = reason === 'substituida';
            if (!Array.isArray(state.taskDeletionLog)) state.taskDeletionLog = [];
            const recurrenceGroupId = task.recurrenceGroupId || null;
            const deletedDay = task.day;
            const wasRecurring = Boolean(task.isRecurring || (Array.isArray(task.recurrenceDays) && task.recurrenceDays.length));
            state.taskDeletionLog.push({
                id: Date.now() + Math.random(),
                deletedAt: new Date().toISOString(),
                reason,
                reasonLabel: reasonLabels[reason] || 'Excluída',
                preserveCombo,
                comboBefore: state.combo || 0,
                taskSnapshot: {
                    id: task.id, text: task.text, day: task.day, category: task.category, startTime: task.startTime || '', endTime: task.endTime || '',
                    completed: Boolean(task.completed), isRecurring: Boolean(task.isRecurring), recurrenceGroupId: task.recurrenceGroupId || null,
                    recurrenceDays: Array.isArray(task.recurrenceDays) ? [...task.recurrenceDays] : []
                }
            });

            state.tasks = state.tasks.filter(t => String(t.id) !== String(taskId));

            // Correção crítica: se a missão fazia parte de uma recorrência, remover apenas o dia excluído
            // da série. Sem isso, a validação/relogin recriava a ocorrência apagada.
            if (wasRecurring && recurrenceGroupId && deletedDay) {
                const validDays = daysOfWeek.map(d => d.id);
                const groupTasks = state.tasks.filter(t => String(t.recurrenceGroupId || '') === String(recurrenceGroupId));
                const remainingDays = [...new Set(groupTasks
                    .flatMap(t => Array.isArray(t.recurrenceDays) ? t.recurrenceDays : [t.day])
                    .filter(day => validDays.includes(day) && day !== deletedDay)
                )];

                if (!remainingDays.length) {
                    state.tasks = state.tasks.filter(t => String(t.recurrenceGroupId || '') !== String(recurrenceGroupId));
                } else {
                    state.tasks.forEach(t => {
                        if (String(t.recurrenceGroupId || '') === String(recurrenceGroupId)) {
                            t.recurrenceDays = [...remainingDays];
                            t.isRecurring = true;
                        }
                    });
                }
            }

            if (!preserveCombo) window.breakCombo();
            uiState.deleteTaskPrompt = { show: false, taskId: null };
            await window.saveStateNow();
            window.showToast('Missão excluída', preserveCombo ? 'Substituição registrada. Frenesi preservado.' : 'Exclusão registrada. Frenesi ajustado.', 'trash-2', preserveCombo ? 'text-cyan-300' : 'text-orange-300');

                const aOrder = typeof a?.order === 'number' ? a.order : 999999;
                const bOrder = typeof b?.order === 'number' ? b.order : 999999;
                if (aOrder !== bOrder) return aOrder - bOrder;
                const aTime = window.getCalendarSortMinutes(a);
                const bTime = window.getCalendarSortMinutes(b);
                if (aTime !== bTime) return aTime - bTime;
                return String(a?.text || '').localeCompare(String(b?.text || ''));

        window.handleTaskDrop = function(targetTaskId, event) {
            if (!event || !event.dataTransfer) return;
            event.preventDefault();
            event.stopPropagation();
            if (event.currentTarget) event.currentTarget.classList.remove('task-drag-over');
            const draggedTaskId = event.dataTransfer.getData('text/plain');
            if (!draggedTaskId || String(draggedTaskId) === String(targetTaskId)) return;
            const dragged = state.tasks.find(t => String(t.id) === String(draggedTaskId));
            const target = state.tasks.find(t => String(t.id) === String(targetTaskId));
            if (!dragged || !target) return;
            dragged.day = target.day;
            const ordered = window.sortTasksForDay(target.day).filter(t => String(t.id) !== String(dragged.id));
            const targetIndex = ordered.findIndex(t => String(t.id) === String(target.id));
            ordered.splice(targetIndex < 0 ? ordered.length : targetIndex, 0, dragged);
            ordered.forEach((t, index) => { t.order = index + 1; });
            window.saveState();
            window.showToast('Ordem atualizada', 'Missões reorganizadas no dia.', 'grip-vertical', 'text-cyan-400');
        };

        window.moveTaskOrder = function(taskId, direction, event) {
            if (event) event.stopPropagation();
            const task = state.tasks.find(t => t.id == taskId);
            if (!task) return;
            const ordered = window.sortTasksForDay(task.day);
            const index = ordered.findIndex(t => t.id == taskId);
            const nextIndex = index + direction;
            if (index < 0 || nextIndex < 0 || nextIndex >= ordered.length) return;
            const [item] = ordered.splice(index, 1);
            ordered.splice(nextIndex, 0, item);
            ordered.forEach((t, i) => { t.order = i + 1; });
            window.saveState();
        };

            return (window.findTaskByExactId(state.focusedTaskId) && !window.findTaskByExactId(state.focusedTaskId).completed && window.findTaskByExactId(state.focusedTaskId).day === state.activeTab)
                ? window.findTaskByExactId(state.focusedTaskId)

        window.getPomodoroLockedTask = function(taskIdFromButton = null) {
            let lockedTask = null;

            // Prioridade máxima: o valor EXATO selecionado no dropdown.
            // Não usar parseInt aqui, porque IDs de tarefas podem ter casas decimais.
            // parseInt cortava o ID e fazia o Pomodoro cair em outra tarefa.
            const selectEl = document.getElementById('pomodoro-focused-task-select');
            const selectedId = selectEl ? selectEl.value : '';
            lockedTask = window.findTaskByExactId(selectedId);

            // Fallback: id passado pelo botão, usado apenas quando não houver dropdown.
            if (!lockedTask && taskIdFromButton !== null && typeof taskIdFromButton !== 'undefined' && taskIdFromButton !== '') {
                lockedTask = window.findTaskByExactId(taskIdFromButton);
            }

            // Último fallback: regra antiga do alvo atual.
            if (!lockedTask && window.getCurrentFocusTargetTask) lockedTask = window.getCurrentFocusTargetTask();
            return lockedTask || null;

        window.togglePomodoro = function(taskIdFromButton = null) {
            if (pomodoro.isRunning) { 
                clearInterval(pomodoro.intervalId); 
                pomodoro.isRunning = false; 
            } else { 
                pomodoro.isRunning = true; 
                if (pomodoro.mode === 'focus' && !pomodoro.currentFocusStartedAt) {
                    pomodoro.currentFocusStartedAt = new Date().toISOString();
                    const lockedTask = window.getPomodoroLockedTask(taskIdFromButton);
                    const lockedId = lockedTask ? String(lockedTask.id) : null;
                    pomodoro.currentFocusTaskId = lockedId;
                    pomodoro.currentFocusTaskText = lockedTask ? lockedTask.text : null;
                    pomodoro.currentFocusTaskDay = lockedTask ? lockedTask.day : null;
                    pomodoro.currentFocusTaskCategory = lockedTask ? lockedTask.category : null;
                    pomodoro.focusLock = lockedTask ? {
                        id: lockedId,
                        text: lockedTask.text,
                        day: lockedTask.day,
                        category: lockedTask.category,
                        lockedAt: new Date().toISOString()
                    } : null;
                }
                pomodoro.intervalId = setInterval(() => { 
                    if (pomodoro.timeLeft > 0) { 
                        pomodoro.timeLeft--; 
                        const display = document.getElementById('pomodoro-display'); 
                        if (display) display.innerText = window.formatTime(pomodoro.timeLeft);

        window.handlePomodoroEnd = function() {
            clearInterval(pomodoro.intervalId); 
            pomodoro.isRunning = false; 
            try { new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3').play(); } catch(e) {}
            const s = state.pomodoroSettings;
            if (pomodoro.mode === 'focus') {
                const focusMinutes = parseInt(s.focus) || 25;
                const activeFocusLock = pomodoro.focusLock || null;
                const lockedTaskId = activeFocusLock ? activeFocusLock.id : pomodoro.currentFocusTaskId;
                const lockedTaskText = activeFocusLock ? activeFocusLock.text : pomodoro.currentFocusTaskText;
                const hasLockedTask = lockedTaskId !== null && typeof lockedTaskId !== 'undefined' && lockedTaskId !== '';
                const focusedTask = hasLockedTask ? (window.findTaskByExactId(lockedTaskId) || null) : null;
                const fallbackTask = !hasLockedTask && window.getCurrentFocusTargetTask ? window.getCurrentFocusTargetTask() : null;
                const finalTaskId = hasLockedTask ? String(lockedTaskId) : (fallbackTask ? String(fallbackTask.id) : null);
                const finalTaskText = lockedTaskText || (focusedTask ? focusedTask.text : (fallbackTask ? fallbackTask.text : 'Ciclo sem tarefa vinculada'));
                const startedAt = pomodoro.currentFocusStartedAt || new Date(Date.now() - (focusMinutes * 60000)).toISOString();

                if (pomodoro.cycle % s.cycles === 0) { 
                    pomodoro.mode = 'longBreak'; 
                    pomodoro.timeLeft = s.longBreak * 60; 
                } else { 
                    pomodoro.mode = 'shortBreak'; 
                    pomodoro.timeLeft = s.shortBreak * 60;

                const earnedXP = 30 * window.getComboMultiplier();

                state.coins += earnedCoins; 
                state.stats.pomodorosCompleted = (state.stats.pomodorosCompleted || 0) + 1; 
                window.changeEnergy(-5); 
                pomodoro.currentFocusStartedAt = null;
                pomodoro.currentFocusTaskId = null;
                pomodoro.currentFocusTaskText = null;
                pomodoro.currentFocusTaskDay = null;
                pomodoro.currentFocusTaskCategory = null;
                pomodoro.focusLock = null;

                uiState.pomodoroEvaluationData = {

                window.checkGameTriggers(); 
                window.checkLevelUp();
            } else {
                const wasLongBreak = pomodoro.mode === 'longBreak';
                pomodoro.mode = 'focus'; 
                pomodoro.timeLeft = s.focus * 60;
                pomodoro.currentFocusStartedAt = null;
                pomodoro.currentFocusTaskId = null;
                pomodoro.currentFocusTaskText = null;
                pomodoro.currentFocusTaskDay = null;
                pomodoro.currentFocusTaskCategory = null;

        window.getFocusEfficiencyByTask = function() {
            const cycles = (state.focusData && Array.isArray(state.focusData.cycles)) ? state.focusData.cycles : [];
            const grouped = {};
            cycles.forEach(c => {
                const key = c.taskId ? `task_${c.taskId}` : `text_${c.taskText || 'sem_tarefa'}`;
                if (!grouped[key]) grouped[key] = { taskText: c.taskText || 'Ciclo sem tarefa', total: 0, count: 0, lastDate: c.date };
                grouped[key].total += parseInt(c.efficiency) || 0;
                grouped[key].count += 1;
                if (!grouped[key].lastDate || new Date(c.date) > new Date(grouped[key].lastDate)) grouped[key].lastDate = c.date;
            });
            return Object.values(grouped)
                .map(g => ({ ...g, avg: Math.round(g.total / Math.max(1, g.count)) }))
                .sort((a, b) => new Date(b.lastDate) - new Date(a.lastDate))
                .slice(0, 8);
        };

            }
            const overall = Math.round(cycles.reduce((acc, c) => acc + (parseInt(c.efficiency) || 0), 0) / cycles.length);
            return `
                <div class="bg-slate-950 border border-slate-800 rounded-xl p-4 mb-6">
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 mb-4">

        window.updateEditPreviewCalc = function() {
            const prio = document.getElementById('et-priority')?.value || 'media';

            const time = document.getElementById('et-time')?.value || 30;
            const impactType = document.getElementById('et-impact-type')?.value || 'drain';

            if (xpPreview) xpPreview.innerText = `+${cost.xp} XP`;

                    hpPreview.innerText = `+${Math.abs(cost.hp)} HP (Recarga)`;
                    hpPreview.className = "bg-emerald-900/50 text-emerald-400 px-3 py-1 rounded-md text-xs font-bold";
                } else {
                    hpPreview.innerText = `-${cost.hp} HP (Dreno)`;
                    hpPreview.className = "bg-red-900/50 text-red-400 px-3 py-1 rounded-md text-xs font-bold";

        window.saveEditedTask = function() {
            const task = state.tasks.find(t => t.id == uiState.editingTaskId);
            if (!task) { window.showAlertModal('Missão não encontrada.'); return; }
            const text = document.getElementById('et-text')?.value.trim();
            if (!text) { window.showAlertModal('Título vazio.'); return; }
            const oldDay = task.day;
            const newDay = document.getElementById('et-day')?.value || task.day || state.activeTab;
            const activeCategories = window.getTaskCategories();
            const selectedCategory = document.getElementById('et-category')?.value || activeCategories[0]?.id || task.category || 'geral';
            const priority = document.getElementById('et-priority')?.value || task.priority || 'media';
            const complexity = parseInt(document.getElementById('et-complexity')?.value, 10) || 1;
            const timeVal = parseInt(document.getElementById('et-time')?.value, 10) || 30;
            const impactType = document.getElementById('et-impact-type')?.value || 'drain';
            const cost = window.calculateTaskCost(priority, complexity, timeVal, impactType);
            const calendarTime = window.readCalendarTimeFields('et', timeVal);
            if (!calendarTime) return;
            const recurrenceDays = daysOfWeek
                .filter(d => document.getElementById(`et-repeat-${d.id}`)?.checked)
                .map(d => d.id);
            const isRecurring = recurrenceDays.length > 0;

            const applyValues = (target, targetDay) => {
                target.text = text;
                target.day = targetDay;
                target.category = selectedCategory;
                target.priority = priority;
                target.complexity = complexity;
                target.time = `${timeVal} min`;
                target.impactType = impactType;
                target.startTime = calendarTime.startTime;
                target.endTime = calendarTime.endTime;
                target.xp = cost.xp;
                target.energyCost = cost.hp;
                return target;
            };

            if (isRecurring) {
                const groupId = task.recurrenceGroupId || `rec-${Date.now()}-${Math.random().toString(16).slice(2)}`;
                const oldGroupDays = state.tasks
                    .filter(t => String(t.recurrenceGroupId || '') === String(groupId) || String(t.id) === String(task.id))
                    .map(t => t.day)
                    .filter(Boolean);

                applyValues(task, recurrenceDays.includes(newDay) ? newDay : recurrenceDays[0]);
                task.isRecurring = true;
                task.recurrenceDays = [...recurrenceDays];
                task.recurrenceGroupId = groupId;

                window.upsertRecurringTaskOccurrences(task, recurrenceDays, { removeUnselected: true });
                [...new Set([...oldGroupDays, ...recurrenceDays, oldDay])].forEach(dayId => {
                    if (typeof window.reindexTaskOrderForDay === 'function') window.reindexTaskOrderForDay(dayId);
                });
                uiState.showEditTaskModal = false;
                uiState.editingTaskId = null;
                window.showToast('Recorrência atualizada', `Horário sincronizado em ${recurrenceDays.length} dia(s): ${window.getRecurringDaysLabel(recurrenceDays)}.`, 'repeat', 'text-violet-300');
                window.saveState();
                return;
            }

            applyValues(task, newDay);
            task.isRecurring = false;
            task.recurrenceDays = [];
            delete task.recurrenceGroupId;
            if (oldDay !== newDay) {
                task.order = window.getNextTaskOrder(newDay);
                window.reindexTaskOrderForDay(oldDay);
                window.reindexTaskOrderForDay(newDay);
            } else {
                if (typeof task.order !== 'number') task.order = window.getNextTaskOrder(newDay);
                window.reindexTaskOrderForDay(newDay);
            }
            uiState.showEditTaskModal = false;
            uiState.editingTaskId = null;
            window.showToast('Missão atualizada', 'Horário, dificuldade, tempo e categoria foram ajustados. O dia será reordenado automaticamente.', 'pencil', 'text-amber-400');
            window.saveState();
        };
        
        window.calculateTaskCost = function(priority, complexity, time, impactType) {
            const prioMult = { 'essencial': 1.5, 'alta': 1.2, 'media': 1.0, 'baixa': 0.8 }[priority] || 1.0;
            const compVal = parseInt(complexity) || 1; const timeVal = parseInt(time) || 15;
            let calcXp = Math.round((20 + (compVal * 15) + (timeVal * 1.5)) * prioMult);
            let calcHp = Math.round((compVal * 5) + (timeVal * 0.4));
            if(priority === 'essencial') calcHp = Math.round(calcHp * 0.8);
            if(priority === 'baixa') calcHp = Math.round(calcHp * 1.2); 
            calcHp = Math.min(calcHp, 60); if (impactType === 'recharge') calcHp = -Math.round(calcHp * 0.8); 
            return { xp: calcXp, hp: calcHp };
        };

            const time = document.getElementById('ct-time')?.value || 30; const impactType = document.getElementById('ct-impact-type')?.value || 'drain';

            const xpPreview = document.getElementById('ct-xp-preview'); const hpPreview = document.getElementById('ct-hp-preview');
            if(xpPreview) xpPreview.innerText = `+${cost.xp} XP`;
            if(hpPreview) {
                if (cost.hp < 0) { hpPreview.innerText = `+${Math.abs(cost.hp)} HP (Recarga)`; hpPreview.className = "bg-emerald-900/50 text-emerald-400 px-3 py-1 rounded-md text-xs font-bold"; } 
                else { hpPreview.innerText = `-${cost.hp} HP (Dreno)`; hpPreview.className = "bg-red-900/50 text-red-400 px-3 py-1 rounded-md text-xs font-bold"; }
            }
        };

            if (!calendarTime) return;
            const recurrenceDays = daysOfWeek
                .filter(d => document.getElementById(`ct-repeat-${d.id}`)?.checked)
                .map(d => d.id);
            const isRecurring = recurrenceDays.length > 0;
            const daysToCreate = isRecurring ? recurrenceDays : [selectedDay];

                    order: window.getNextTaskOrder(targetDay),
                    subtasks: window.cloneSubtasksForNewTask(baseSubtasks),
                    isRecurring,
                    recurrenceDays: isRecurring ? [...recurrenceDays] : [],
                    recurrenceGroupId
                });
            });

            if (isRecurring) {
                const firstOccurrence = state.tasks.find(t => String(t.recurrenceGroupId || '') === String(recurrenceGroupId));
                if (firstOccurrence) window.upsertRecurringTaskOccurrences(firstOccurrence, recurrenceDays, { removeUnselected: true });

        window.toggleRechargeModal = function() { uiState.showRechargeModal = !uiState.showRechargeModal; render(); };

        // ==========================================
        // MÓDULO: RECARGA EXECUTIVA
        // ==========================================
        window.getRechargeActions = function() {
            if (!state.rechargeData) state.rechargeData = { actions: [], logs: [] };
            if (!Array.isArray(state.rechargeData.actions)) state.rechargeData.actions = [];
            return state.rechargeData.actions
                .filter(action => action.active !== false)
                .sort((a, b) => (a.isDefault === b.isDefault ? String(a.title).localeCompare(String(b.title)) : (a.isDefault ? -1 : 1)));
        };

        window.useRechargeAction = function(actionId) {
            const action = state.rechargeData?.actions?.find(a => String(a.id) === String(actionId) && a.active !== false);
            if (!action) { window.showAlertModal('Recarga não encontrada.'); return; }

            const energyGain = Math.max(0, Math.min(100, parseInt(action.energyGain, 10) || 0));
            const xpGain = Math.max(0, Math.min(100, parseInt(action.xp, 10) || 0));
            const duration = Math.max(1, Math.min(240, parseInt(action.duration, 10) || 5));
            const beforeEnergy = state.energy;

            if (energyGain > 0 && beforeEnergy >= 100) {
                window.showAlertModal('Sua Bateria Executiva já está em 100%. Use a recarga quando houver desgaste real.');
                return;
            }

            window.changeEnergy(energyGain);
            const afterEnergy = state.energy;
            if (xpGain > 0) {
                state.xp += xpGain;
                window.checkLevelUp();
            }

            state.rechargeData.logs.push({
                id: Date.now(),
                actionId: action.id,
                title: action.title,
                type: action.type || 'custom',
                duration,
                energyGainPlanned: energyGain,
                energyGainApplied: Math.max(0, afterEnergy - beforeEnergy),
                xpAwarded: xpGain,
                beforeEnergy,
                afterEnergy,
                date: new Date().toISOString()
            });

            window.saveState();
            window.showToast('Bateria recarregada', `+${Math.max(0, afterEnergy - beforeEnergy)} HP registrado.`, action.icon || 'battery-charging', 'text-emerald-400');
        };

        window.addRechargeAction = function() {
            const title = document.getElementById('recharge-title')?.value.trim();
            const description = document.getElementById('recharge-desc')?.value.trim() || 'Recarga personalizada para recuperar bateria executiva.';
            const icon = document.getElementById('recharge-icon')?.value || 'battery-charging';
            let energyGain = parseInt(document.getElementById('recharge-energy')?.value, 10);
            let duration = parseInt(document.getElementById('recharge-duration')?.value, 10);
            let xp = parseInt(document.getElementById('recharge-xp')?.value, 10);

            if (!title) { window.showAlertModal('Nome da recarga é obrigatório.'); return; }
            if (isNaN(energyGain)) energyGain = 10;
            if (isNaN(duration)) duration = 5;
            if (isNaN(xp)) xp = 0;

            energyGain = Math.max(1, Math.min(100, energyGain));
            duration = Math.max(1, Math.min(240, duration));
            xp = Math.max(0, Math.min(100, xp));

            state.rechargeData.actions.push({
                id: `custom-recharge-${Date.now()}`,
                title,
                description,
                icon,
                energyGain,
                duration,
                xp,
                type: 'custom',
                active: true,
                isDefault: false,
                createdAt: new Date().toISOString()
            });

            window.saveState();
            window.showToast('Recarga criada', 'Nova opção adicionada ao Arsenal de Energia.', 'battery-charging', 'text-emerald-400');
        };

        window.deleteRechargeAction = function(actionId) {
            const action = state.rechargeData?.actions?.find(a => String(a.id) === String(actionId));
            if (!action) { window.showAlertModal('Recarga não encontrada.'); return; }
            const message = action.isDefault
                ? `Remover "${action.title}" do painel? Você pode recuperar os padrões futuramente em uma nova versão.`
                : `Excluir a recarga personalizada "${action.title}"? O histórico já registrado será preservado.`;
            window.showConfirmModal(message, () => {
                action.active = false;
                window.saveState();
                window.showToast('Recarga removida', 'O histórico foi preservado.', 'archive', 'text-slate-300');
            });
        };

        window.renderRechargeModule = function() {
            const actions = window.getRechargeActions();
            const todayKey = window.getLocalDateKey();
            const todayLogs = (state.rechargeData?.logs || [])
                .filter(log => window.getLocalDateKey(log.date) === todayKey)
                .sort((a, b) => new Date(b.date) - new Date(a.date));
            const totalHpToday = todayLogs.reduce((sum, log) => sum + (Number(log.energyGainApplied) || 0), 0);

            const actionCards = actions.map(action => {
                const hp = Number(action.energyGain) || 0;
                const xp = Number(action.xp) || 0;
                return `
                    <div class="bg-slate-950 border border-slate-800 rounded-2xl p-4 flex flex-col gap-3 hover:border-emerald-800/60 transition-colors">

                            <div class="bg-emerald-950/50 border border-emerald-900/50 rounded-xl p-2 shrink-0"><i data-lucide="${action.icon || 'battery-charging'}" class="w-5 h-5 text-emerald-400"></i></div>

                            <button onclick="window.useRechargeAction('${action.id}')" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-black py-2.5 rounded-xl text-xs uppercase tracking-widest transition-colors">Executar recarga</button>
                            <button onclick="window.deleteRechargeAction('${action.id}')" class="bg-slate-900 hover:bg-red-950/50 text-slate-500 hover:text-red-400 border border-slate-800 px-3 rounded-xl transition-colors" title="Remover recarga"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                        </div>

            const logsHtml = todayLogs.length ? todayLogs.slice(0, 8).map(log => `
                <div class="bg-slate-950 border border-slate-800 rounded-xl p-3 flex justify-between items-center gap-3">
                    <div>
                        <div class="text-xs font-bold text-white">${log.title}</div>
                        <div class="text-[10px] text-slate-500 uppercase tracking-widest mt-0.5">${new Date(log.date).toLocaleTimeString('pt-BR', {hour: '2-digit', minute: '2-digit'})} • ${log.duration || 0} min</div>
                    </div>
                    <div class="text-emerald-400 text-xs font-black">+${log.energyGainApplied || 0} HP</div>
                </div>
            `).join('') : `<p class="text-xs text-slate-500 italic">Nenhuma recarga registrada hoje.</p>`;

            return `
                <div class="grid grid-cols-1 lg:grid-cols-[1fr_0.8fr] gap-5">

                        <div class="bg-slate-950/70 border border-emerald-900/30 rounded-2xl p-4">
                            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-4">
                                <div>
                                    <h3 class="text-sm font-black text-emerald-400 uppercase tracking-widest flex items-center gap-2"><i data-lucide="battery-charging" class="w-4 h-4"></i> Arsenal de Recarga</h3>

                                    <div class="text-[10px] text-slate-500 uppercase font-bold tracking-widest">HP Atual</div>
                                    <div class="text-xl font-black ${state.energy < 20 ? 'text-red-400' : 'text-emerald-400'}">${state.energy}%</div>
                                </div>
                            </div>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-3">${actionCards}</div>
                        </div>
                    </div>

                    <div class="space-y-5">
                        <div class="bg-slate-950 border border-slate-800 rounded-2xl p-4">
                            <h3 class="text-sm font-black text-white uppercase tracking-widest mb-3 flex items-center gap-2"><i data-lucide="plus-circle" class="w-4 h-4 text-emerald-400"></i> Criar recarga</h3>
                            <div class="space-y-3">
                                <div><label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest">Nome</label><input id="recharge-title" placeholder="Ex.: Café sem tela, banho, leitura leve" class="w-full mt-1 bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-white outline-none focus:border-emerald-500"></div>
                                <div><label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest">Descrição</label><input id="recharge-desc" placeholder="Explique quando usar esta recarga" class="w-full mt-1 bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-white outline-none focus:border-emerald-500"></div>
                                <div class="grid grid-cols-2 gap-2">
                                    <div><label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest">HP recuperado</label><input id="recharge-energy" type="number" value="10" min="1" max="100" class="w-full mt-1 bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-white outline-none focus:border-emerald-500"></div>
                                    <div><label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest">Duração min.</label><input id="recharge-duration" type="number" value="5" min="1" max="240" class="w-full mt-1 bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-white outline-none focus:border-emerald-500"></div>
                                </div>
                                <div class="grid grid-cols-2 gap-2">
                                    <div><label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest">XP opcional</label><input id="recharge-xp" type="number" value="0" min="0" max="100" class="w-full mt-1 bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-white outline-none focus:border-emerald-500"></div>

                        </div>
                    </div>
                </div>`;
        };

        // ==========================================
        // MÓDULO: RITUAIS OPERACIONAIS
        // ==========================================
        window.addRitual = function() {
            const title = document.getElementById('ritual-title')?.value.trim();
            const period = document.getElementById('ritual-period')?.value || 'morning';
            let xp = parseInt(document.getElementById('ritual-xp')?.value, 10);
            let energyDelta = parseInt(document.getElementById('ritual-energy')?.value, 10);

            if (!title) { window.showAlertModal('Nome do ritual é obrigatório.'); return; }
            if (!['morning', 'night'].includes(period)) { window.showAlertModal('Período inválido.'); return; }
            if (isNaN(xp)) xp = 10;
            if (isNaN(energyDelta)) energyDelta = 0;

            state.routineData.rituals.push({
                id: Date.now(),
                title,
                period,
                xp,
                energyDelta,
                active: true,
                createdAt: new Date().toISOString()
            });

            if (typeof window.checkGameTriggers === "function") window.checkGameTriggers();
            window.saveState();
            window.showToast('Ritual criado', 'Protocolo operacional adicionado.', 'clipboard-check', 'text-emerald-400');
        };

        window.completeRitual = function(ritualId) {
            const ritual = state.routineData.rituals.find(r => r.id === ritualId && r.active !== false);
            if (!ritual) { window.showAlertModal('Ritual não encontrado.'); return; }

            const todayKey = window.getLocalDateKey();
            const alreadyDone = state.routineData.logs.some(log => 
                log.ritualId === ritualId && window.getLocalDateKey(log.date || log.completedAt) === todayKey
            );

            if (alreadyDone) {
                window.showAlertModal('Este ritual já foi concluído hoje.');
                return;
            }

            const xpAwarded = Number.isFinite(Number(ritual.xp)) ? Number(ritual.xp) : 10;
            const energyDeltaApplied = Number.isFinite(Number(ritual.energyDelta)) ? Number(ritual.energyDelta) : 0;

            state.routineData.logs.push({
                id: Date.now(),
                ritualId,
                date: new Date().toISOString(),
                completedAt: new Date().toISOString(),
                xpAwarded,
                energyDeltaApplied
            });

            state.xp += xpAwarded;
            window.changeEnergy(energyDeltaApplied);
            window.checkLevelUp();
            if (typeof window.checkGameTriggers === "function") window.checkGameTriggers();
            window.saveState();
            window.showToast('Ritual concluído', `+${xpAwarded} XP. Consistência operacional registrada.`, 'check-circle', 'text-emerald-400');
        };

        window.deleteRitual = function(ritualId) {
            window.showConfirmModal('Deseja arquivar este ritual? O histórico será preservado.', () => {
                const ritual = state.routineData.rituals.find(r => r.id === ritualId);
                if (!ritual) { window.showAlertModal('Ritual não encontrado.'); return; }
                ritual.active = false;
                window.saveState();
                window.showToast('Ritual arquivado', 'Histórico preservado.', 'archive', 'text-slate-300');
            });
        };

        window.fillRitualSuggestion = function(title, period, xp, energyDelta) {
            const titleInput = document.getElementById('ritual-title');
            const periodInput = document.getElementById('ritual-period');
            const xpInput = document.getElementById('ritual-xp');
            const energyInput = document.getElementById('ritual-energy');

            if (titleInput) titleInput.value = title;
            if (periodInput) periodInput.value = period;
            if (xpInput) xpInput.value = xp;
            if (energyInput) energyInput.value = energyDelta;
        };

        window.isRitualCompletedToday = function(ritualId) {
            const todayKey = window.getLocalDateKey();
            return state.routineData.logs.some(log => 
                log.ritualId === ritualId && window.getLocalDateKey(log.date || log.completedAt) === todayKey
            );
        };

        window.renderRitualsSection = function() {
            const rituals = (state.routineData?.rituals || []).filter(r => r.active !== false);
            const morning = rituals.filter(r => r.period === 'morning');
            const night = rituals.filter(r => r.period === 'night');

                            }

                        <div class="space-y-2">${renderRitualList(morning, 'Nenhum ritual matinal ativo.')}</div>

                        <h3 class="text-xs font-bold uppercase tracking-widest text-indigo-400 mb-3 flex items-center gap-2"><i data-lucide="moon" class="w-4 h-4"></i> Ritual Noturno</h3>
                        <div class="space-y-2">${renderRitualList(night, 'Nenhum ritual noturno ativo.')}</div>
                    </div>
                </div>

                ${rituals.length === 0 ? `<div class="mb-4 bg-slate-950 border border-slate-800 rounded-lg p-3 text-xs text-slate-500 italic">Nenhum ritual ativo. Crie um protocolo matinal ou noturno.</div>` : ''}

                <div class="bg-slate-950 border border-slate-800 rounded-xl p-4">
                    <h3 class="text-xs font-bold uppercase tracking-widest text-slate-400 mb-3">Criar Ritual</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-3 mb-4">
                        <label class="block lg:col-span-2">
                            <span class="block text-[10px] uppercase tracking-widest font-bold text-slate-500 mb-1">Nome do ritual</span>
                            <input id="ritual-title" type="text" placeholder="Ex.: Beber água" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-white outline-none focus:border-emerald-500">
                        </label>
                        <label class="block">
                            <span class="block text-[10px] uppercase tracking-widest font-bold text-slate-500 mb-1">Período</span>
                            <select id="ritual-period" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-white outline-none focus:border-emerald-500">
                                <option value="morning">Manhã</option>
                                <option value="night">Noite</option>
                            </select>
                        </label>
                        <div class="grid grid-cols-2 gap-2">
                            <label class="block">
                                <span class="block text-[10px] uppercase tracking-widest font-bold text-indigo-400 mb-1">XP</span>
                                <input id="ritual-xp" type="number" value="10" placeholder="10" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-white outline-none focus:border-emerald-500">

                                <input id="ritual-energy" type="number" value="0" placeholder="0" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-white outline-none focus:border-emerald-500">
                            </label>

                    </div>
                    <div class="bg-slate-900/70 border border-slate-800 rounded-xl p-3 mb-4 text-[11px] text-slate-400 leading-relaxed">
                        <b class="text-indigo-300">XP</b> é a experiência ganha ao concluir o ritual. <b class="text-emerald-300">HP</b> altera sua Bateria Executiva: número positivo recupera energia, número negativo consome energia. Ex.: <span class="text-emerald-400">5</span> recupera HP; <span class="text-red-400">-5</span> consome HP.

        let clockInterval;
        function startClock() {
            if(clockInterval) clearInterval(clockInterval);
            clockInterval = setInterval(() => {
                const el = document.getElementById('time-operational-widget');
                if(el) {
                    const now = new Date();
                    const time = now.toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'});
                    const date = now.toLocaleDateString('pt-BR', {weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'});
                    const hour = now.getHours();
                    let greeting = "Boa noite", contextMsg = "Feche ciclos e reduza carga.";
                    if(hour >= 0 && hour < 5) { greeting = "Boa madrugada"; contextMsg = "Modo vigília. Priorize descanso se possível."; }
                    else if(hour >= 5 && hour < 12) { greeting = "Bom dia"; contextMsg = "Inicie com uma missão essencial."; }
                    else if(hour >= 12 && hour < 18) { greeting = "Boa tarde"; contextMsg = "Mantenha cadência."; }
                    
                    el.innerHTML = `
                        <div class="flex items-center gap-3">
                            <i data-lucide="clock" class="w-8 h-8 text-indigo-500 opacity-80"></i>
                            <div>
                                <div class="text-2xl font-black text-white leading-none tabular-nums tracking-wider">${time}</div>
                                <div class="text-[10px] text-slate-400 uppercase font-bold tracking-widest mt-1">${date}</div>
                            </div>
                        </div>
                        <div class="text-xs text-indigo-300 mt-3 border-t border-slate-800 pt-2 font-medium">
                            <strong class="text-white">${greeting}, ${window.escapeHtml(window.getUserDisplayName())}.</strong> <span class="text-slate-500">${contextMsg}</span>
                        </div>
                    `;
                    // Refresh icon only if needed, but since it's static we can skip re-creating lucide inside setInterval usually.
                }
            }, 1000);
        }

        window.toggleStudyModal = function() { uiState.showStudyModal = !uiState.showStudyModal; render(); };

        window.addSubject = function() {
            const name = document.getElementById('new-subject-name')?.value.trim();
            const trackId = document.getElementById('new-subject-track')?.value || '';
            const color = document.getElementById('new-subject-color')?.value || 'bg-cyan-500';
            if (!name) { window.showAlertModal('Digite o nome da disciplina.'); return; }
            if (!trackId) { window.showAlertModal('Escolha a trilha à qual esta disciplina pertence.'); return; }
            const duplicate = state.studyData.subjects.some(s => String(s.trackId) === String(trackId) && String(s.name || '').trim().toLowerCase() === name.toLowerCase());
            if (duplicate) { window.showAlertModal('Esta disciplina já existe dentro da trilha escolhida.'); return; }
            state.studyData.subjects.push({ id: Date.now(), name, trackId, color, createdAt: new Date().toISOString() });
            const track = window.getStudyTrack(trackId);
            window.showToast('Disciplina adicionada', `${name} entrou na trilha ${track.name}.`, 'book', track.color || 'text-cyan-400');
            window.saveState();
        };

        window.getStudySubjects = function(trackId = null) {
            const subjects = Array.isArray(state.studyData?.subjects) ? state.studyData.subjects : [];
            const filtered = trackId === null || trackId === undefined || trackId === ''
                ? subjects
                : subjects.filter(s => String(s.trackId || '') === String(trackId));
            return filtered.slice().sort((a, b) => String(a.name || '').localeCompare(String(b.name || ''), 'pt-BR'));
        };

        window.renderStudySubjectOptions = function({ trackId = null, selectedId = '', includeEmpty = true, emptyLabel = 'Sem disciplina vinculada' } = {}) {
            const tracks = window.getStudyTracks(true);
            const selected = String(selectedId || '');
            let html = includeEmpty ? `<option value="">${window.escapeHtml(emptyLabel)}</option>` : '';
            const appendOptions = (subjects, label = '') => {
                if (!subjects.length) return;
                if (label) html += `<optgroup label="${window.escapeHtml(label)}">`;
                html += subjects.map(s => `<option value="${s.id}" ${String(s.id) === selected ? 'selected' : ''}>${window.escapeHtml(s.name)}</option>`).join('');
                if (label) html += '</optgroup>';
            };
            if (trackId !== null && trackId !== undefined && trackId !== '') {
                const track = window.getStudyTrack(trackId);
                appendOptions(window.getStudySubjects(trackId), track.name);
                if (window.getStudySubjects(trackId).length === 0) html += '<option value="" disabled>Nenhuma disciplina cadastrada nesta trilha</option>';
                return html;
            }
            tracks.forEach(track => appendOptions(window.getStudySubjects(track.id), track.name));
            appendOptions(state.studyData.subjects.filter(s => !s.trackId), 'Sem trilha');
            return html;
        };

        window.updateSubjectTrack = function(subjectId, trackId) {
            const subject = state.studyData.subjects.find(s => String(s.id) === String(subjectId));
            const track = window.getStudyTracks(true).find(t => String(t.id) === String(trackId));
            if (!subject || !track) { window.showAlertModal('Disciplina ou trilha não encontrada.'); return; }
            subject.trackId = track.id;
            subject.updatedAt = new Date().toISOString();
            (state.studyData.studyPlan?.weeklyBlocks || []).forEach(block => {
                if (String(block.subjectId) === String(subject.id)) block.trackId = track.id;
            });
            window.saveState();
            window.showToast('Disciplina reorganizada', `${subject.name} agora pertence à trilha ${track.name}.`, 'route', track.color || 'text-cyan-400');
        };

            const subjectLabel = document.getElementById('study-block-subject-label');

            window.showConfirmModal(`Excluir a disciplina "${subject.name}"? Sessões, revisões e registros de erro ligados a ela serão apagados. Blocos do planejamento serão preservados sem disciplina vinculada.`, () => {
                state.studyData.subjects = state.studyData.subjects.filter(s => String(s.id) !== String(id));
                state.studyData.sessions = state.studyData.sessions.filter(s => String(s.subjectId) !== String(id));
                state.studyData.reviews = state.studyData.reviews.filter(r => String(r.subjectId) !== String(id));
                state.studyData.errorLog = state.studyData.errorLog.filter(e => String(e.subjectId) !== String(id));
