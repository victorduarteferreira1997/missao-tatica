        window.logStudySession = function() {
            const subjectId = parseInt(document.getElementById('session-subject').value);
            const type = document.getElementById('session-type').value;
            const duration = parseInt(document.getElementById('session-duration').value);
            const qTotal = parseInt(document.getElementById('session-q-total').value) || 0;
            const qCorrect = parseInt(document.getElementById('session-q-correct').value) || 0;
            const topic = document.getElementById('session-topic').value.trim();
            const confBefore = parseInt(document.getElementById('session-conf-before').value);
            const confAfter = parseInt(document.getElementById('session-conf-after').value);
            const barriers = Array.from(document.querySelectorAll('input[name="session-barriers"]:checked')).map(cb => cb.value);

            if (!subjectId) { window.showAlertModal('Selecione uma disciplina.'); return; }
            if (qCorrect > qTotal) { window.showAlertModal('Acertos > Total.'); return; }

            const sessionId = Date.now();
            const typeData = SESSION_TYPES[type] || SESSION_TYPES['leitura'];
            const xpEarned = Math.round(((duration * 1.5) + (qCorrect * 3)) * typeData.mult);
            const energyDelta = -typeData.hp;

            let generatedReviewIds = [];

            // Adicionar repetição espaçada se for teoria ou leitura
            if (['teoria', 'leitura'].includes(type)) {
                [1, 7, 30].forEach(days => {
                    const reviewId = Date.now() + Math.random();
                    generatedReviewIds.push(reviewId);
                    const dueDate = new Date(); dueDate.setDate(dueDate.getDate() + days);
                    state.studyData.reviews.push({ 
                        id: reviewId, 
                        sourceSessionId: sessionId, 
                        subjectId: subjectId, 
                        topic: topic || 'Revisão Geral', 
                        dueDate: dueDate.toISOString(), 
                        intervalDays: days, 
                        status: 'pending',
                        phase: 'initial',
                        cycleStep: days,
                        xpAwarded: 0
                    });
                });
            }

            state.studyData.sessions.push({
                id: sessionId, subjectId, type, duration, qTotal, qCorrect, topic, 
                date: new Date().toISOString(), confBefore, confAfter, barriers,
                xpAwarded: xpEarned, energyDeltaApplied: energyDelta, generatedReviewIds: generatedReviewIds, createdAt: new Date().toISOString()
            });

            state.xp += xpEarned; window.changeEnergy(energyDelta);
            window.checkLevelUp();
            if (typeof window.checkGameTriggers === "function") window.checkGameTriggers();

            if (generatedReviewIds.length > 0) {
                window.showToast('Sessão Registrada!', `+${xpEarned} XP. Revisão programada.`, 'brain', 'text-fuchsia-400');
            } else {
                window.showToast('Sessão Registrada!', `+${xpEarned} XP consolidados.`, 'target', 'text-cyan-400');
            }

            if(state.energy < 20) {
                setTimeout(() => window.showAlertModal("Bateria Executiva Crítica (<20 HP). O sistema recomenda transição para atividades passivas ou encerramento."), 1000);
            }
            window.saveState();
        };

        window.recalculateLevelFromXp = function() {
            if (state.xp < 0) state.xp = 0;
            state.level = getCorrectLevel(state.xp);
        };

        window.deleteStudySession = function(sessionId) {
            const sessionIndex = state.studyData.sessions.findIndex(s => s.id === sessionId);
            if (sessionIndex === -1) {
                window.showAlertModal("Sessão não encontrada.");
                return;
            }
            const session = state.studyData.sessions[sessionIndex];

            window.showConfirmModal("Tem certeza que deseja excluir esta sessão? O XP, energia e revisões ligadas a ela serão recalculados.", () => {
                state.studyData.sessions.splice(sessionIndex, 1);

                let xpToDeduct = session.xpAwarded;
                if (typeof xpToDeduct === 'undefined') {
                    const typeData = SESSION_TYPES[session.type] || SESSION_TYPES['leitura'];
                    xpToDeduct = Math.round(((session.duration * 1.5) + (session.qCorrect * 3)) * typeData.mult);
                }
                state.xp -= xpToDeduct;

                let energyToRevert = session.energyDeltaApplied;
                if (typeof energyToRevert === 'undefined') {
                    const typeData = SESSION_TYPES[session.type] || SESSION_TYPES['leitura'];
                    energyToRevert = -typeData.hp; 
                }
                state.energy -= energyToRevert; 

                const reviewsToRemove = state.studyData.reviews.filter(r => 
                    r.sourceSessionId === sessionId || 
                    (session.generatedReviewIds && session.generatedReviewIds.includes(r.id))
                );
                
                reviewsToRemove.forEach(r => {
                    if (r.xpAwarded) {
                        state.xp -= r.xpAwarded;
                    }
                });

                state.studyData.reviews = state.studyData.reviews.filter(r => 
                    r.sourceSessionId !== sessionId && 
                    !(session.generatedReviewIds && session.generatedReviewIds.includes(r.id))
                );

                if (state.xp < 0) state.xp = 0;
                if (state.energy < 0) state.energy = 0;
                if (state.energy > 100) state.energy = 100;

                window.recalculateLevelFromXp();

                window.showToast("Sessão excluída", "XP, energia e revisões foram recalculados.", "trash-2", "text-red-400");
                window.saveState();
            });
        };
        
        window.archiveReview = function(reviewId) {
            const review = state.studyData.reviews.find(r => r.id === reviewId);
            if (!review) {
                window.showAlertModal("Revisão não encontrada.");

            if (review.status !== "completed") {
                window.showAlertModal("Somente revisões concluídas podem ser arquivadas.");

            window.showConfirmModal("Deseja arquivar esta revisão concluída? Ela continuará no histórico, mas sairá da lista principal.", () => {
                review.status = "archived";
                review.archivedAt = new Date().toISOString();

        window.showReviewPrompt = function(reviewId) { uiState.customPrompt = { show: true, type: 'reviewDifficulty', reviewId: reviewId }; render(); };
        window.closeCustomPrompt = function() { uiState.customPrompt = { show: false, type: '', reviewId: null }; render(); };
        
        window.processReviewDifficulty = function(diffStr) {
            const review = state.studyData.reviews.find(r => r.id === uiState.customPrompt.reviewId);
            if(review) {
                let xp = 0;
                if(diffStr === 'easy') { xp = 20; }
                else if(diffStr === 'medium') { xp = 35; }
                else if(diffStr === 'hard') { xp = 50; }
                else { xp = 60; }
                
                review.status = 'completed'; 
                review.completedAt = new Date().toISOString();
                review.xpAwarded = xp;
                review.difficultyOrigin = diffStr;
                
                state.xp += xp; window.checkLevelUp();
                
                const phase = review.phase || "initial";
                const step = review.cycleStep || review.intervalDays;
                
                let createNew = false;
                let nextDays = 0;
                let nextPhase = phase;
                let nextCycleStep = 0;

                if (phase === "initial") {
                    if (step === 1 || step === 7) {
                        createNew = false;
                    } else {
                        createNew = true;
                        if(diffStr === 'easy') { nextDays = 60; nextPhase = "maintenance"; nextCycleStep = 60; }
                        else if(diffStr === 'medium') { nextDays = 30; nextPhase = "initial"; nextCycleStep = 30; }
                        else if(diffStr === 'hard') { nextDays = 7; nextPhase = "initial"; nextCycleStep = 7; }
                        else { nextDays = 1; nextPhase = "initial"; nextCycleStep = 1; }
                    }
                } else if (phase === "maintenance") {
                    createNew = true;
                    if(diffStr === 'easy') { nextDays = 90; nextPhase = "maintenance"; nextCycleStep = 90; }
                    else if(diffStr === 'medium') { nextDays = 60; nextPhase = "maintenance"; nextCycleStep = 60; }
                    else if(diffStr === 'hard') { nextDays = 15; nextPhase = "maintenance"; nextCycleStep = 15; }
                    else { nextDays = 3; nextPhase = "maintenance"; nextCycleStep = 3; }
                }

                if (createNew) {
                    const newReviewId = Date.now() + Math.random();
                    review.nextReviewId = newReviewId;
                    
                    const dueDate = new Date(); dueDate.setDate(dueDate.getDate() + nextDays);
                    
                    const session = state.studyData.sessions.find(s => s.id === review.sourceSessionId);
                    if (session && session.generatedReviewIds) {
                        session.generatedReviewIds.push(newReviewId);
                    }

                    state.studyData.reviews.push({ 
                        id: newReviewId, 
                        sourceSessionId: review.sourceSessionId, 
                        subjectId: review.subjectId, 
                        topic: review.topic, 
                        dueDate: dueDate.toISOString(), 
                        intervalDays: nextDays, 
                        status: 'pending', 
                        difficultyOrigin: diffStr,
                        phase: nextPhase,
                        cycleStep: nextCycleStep,
                        xpAwarded: 0
                    });
                    
                    window.showToast('Revisão Calibrada', `+${xp} XP. Nova revisão em ${nextDays} dias.`, 'check-circle', 'text-emerald-400');
                } else {
                    window.showToast('Revisão Concluída', `+${xp} XP. Próxima etapa já estava programada.`, 'check-circle', 'text-emerald-400');
                }
                
                window.closeCustomPrompt(); if (typeof window.checkGameTriggers === "function") window.checkGameTriggers(); window.saveState();
            }
        };

        window.getSubjectStats = function(subjectId) {
            const sessions = state.studyData.sessions.filter(s => s.subjectId === subjectId);
            const totalTime = sessions.reduce((acc, s) => acc + s.duration, 0);
            const totalQ = sessions.reduce((acc, s) => acc + s.qTotal, 0);
            const correctQ = sessions.reduce((acc, s) => acc + s.qCorrect, 0);
            const retention = totalQ > 0 ? Math.round((correctQ / totalQ) * 100) : 0;
            const lastSession = sessions.length > 0 ? new Date(Math.max(...sessions.map(s => new Date(s.date)))) : null;
            return { totalTime, totalQ, correctQ, retention, lastSession };
        };

        window.saveStudyPlanBlockChanges = function() {
            const weeklyBlocks = state.studyData?.studyPlan?.weeklyBlocks || [];
            const block = weeklyBlocks.find(b => String(b.id) === String(uiState.editingStudyBlockId));
            if (!block) { window.showAlertModal('O bloco que você estava editando não foi encontrado.'); uiState.editingStudyBlockId = null; render(); return; }

            const title = document.getElementById('study-block-title')?.value.trim();
            const selectedDays = window.getSelectedStudyPlanDays();
            const selectedTrackId = document.getElementById('study-block-track')?.value || '';
            const subjectVal = document.getElementById('study-block-subject')?.value || '';
            const selectedSubject = subjectVal ? state.studyData.subjects.find(s => String(s.id) === String(subjectVal)) : null;
            const trackId = selectedSubject?.trackId || selectedTrackId;
            const studyType = document.getElementById('study-block-type')?.value || 'teoria';
            const plannedMinutes = Math.max(5, Math.min(480, parseInt(document.getElementById('study-block-minutes')?.value) || 30));
            const priority = document.getElementById('study-block-priority')?.value || 'media';
            const energyLevel = document.getElementById('study-block-energy')?.value || 'media';
            const notes = document.getElementById('study-block-notes')?.value.trim() || '';
            const calendarTime = window.readCalendarTimeFields('study-block', plannedMinutes);
            if (!calendarTime) return;

            if (!title) { window.showAlertModal('Digite o tema ou atividade do bloco.'); return; }
            if (selectedDays.length === 0) { window.showAlertModal('Selecione pelo menos um dia da semana.'); return; }
            if (!trackId) { window.showAlertModal('Escolha uma trilha para o bloco.'); return; }
            if (selectedSubject?.trackId && String(selectedSubject.trackId) !== String(selectedTrackId)) {
                window.showAlertModal('A disciplina escolhida pertence a outra trilha. Atualize a seleção e tente novamente.');
                return;
            }

            const now = new Date().toISOString();
            const seriesId = block.seriesId || `study_series_${block.id}`;
            const seriesBlocks = block.seriesId
                ? weeklyBlocks.filter(item => String(item.seriesId || '') === String(block.seriesId))
                : [block];
            const unusedExisting = [...seriesBlocks];
            const keptIds = new Set();

            selectedDays.forEach((day, index) => {
                let target = unusedExisting.find(item => item.day === day);
                if (!target) target = unusedExisting.find(item => !keptIds.has(String(item.id)));

                if (target) {
                    keptIds.add(String(target.id));
                    target.day = day;
                    target.seriesId = seriesId;
                    target.title = title;
                    target.trackId = trackId;
                    target.subjectId = selectedSubject ? selectedSubject.id : null;
                    target.studyType = studyType;
                    target.plannedMinutes = plannedMinutes;
                    target.priority = priority;
                    target.energyLevel = energyLevel;
                    target.notes = notes;
                    target.startTime = calendarTime.startTime;
                    target.endTime = calendarTime.endTime;
                    target.updatedAt = now;
                    target.order = window.getStudyBlocksForDay(day).filter(item => String(item.id) !== String(target.id)).length + 1;
                } else {
                    const newBlock = {
                        id: Date.now() + Math.random() + index,
                        seriesId,
                        day,
                        trackId,
                        subjectId: selectedSubject ? selectedSubject.id : null,
                        title,
                        studyType,
                        plannedMinutes,
                        priority,
                        energyLevel,
                        notes,
                        startTime: calendarTime.startTime,
                        endTime: calendarTime.endTime,
                        status: 'planned',
                        order: window.getStudyBlocksForDay(day).length + 1,
                        linkedSessionId: null,
                        createdAt: now,
                        updatedAt: now
                    };
                    weeklyBlocks.push(newBlock);
                    keptIds.add(String(newBlock.id));
                }
            });

            state.studyData.studyPlan.weeklyBlocks = weeklyBlocks.filter(item => {
                const belongsToEditedSeries = seriesBlocks.some(seriesItem => String(seriesItem.id) === String(item.id));
                return !belongsToEditedSeries || keptIds.has(String(item.id));
            });

            uiState.editingStudyBlockId = null;
            uiState.studyPlanningTrackId = String(trackId);
            window.showToast('Planejamento atualizado', selectedDays.length > 1 ? `A repetição foi ajustada para ${selectedDays.length} dias.` : 'As alterações do bloco foram salvas.', 'pencil', 'text-cyan-400');
            window.saveState();
        };

        window.restoreStudyPlanViewPosition = function(snapshot) {
            if (!snapshot) return;
            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    const modalScroll = document.getElementById('study-modal-scroll');
                    if (snapshot.modalWasOpen && modalScroll) {
                        modalScroll.scrollTop = snapshot.modalScrollTop;
                    } else if (!snapshot.modalWasOpen) {
                        window.scrollTo({ top: snapshot.windowScrollY, behavior: 'auto' });
                    }

                    const matchingCard = Array.from(document.querySelectorAll('[data-study-block-id]'))
                        .find(card => String(card.dataset.studyBlockId) === String(snapshot.blockId));
                    if (matchingCard) {
                        matchingCard.classList.add('ring-2', 'ring-yellow-500/40');
                        setTimeout(() => matchingCard.classList.remove('ring-2', 'ring-yellow-500/40'), 900);
                    }
                });
            });

        window.updateStudyBlockStatus = function(blockId, status, event = null) {
            if (event) {
                event.preventDefault();
                event.stopPropagation();
            }

            const block = state.studyData.studyPlan.weeklyBlocks.find(b => String(b.id) === String(blockId));
            if (!block) {
                window.showAlertModal('Bloco de planejamento não encontrado.');
                return;
            }

            const viewPosition = window.captureStudyPlanViewPosition(blockId);
            const now = new Date().toISOString();
            const removingPartial = status === 'partial' && block.status === 'partial';
            const nextStatus = removingPartial ? 'planned' : status;

            block.status = nextStatus;
            block.updatedAt = now;

            if (nextStatus === 'completed') {
                block.completedAt = now;
                delete block.partialAt;
            } else if (nextStatus === 'partial') {
                block.partialAt = now;
                delete block.completedAt;
            } else if (nextStatus === 'planned') {
                delete block.partialAt;
                delete block.completedAt;
            }

            window.saveState();
            window.restoreStudyPlanViewPosition(viewPosition);

            if (removingPartial) {
                window.showToast('Marcação parcial removida', 'O bloco voltou ao status Planejado.', 'undo-2', 'text-cyan-400');
            } else if (nextStatus === 'partial') {
                window.showToast('Progresso parcial registrado', 'O bloco foi marcado como parcial e permanece no planejamento.', 'circle-dot', 'text-yellow-400');
            } else if (nextStatus === 'completed') {
                window.showToast('Bloco concluído', 'O estudo foi marcado como concluído.', 'check-circle-2', 'text-emerald-400');
            }
        };

                            <div class="text-xs font-black mt-0.5">${window.getStudyBlockStatusLabel(block.status)}</div>
                        </div>
                        <div class="rounded-xl border border-slate-800 bg-slate-950/70 p-2.5">
                            <div class="text-[9px] uppercase tracking-widest text-slate-600 font-bold">Método</div>
                            <div class="text-xs font-black text-slate-300 mt-0.5">${window.getStudyTypeLabel(block.studyType)}</div>
                        </div>
                        <div class="rounded-xl border border-cyan-900/50 bg-cyan-950/20 p-2.5">
                            <div class="text-[9px] uppercase tracking-widest text-cyan-700 font-bold">Duração</div>
                            <div class="text-xs font-black text-cyan-300 mt-0.5">${block.plannedMinutes} minutos</div>
                        </div>
                        <div class="rounded-xl border border-slate-800 bg-slate-950/70 p-2.5">
                            <div class="text-[9px] uppercase tracking-widest text-slate-600 font-bold">Agenda</div>
                            <div class="text-xs font-black mt-0.5 ${block.startTime ? 'text-cyan-200' : 'text-slate-500'}">${block.startTime ? window.getCalendarTimeLabel(block, block.plannedMinutes) : 'Dia inteiro'}</div>
                        </div>
                        <div class="rounded-xl border border-slate-800 bg-slate-950/70 p-2.5 col-span-2">
                            <div class="text-[9px] uppercase tracking-widest text-slate-600 font-bold">Carga</div>
                            <div class="text-xs font-black mt-0.5 ${priorityTextClass}">${block.priority || 'média'} · energia ${energyLabel.toLowerCase()}</div>
                        </div>
                    </div>

                    ${block.notes && !compact ? `<p class="text-xs text-slate-400 bg-slate-950/60 border border-slate-800 rounded-xl p-3 mb-4 leading-relaxed">${window.escapeHtml(block.notes)}</p>` : ''}

                    <div class="grid grid-cols-2 gap-2">
                        <button type="button" onclick="window.prefillStudySessionFromPlan('${block.id}')" class="min-h-[42px] bg-cyan-700 hover:bg-cyan-600 text-white text-[11px] font-black rounded-xl px-3 py-2.5 flex items-center justify-center gap-2 transition-colors"><i data-lucide="clipboard-pen" class="w-4 h-4"></i>Registrar sessão</button>
                        <button type="button" onclick="window.updateStudyBlockStatus('${block.id}','completed', event)" class="min-h-[42px] ${completed ? 'bg-emerald-900/60 text-emerald-200' : 'bg-emerald-700 hover:bg-emerald-600 text-white'} text-[11px] font-black rounded-xl px-3 py-2.5 flex items-center justify-center gap-2 transition-colors"><i data-lucide="check" class="w-4 h-4"></i>${completed ? 'Concluído' : 'Concluir'}</button>
                        <button type="button" onclick="window.updateStudyBlockStatus('${block.id}','partial', event)" class="min-h-[40px] ${partial ? 'bg-yellow-700 hover:bg-yellow-600 text-white border-yellow-500' : 'bg-yellow-950/50 hover:bg-yellow-900/60 border-yellow-900/60 text-yellow-200'} border text-[11px] font-bold rounded-xl px-3 py-2 flex items-center justify-center gap-2 transition-colors" title="${partial ? 'Remover marcação parcial e voltar para Planejado' : 'Marcar este bloco como parcialmente realizado'}"><i data-lucide="${partial ? 'undo-2' : 'circle-dot'}" class="w-4 h-4"></i>${partial ? 'Desmarcar parcial' : 'Marcar parcial'}</button>
                        <button type="button" onclick="window.rescheduleStudyBlockToNextDay('${block.id}', event)" class="min-h-[40px] bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 text-[11px] font-bold rounded-xl px-3 py-2 flex items-center justify-center gap-2 transition-colors"><i data-lucide="calendar-clock" class="w-4 h-4"></i>Remarcar</button>
                    </div>
                </div>`;
        }

        function renderDailyStudyPlanSection() {
            const dayBlocks = window.getStudyBlocksForDay(state.activeTab);
            const activeBlocks = dayBlocks.filter(b => b.status !== 'cancelled');
            const completed = activeBlocks.filter(b => b.status === 'completed').length;
            const totalMinutes = activeBlocks.reduce((acc, b) => acc + (parseInt(b.plannedMinutes) || 0), 0);
            const doneMinutes = activeBlocks.filter(b => b.status === 'completed').reduce((acc, b) => acc + (parseInt(b.plannedMinutes) || 0), 0);
            const pct = activeBlocks.length ? Math.round((completed / activeBlocks.length) * 100) : 0;
            return `
            <div class="bg-slate-900 border border-cyan-900/40 rounded-2xl p-4 mb-4 font-mono shadow-lg shadow-cyan-950/10">
                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-4">
                    <div>
                        <h3 class="text-sm font-black text-cyan-300 uppercase tracking-widest flex items-center gap-2"><i data-lucide="calendar-check" class="w-4 h-4"></i> Plano de Estudos do Dia</h3>
                        <p class="text-[11px] text-slate-500 mt-1">Blocos criados no Centro de Inteligência para ${daysOfWeek.find(d => d.id === state.activeTab)?.label || 'hoje'}, ordenados por horário.</p>
                    </div>
                    <div class="flex items-center gap-2 text-[10px] font-bold uppercase tracking-widest">
                        <span class="bg-slate-950 border border-slate-800 text-slate-400 px-2 py-1 rounded-lg">${completed}/${activeBlocks.length} blocos</span>
                        <span class="bg-cyan-950/40 border border-cyan-900/50 text-cyan-300 px-2 py-1 rounded-lg">${doneMinutes}/${totalMinutes} min</span>
                        <button onclick="window.toggleStudyModal(); window.setStudyTab('planning')" class="bg-cyan-700 hover:bg-cyan-600 text-white px-3 py-1.5 rounded-lg flex items-center gap-1"><i data-lucide="plus" class="w-3 h-3"></i> Planejar</button>
                    </div>
                </div>
                ${activeBlocks.length ? `<div class="w-full bg-slate-800 rounded-full h-2 mb-4"><div class="bg-cyan-500 h-2 rounded-full transition-all" style="width:${pct}%"></div></div><div class="grid grid-cols-1 lg:grid-cols-2 gap-3">${activeBlocks.map(b => renderStudyPlanBlockCard(b, true)).join('')}</div>` : `<div class="border border-dashed border-slate-800 rounded-xl p-5 text-center"><i data-lucide="calendar-plus" class="w-8 h-8 text-slate-600 mx-auto mb-2"></i><p class="text-sm text-slate-500 italic mb-3">Nenhum bloco de estudo planejado para este dia.</p><button onclick="window.toggleStudyModal(); window.setStudyTab('planning')" class="bg-cyan-800 hover:bg-cyan-700 text-white px-4 py-2 rounded-lg text-xs font-black uppercase tracking-widest">Criar planejamento</button></div>`}
            </div>`;
        }

        function renderWeeklyPlanningOverview() {
            const tasks = Array.isArray(state.tasks) ? state.tasks : [];
            const studyBlocks = (state.studyData?.studyPlan?.weeklyBlocks || []).filter(b => b.status !== 'cancelled');
            const subjects = state.studyData?.subjects || [];

            const weekStart = window.getActivePlanningWeekStartDate();
            const weekEnd = addDaysToDate(weekStart, 6);
            const currentWeekKey = window.getCurrentCalendarWeekStartKey();
            const nextWeekKey = window.getNextCalendarWeekStartKey();
            const activeWeekKey = dateKeyFromDate(weekStart);
            const todayKey = dateKeyFromDate(new Date());
            const weekLabel = `${formatPtShortDate(weekStart)} a ${formatPtShortDate(weekEnd)}`;
            const isCurrentCalendarWeek = activeWeekKey === currentWeekKey;
            const isNextCalendarWeek = activeWeekKey === nextWeekKey;

            const priorityRank = { essencial: 4, alta: 3, media: 2, baixa: 1 };
            const priorityLabel = { essencial: 'Essencial', alta: 'Alta', media: 'Média', baixa: 'Baixa' };
            const priorityColor = {
                essencial: 'text-purple-200 bg-purple-950/40 border-purple-900/60',
                alta: 'text-red-200 bg-red-950/35 border-red-900/60',
                media: 'text-yellow-200 bg-yellow-950/25 border-yellow-900/60',
                baixa: 'text-slate-300 bg-slate-900 border-slate-800'
            };
            const statusLabel = (status) => window.getStudyBlockStatusLabel ? window.getStudyBlockStatusLabel(status) : (status === 'completed' ? 'Concluído' : status === 'partial' ? 'Parcial' : 'Planejado');
            const safePct = (done, total) => total ? Math.round((done / total) * 100) : 0;
            const plural = (n, singular, pluralText) => `${n} ${n === 1 ? singular : pluralText}`;

            const buildDay = (day, index) => {
                const date = addDaysToDate(weekStart, index);
                const dateKey = dateKeyFromDate(date);
                const dayTasks = window.sortTasksForDay(day.id);
                const dayStudies = window.sortStudyBlocksBySchedule(studyBlocks.filter(b => b.day === day.id));
                const completedTasks = dayTasks.filter(t => t.completed).length;
                const completedStudies = dayStudies.filter(b => b.status === 'completed').length;
                const total = dayTasks.length + dayStudies.length;
                const completed = completedTasks + completedStudies;
                const pending = total - completed;
                const minutes = dayStudies.reduce((acc, b) => acc + (parseInt(b.plannedMinutes, 10) || 0), 0);
                return { day, date, dateKey, dayTasks, dayStudies, completedTasks, completedStudies, total, completed, pending, minutes, pct: safePct(completed, total) };
            };

            const rows = daysOfWeek.map(buildDay);
            const totalTasks = rows.reduce((acc, row) => acc + row.dayTasks.length, 0);
            const totalStudies = rows.reduce((acc, row) => acc + row.dayStudies.length, 0);
            const totalItems = rows.reduce((acc, row) => acc + row.total, 0);
            const completedItems = rows.reduce((acc, row) => acc + row.completed, 0);
            const pendingItems = rows.reduce((acc, row) => acc + row.pending, 0);
            const plannedMinutes = rows.reduce((acc, row) => acc + row.minutes, 0);
            const progressPct = safePct(completedItems, totalItems);

            const renderWeekDayShortcut = (row) => {
                const isToday = row.dateKey === todayKey;
                const dateLabel = `${String(row.date.getDate()).padStart(2, '0')}/${String(row.date.getMonth() + 1).padStart(2, '0')}`;
                const loadClass = row.total === 0 ? 'bg-slate-950/70 border-slate-800 text-slate-500' : row.pending === 0 ? 'bg-emerald-950/20 border-emerald-900/50 text-emerald-200' : row.total >= 5 ? 'bg-red-950/20 border-red-900/50 text-red-200' : row.total >= 3 ? 'bg-yellow-950/20 border-yellow-900/50 text-yellow-200' : 'bg-cyan-950/20 border-cyan-900/50 text-cyan-200';
                return `<button type="button" onclick="window.setTab('${row.day.id}'); window.setMainView('day')" class="text-left rounded-2xl border ${isToday ? 'border-cyan-400 bg-cyan-950/30 ring-1 ring-cyan-500/30' : loadClass} p-3 hover:border-cyan-400/70 hover:bg-cyan-950/25 transition-colors min-h-[102px]">
                    <div class="flex items-start justify-between gap-2">
                        <div>
                            <div class="text-[10px] font-black uppercase tracking-widest ${isToday ? 'text-cyan-100' : 'text-slate-400'}">${row.day.label}</div>
                            <div class="text-lg font-black text-white leading-tight mt-1">${dateLabel}</div>
                        </div>
                        ${isToday ? `<span class="rounded-full bg-cyan-600 text-white px-2 py-0.5 text-[8px] font-black uppercase tracking-widest">Hoje</span>` : ''}
                    </div>
                    <div class="mt-3 flex items-center justify-between text-[10px] font-black uppercase tracking-widest">
                        <span>${row.total ? `${row.pending} pend.` : 'Livre'}</span>
                        <span class="text-slate-500">${row.completed}/${row.total}</span>
                    </div>
                    <div class="h-1.5 bg-slate-800/80 rounded-full overflow-hidden mt-2"><div class="h-full rounded-full ${row.pct >= 100 && row.total ? 'bg-emerald-500' : row.pct >= 50 ? 'bg-cyan-500' : 'bg-indigo-500'}" style="width:${row.total ? row.pct : 0}%"></div></div>
                </button>`;
            };

            const renderTaskAgendaItem = (task) => {
                const cat = window.getTaskCategory(task.category);
                const done = Boolean(task.completed);
                const subCount = Array.isArray(task.subtasks) ? task.subtasks.length : 0;
                const doneSubs = subCount ? task.subtasks.filter(st => st.completed).length : 0;
                return `<div class="rounded-2xl border ${done ? 'border-emerald-900/30 bg-emerald-950/10 opacity-60' : 'border-slate-800 bg-slate-950/75'} p-3">
                    <div class="flex items-start gap-3">
                        <i data-lucide="${done ? 'check-circle-2' : 'circle'}" class="w-4 h-4 mt-0.5 ${done ? 'text-emerald-400' : 'text-indigo-300'} shrink-0"></i>
                        <div class="min-w-0 flex-1">
                            <div class="text-sm font-bold leading-snug ${done ? 'text-slate-500 line-through' : 'text-slate-100'} break-words">${window.escapeHtml(task.text || 'Missão sem título')}</div>
                            <div class="flex flex-wrap items-center gap-2 mt-2 text-[10px] font-bold uppercase tracking-wider">
                                <span class="inline-flex items-center gap-1 text-slate-400"><i data-lucide="${cat.icon || 'target'}" class="w-3 h-3 ${cat.color || 'text-slate-400'}"></i>${window.escapeHtml(cat.label || 'Geral')}</span>
                                <span class="inline-flex items-center rounded-full border px-2 py-0.5 ${priorityColor[task.priority] || priorityColor.media}">${priorityLabel[task.priority] || 'Média'}</span>
                                <span class="inline-flex items-center gap-1 ${task.startTime ? 'text-cyan-300' : 'text-slate-500'}"><i data-lucide="calendar-clock" class="w-3 h-3"></i>${task.startTime ? window.getCalendarTimeLabel(task, extractMinutesFromTask(task)) : 'Sem horário'}</span>
                                ${subCount ? `<span class="inline-flex items-center text-cyan-300">${doneSubs}/${subCount} subtarefas</span>` : ''}
                            </div>
                        </div>
                    </div>
                </div>`;
            };

            const renderStudyAgendaItem = (block) => {
                const track = window.getStudyTrack(block.trackId);
                const subject = block.subjectId ? subjects.find(s => String(s.id) === String(block.subjectId)) : null;
                const done = block.status === 'completed';
                const partial = block.status === 'partial';
                const icon = done ? 'check-circle-2' : partial ? 'circle-dot' : 'book-open-check';
                return `<div class="rounded-2xl border ${done ? 'border-emerald-900/30 bg-emerald-950/10 opacity-60' : (track.border || 'border-cyan-900/50')} ${done ? '' : (track.bg || 'bg-cyan-950/10')} p-3">
                    <div class="flex items-start gap-3">
                        <i data-lucide="${icon}" class="w-4 h-4 mt-0.5 ${done ? 'text-emerald-400' : (track.color || 'text-cyan-300')} shrink-0"></i>
                        <div class="min-w-0 flex-1">
                            <div class="text-sm font-bold leading-snug ${done ? 'text-slate-500 line-through' : 'text-slate-100'} break-words">${window.escapeHtml(block.title || 'Estudo sem título')}</div>
                            <div class="text-[11px] text-slate-500 mt-1 truncate">${subject ? window.escapeHtml(subject.name) : 'Sem disciplina vinculada'}</div>
                            <div class="flex flex-wrap items-center gap-2 mt-2 text-[10px] font-bold uppercase tracking-wider">
                                <span class="inline-flex items-center gap-1 ${track.color || 'text-cyan-300'}"><i data-lucide="${track.icon || 'route'}" class="w-3 h-3"></i>${window.escapeHtml(track.name || 'Trilha')}</span>
                                <span class="inline-flex items-center text-cyan-300">${parseInt(block.plannedMinutes, 10) || 0} min</span>
                                <span class="inline-flex items-center gap-1 ${block.startTime ? 'text-cyan-200' : 'text-slate-500'}"><i data-lucide="calendar-clock" class="w-3 h-3"></i>${block.startTime ? window.getCalendarTimeLabel(block, block.plannedMinutes) : 'Sem horário'}</span>
                                <span class="inline-flex items-center rounded-full border border-slate-800 bg-slate-900 text-slate-300 px-2 py-0.5">${statusLabel(block.status)}</span>
                            </div>
                        </div>
                    </div>
                </div>`;
            };

            const renderSectionList = (items, renderer, emptyText) => {
                if (!items.length) {
                    return `<div class="rounded-2xl border border-dashed border-slate-800 bg-slate-950/45 p-4 text-[12px] text-slate-600 italic">${emptyText}</div>`;
                }
                return `<div class="space-y-2.5">${items.map(renderer).join('')}</div>`;
            };

            const renderDayAgendaPanel = (row) => {
                const isToday = row.dateKey === todayKey;
                const dateLabel = `${String(row.date.getDate()).padStart(2, '0')}/${String(row.date.getMonth() + 1).padStart(2, '0')}`;
                const emptyDay = row.total === 0;
                return `<section class="rounded-3xl border ${isToday ? 'border-cyan-500/70 bg-cyan-950/10 shadow-lg shadow-cyan-950/10' : emptyDay ? 'border-slate-800/60 bg-slate-950/45' : 'border-slate-800 bg-slate-900'} overflow-hidden">
                    <div class="px-4 py-4 sm:px-5 border-b ${isToday ? 'border-cyan-900/60 bg-cyan-950/20' : 'border-slate-800 bg-slate-950/45'}">
                        <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-3">
                            <div class="flex items-center gap-4 min-w-0">
                                <div class="w-14 h-14 rounded-2xl border ${isToday ? 'border-cyan-500/70 bg-cyan-900/30' : 'border-slate-800 bg-slate-900'} flex flex-col items-center justify-center shrink-0">
                                    <span class="text-[10px] font-black uppercase tracking-widest ${isToday ? 'text-cyan-200' : 'text-slate-500'}">${row.day.label.slice(0,3)}</span>
                                    <span class="text-lg font-black text-white leading-none">${dateLabel}</span>
                                </div>
                                <div class="min-w-0">
                                    <div class="flex flex-wrap items-center gap-2">
                                        <h3 class="text-lg font-black text-white">${row.day.label}</h3>
                                        ${isToday ? `<span class="rounded-full bg-cyan-600 text-white px-2 py-0.5 text-[9px] font-black uppercase tracking-widest">Hoje</span>` : ''}
                                        ${emptyDay ? `<span class="rounded-full border border-slate-800 text-slate-500 px-2 py-0.5 text-[9px] font-black uppercase tracking-widest">Livre</span>` : ''}
                                    </div>
                                    <div class="flex flex-wrap gap-x-4 gap-y-1 mt-1 text-[11px] text-slate-400 font-bold">
                                        <span>${plural(row.dayTasks.length, 'missão', 'missões')}</span>
                                        <span>${plural(row.dayStudies.length, 'estudo', 'estudos')}</span>
                                        ${row.minutes ? `<span>${row.minutes} min de estudo</span>` : ''}
                                        ${row.total ? `<span>${row.pending} pendente${row.pending === 1 ? '' : 's'}</span>` : ''}
                                    </div>
                                </div>
                            </div>
                            <div class="flex items-center gap-3">
                                <div class="min-w-[120px]">
                                    <div class="flex items-center justify-between text-[9px] font-black uppercase tracking-widest text-slate-500 mb-1"><span>Progresso</span><span>${row.total ? `${row.pct}%` : '—'}</span></div>
                                    <div class="h-2 bg-slate-800 rounded-full overflow-hidden"><div class="h-full rounded-full ${row.pct >= 100 && row.total ? 'bg-emerald-500' : row.pct >= 50 ? 'bg-cyan-500' : 'bg-indigo-500'}" style="width:${row.total ? row.pct : 0}%"></div></div>
                                </div>
                                <button type="button" onclick="window.setTab('${row.day.id}'); window.setMainView('day')" class="rounded-xl bg-slate-950 hover:bg-indigo-600 text-slate-300 hover:text-white border border-slate-800 hover:border-indigo-500 px-3 py-2 text-[10px] font-black uppercase tracking-widest transition-colors">Abrir dia</button>
                            </div>
                        </div>
                    </div>
                    <div class="p-4 sm:p-5 grid grid-cols-1 lg:grid-cols-2 gap-4">
                        <div class="rounded-2xl border border-indigo-900/30 bg-indigo-950/10 p-3 sm:p-4">
                            <div class="flex items-center justify-between mb-3">
                                <h4 class="text-[11px] font-black uppercase tracking-widest text-indigo-300 flex items-center gap-2"><i data-lucide="target" class="w-4 h-4"></i> Missões</h4>
                                <span class="rounded-full bg-slate-950/70 border border-slate-800 px-2 py-0.5 text-[10px] font-black text-slate-400">${row.dayTasks.length}</span>
                            </div>
                            ${renderSectionList(row.dayTasks, renderTaskAgendaItem, 'Sem missões neste dia.')}
                        </div>
                        <div class="rounded-2xl border border-cyan-900/30 bg-cyan-950/10 p-3 sm:p-4">
                            <div class="flex items-center justify-between mb-3">
                                <h4 class="text-[11px] font-black uppercase tracking-widest text-cyan-300 flex items-center gap-2"><i data-lucide="book-open-check" class="w-4 h-4"></i> Estudos</h4>
                                <span class="rounded-full bg-slate-950/70 border border-slate-800 px-2 py-0.5 text-[10px] font-black text-slate-400">${row.minutes ? `${row.minutes} min` : row.dayStudies.length}</span>
                            </div>
                            ${renderSectionList(row.dayStudies, renderStudyAgendaItem, 'Sem estudos planejados neste dia.')}
                        </div>
                    </div>
                </section>`;
            };

            const emptyState = `<div class="space-y-5 font-mono">
                <section class="rounded-3xl border border-cyan-900/50 bg-slate-900 p-5 sm:p-6">
                    <div class="flex flex-col xl:flex-row xl:items-center xl:justify-between gap-4">
                        <div>
                            <div class="text-[10px] font-black uppercase tracking-widest text-cyan-300 mb-2">Agenda semanal · ${weekLabel}</div>
                            <h2 class="text-2xl sm:text-3xl font-black text-white">Semana sem demandas</h2>
                            <p class="text-sm text-slate-400 mt-2 max-w-2xl leading-relaxed">Quando você criar missões no board ou estudos no Centro de Inteligência, eles aparecerão aqui em formato de agenda semanal.</p>
                        </div>
                        <div class="flex flex-wrap gap-2">
                            <button onclick="window.setPlanningCalendarWeek('current')" class="bg-slate-950 hover:bg-slate-800 text-slate-300 border border-slate-800 px-4 py-2.5 rounded-xl text-[10px] font-black uppercase tracking-widest">Semana atual</button>
                            <button onclick="window.exportVisibleWeekToIcs()" class="bg-emerald-800/70 hover:bg-emerald-700 text-white px-4 py-2.5 rounded-xl text-[10px] font-black uppercase tracking-widest">Exportar .ics</button>
                            <button onclick="window.prepareNextWeekPlanning()" class="bg-cyan-700 hover:bg-cyan-600 text-white px-4 py-2.5 rounded-xl text-[10px] font-black uppercase tracking-widest">Planejar próxima semana</button>
                        </div>
                    </div>
                </section>
            </div>`;

            if (totalItems === 0) return emptyState;

            return `<div class="space-y-5 font-mono">
                <section class="rounded-3xl border border-cyan-900/50 bg-slate-900 p-4 sm:p-5">
                    <div class="flex flex-col xl:flex-row xl:items-center xl:justify-between gap-4">
                        <div class="min-w-0">
                            <div class="flex flex-wrap items-center gap-2 mb-2">
                                <span class="inline-flex items-center gap-1.5 rounded-full border border-cyan-900/60 bg-cyan-950/30 px-3 py-1 text-[10px] font-black uppercase tracking-widest text-cyan-200"><i data-lucide="calendar-range" class="w-3.5 h-3.5"></i> Agenda semanal</span>
                                ${isCurrentCalendarWeek ? `<span class="inline-flex items-center rounded-full border border-emerald-900/50 bg-emerald-950/25 px-3 py-1 text-[10px] font-black uppercase tracking-widest text-emerald-200">Semana corrente</span>` : ''}
                                ${isNextCalendarWeek ? `<span class="inline-flex items-center rounded-full border border-purple-900/50 bg-purple-950/25 px-3 py-1 text-[10px] font-black uppercase tracking-widest text-purple-200">Próxima semana</span>` : ''}

            } else if (uiState.statsTab === 'badges') {

                    </div>`;
                });
                return html + `</div>`;
            } else if (uiState.statsTab === 'performance') {
                return window.renderQGPerformanceDashboard ? window.renderQGPerformanceDashboard() : '<div class="text-slate-500 text-sm">Painel de desempenho indisponível.</div>';
            } else if (uiState.statsTab === 'shop') {
                let html = `
                <div class="bg-yellow-950/20 border border-yellow-900/50 p-4 rounded-xl mb-6 flex justify-between items-center">
                    <div><h3 class="text-yellow-500 font-black uppercase text-sm">Seu Saldo</h3><p class="text-xs text-slate-400">Pague pelo seu merecido lazer acumulando moedas!</p></div>
                    <div class="text-3xl font-black text-yellow-400 flex items-center gap-2"><i data-lucide="coins"></i> ${state.coins}</div>
                </div>
                
                <h3 class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-3 mt-6 flex items-center gap-2"><i data-lucide="star" class="w-4 h-4 text-yellow-500"></i> Oficiais</h3>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">`;
                
                REWARDS_SHOP.forEach(r => {
                    const canAfford = state.coins >= r.cost;
                    html += `
                    <div class="bg-slate-800 border border-slate-700 p-4 rounded-xl flex flex-col justify-between hover:border-slate-500 transition-colors">
                        <div>
                            <div class="flex justify-between items-start mb-2"><i data-lucide="${r.icon}" class="text-white w-6 h-6"></i><span class="bg-slate-950 text-yellow-400 text-xs font-bold px-2 py-1 rounded border border-yellow-900/50">${r.cost} MT</span></div>
                            <h4 class="font-bold text-white text-sm">${r.title}</h4><p class="text-xs text-slate-400 mt-1 leading-tight">${r.desc}</p>
                        </div>
                        <button onclick="window.buyReward('${r.id}')" class="mt-4 w-full py-2 rounded-lg text-xs font-bold transition-colors ${canAfford ? 'bg-emerald-600 hover:bg-emerald-500 text-white' : 'bg-slate-900 text-slate-500 cursor-not-allowed'}">${canAfford ? 'Resgatar' : 'Faltam Moedas'}</button>
                    </div>`;
                });
                html += `</div>`;

                html += `<h3 class="text-xs font-bold text-slate-400 uppercase tracking-widest mt-8 mb-3 flex items-center gap-2"><i data-lucide="package" class="w-4 h-4 text-indigo-400"></i> Personalizadas</h3>`;
                html += `<div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-6">`;
                if (state.customRewards) {
                    state.customRewards.filter(r => r.active !== false).forEach(r => {
                        const canAfford = state.coins >= r.cost;
                        html += `
                        <div class="bg-slate-800 border border-slate-700 p-4 rounded-xl flex flex-col justify-between hover:border-slate-500 transition-colors relative group">
                            <button onclick="window.deleteCustomReward(${r.id})" class="absolute top-2 right-2 text-slate-600 hover:text-red-400 opacity-0 group-hover:opacity-100 transition-opacity"><i data-lucide="x" class="w-4 h-4"></i></button>
                            <div>
                                <div class="flex justify-between items-start mb-2"><i data-lucide="${r.icon}" class="text-white w-6 h-6"></i><span class="bg-slate-950 text-yellow-400 text-xs font-bold px-2 py-1 rounded border border-yellow-900/50">${r.cost} MT</span></div>
                                <h4 class="font-bold text-white text-sm">${r.title}</h4><p class="text-xs text-slate-400 mt-1 leading-tight">${r.desc}</p>
                            </div>
                            <button onclick="window.buyCustomReward(${r.id})" class="mt-4 w-full py-2 rounded-lg text-xs font-bold transition-colors ${canAfford ? 'bg-indigo-600 hover:bg-indigo-500 text-white' : 'bg-slate-900 text-slate-500 cursor-not-allowed'}">${canAfford ? 'Resgatar' : 'Faltam Moedas'}</button>
                        </div>`;
                    });
                }
                html += `</div>`;

                html += `
                <div class="bg-slate-950 border border-slate-800 rounded-xl p-5 mb-8">
                    <h4 class="text-sm font-bold text-slate-300 mb-3">Criar Nova Recompensa</h4>
                    <div class="grid grid-cols-2 gap-3 mb-3">
                        <input type="text" id="custom-reward-title" placeholder="Título (ex: Pedir Pizza)" class="bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-white outline-none">
                        <input type="number" id="custom-reward-cost" placeholder="Custo (MT)" min="1" class="bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-white outline-none">
                    </div>
                    <input type="text" id="custom-reward-desc" placeholder="Descrição opcional..." class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-white mb-3 outline-none">
                    <button onclick="window.addCustomReward()" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold py-2 rounded-lg border border-slate-600 text-xs transition-colors">Criar Recompensa</button>
                </div>`;

                html += `<h3 class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-3 flex items-center gap-2"><i data-lucide="history" class="w-4 h-4 text-emerald-500"></i> Histórico de Resgates</h3>`;
                html += `<div class="space-y-2">`;
                if (!state.rewardPurchases || state.rewardPurchases.length === 0) {
                    html += `<p class="text-xs text-slate-500 italic">Nenhum resgate registrado ainda.</p>`;
                } else {
                    state.rewardPurchases.slice().sort((a,b) => new Date(b.date) - new Date(a.date)).slice(0, 10).forEach(rp => {
                        html += `
                        <div class="bg-slate-950 border border-slate-800 p-3 rounded-lg flex justify-between items-center">
                            <div class="flex flex-col">
                                <span class="text-[9px] uppercase font-bold text-slate-500 mb-0.5">${new Date(rp.date).toLocaleDateString('pt-BR', {hour: '2-digit', minute:'2-digit'})} | ${rp.type === 'custom' ? 'Pessoal' : 'Oficial'}</span>
                                <span class="text-sm font-bold text-white">${rp.title}</span>
                            </div>
                            <span class="text-xs text-yellow-400 font-bold bg-yellow-950/30 px-2 py-1 rounded border border-yellow-900/50">${rp.cost} MT</span>
                        </div>`;
                    });
                }
                html += `</div>`;

                return html;
            }
            return '';
        }

        // --- ESTUDOS ---
        function renderStudyContent() {
            if (uiState.studyTab === 'plano') {
                const selectedDayId = state.activeTab || daysOfWeek[new Date().getDay() === 0 ? 6 : new Date().getDay() - 1]?.id || 'monday';
                const selectedDay = daysOfWeek.find(d => d.id === selectedDayId) || { label: 'Hoje' };
                const dayBlocks = window.getStudyBlocksForDay(selectedDayId).filter(b => b.status !== 'cancelled');
                const completedBlocks = dayBlocks.filter(b => b.status === 'completed').length;
                const plannedMinutes = dayBlocks.reduce((acc, b) => acc + (parseInt(b.plannedMinutes, 10) || 0), 0);
                const completedMinutes = dayBlocks.filter(b => b.status === 'completed').reduce((acc, b) => acc + (parseInt(b.plannedMinutes, 10) || 0), 0);
                const progressPct = dayBlocks.length ? Math.round((completedBlocks / dayBlocks.length) * 100) : 0;

                const plannedSubjectIds = new Set(dayBlocks.filter(b => b.subjectId !== null && b.subjectId !== undefined && b.subjectId !== '').map(b => String(b.subjectId)));
                const now = new Date();
                const dueReviews = state.studyData.reviews.filter(r => r.status === 'pending' && new Date(r.dueDate) <= now && plannedSubjectIds.has(String(r.subjectId)));
                const openErrors = state.studyData.errorLog.filter(e => e.status === 'open' && plannedSubjectIds.has(String(e.subjectId)));
                let recs = [];

                if (dueReviews.length > 0) recs.push({ title: 'Revisões ligadas ao plano', desc: `Há ${dueReviews.length} revisão${dueReviews.length !== 1 ? 'ões' : ''} pendente${dueReviews.length !== 1 ? 's' : ''} das disciplinas previstas para este dia.`, color: 'text-red-400', border: 'border-red-900/50', icon: 'rotate-cw' });
                if (openErrors.length > 0) recs.push({ title: 'Erros ligados ao plano', desc: `Há ${openErrors.length} item${openErrors.length !== 1 ? 's' : ''} aberto${openErrors.length !== 1 ? 's' : ''} no Caderno de Erros das disciplinas previstas para este dia.`, color: 'text-orange-400', border: 'border-orange-900/50', icon: 'microscope' });

                plannedSubjectIds.forEach(subjectId => {
                    const sub = state.studyData.subjects.find(s => String(s.id) === String(subjectId));
                    if (!sub) return;
                    const stats = window.getSubjectStats(sub.id);
                    if (stats.retention > 0 && stats.retention < 70) {
                        recs.push({ title: `Reforço sugerido: ${sub.name}`, desc: `Retenção atual de ${stats.retention}%. Considere questões curtas ou recuperação ativa durante o bloco planejado.`, color: 'text-yellow-400', border: 'border-yellow-900/50', icon: 'brain' });
                    }
                    if (!stats.lastSession || (now - stats.lastSession) / (1000 * 60 * 60 * 24) > 7) {
                        recs.push({ title: `Retomada sugerida: ${sub.name}`, desc: 'Esta disciplina está no plano de hoje e não possui sessão recente registrada. Comece com um bloco pequeno para reduzir a resistência inicial.', color: 'text-slate-300', border: 'border-slate-700', icon: 'history' });
                    }
                });

                if (dayBlocks.length > 0 && state.energy < 30) {
                    recs.unshift({ title: 'Bateria executiva baixa', desc: 'Mantenha o planejamento, mas reduza a exigência: leitura leve, flashcards ou um bloco menor.', color: 'text-blue-400', border: 'border-blue-900/50', icon: 'battery-low' });
                }

                let html = `
                    <div class="bg-cyan-950/10 border border-cyan-900/30 p-5 rounded-xl mb-6">
                        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-4">
                            <div>
                                <h3 class="text-cyan-400 font-black uppercase tracking-widest text-sm flex items-center gap-2"><i data-lucide="calendar-check" class="w-4 h-4"></i> Plano de ${selectedDay.label}</h3>
                                <p class="text-[11px] text-slate-500 mt-1">Aqui aparecem somente os blocos criados em Planejamento. Cadastrar uma disciplina no Arsenal não a coloca automaticamente no dia.</p>
                            </div>
                            <div class="flex flex-wrap items-center gap-2 text-[10px] font-bold uppercase tracking-widest">
                                <span class="bg-slate-950 border border-slate-800 text-slate-400 px-2 py-1 rounded-lg">${completedBlocks}/${dayBlocks.length} blocos</span>
                                <span class="bg-cyan-950/40 border border-cyan-900/50 text-cyan-300 px-2 py-1 rounded-lg">${completedMinutes}/${plannedMinutes} min</span>
                                <button onclick="window.setStudyTab('planning')" class="bg-cyan-700 hover:bg-cyan-600 text-white px-3 py-1.5 rounded-lg flex items-center gap-1"><i data-lucide="plus" class="w-3 h-3"></i> Planejar</button>
                            </div>
                        </div>
                        ${dayBlocks.length ? `<div class="w-full bg-slate-800 rounded-full h-2 mb-4"><div class="bg-cyan-500 h-2 rounded-full transition-all" style="width:${progressPct}%"></div></div><div class="grid grid-cols-1 lg:grid-cols-2 gap-3">${dayBlocks.map(b => renderStudyPlanBlockCard(b, true)).join('')}</div>` : `<div class="border border-dashed border-slate-800 rounded-xl p-6 text-center"><i data-lucide="calendar-plus" class="w-9 h-9 text-slate-600 mx-auto mb-2"></i><p class="text-sm text-slate-500 italic mb-1">Nenhum estudo foi planejado para ${selectedDay.label}.</p><p class="text-[11px] text-slate-600 mb-3">As disciplinas do Arsenal continuam cadastradas, mas só aparecem aqui quando você cria um bloco para este dia.</p><button onclick="window.setStudyTab('planning')" class="bg-cyan-800 hover:bg-cyan-700 text-white px-4 py-2 rounded-lg text-xs font-black uppercase tracking-widest">Criar planejamento</button></div>`}
                    </div>`;

                if (dayBlocks.length > 0) {
                    html += `<div class="bg-slate-950 border border-slate-800 p-5 rounded-xl"><h3 class="text-slate-300 font-black uppercase tracking-widest text-xs mb-1 flex items-center gap-2"><i data-lucide="sparkles" class="w-4 h-4 text-cyan-400"></i>Apoios para executar o plano</h3><p class="text-[10px] text-slate-600 mb-4">Estes avisos consideram apenas as disciplinas vinculadas aos blocos de ${selectedDay.label}; não são novos estudos adicionados automaticamente.</p><div class="space-y-3">`;
                    if (recs.length === 0) html += `<div class="text-slate-500 italic text-sm border border-dashed border-slate-800 rounded-lg p-4">Nenhum alerta específico para os blocos planejados. Execute a agenda normalmente.</div>`;
                    recs.slice(0, 5).forEach(r => {
                        html += `<div class="bg-slate-900 border ${r.border} p-4 rounded-lg flex items-start gap-3"><i data-lucide="${r.icon || 'info'}" class="${r.color} w-5 h-5 mt-0.5"></i><div><h4 class="font-bold text-white text-sm">${r.title}</h4><p class="text-xs text-slate-400 mt-1">${r.desc}</p></div></div>`;
                    });
                    html += `</div></div>`;
                }

                return html;
            }
            else if (uiState.studyTab === 'planning') {
                return renderStudyPlanningContent();
            }
            else if (uiState.studyTab === 'dashboard') {
                const totalSessions = state.studyData.sessions.length;
                const totalMinutes = state.studyData.sessions.reduce((acc, s) => acc + s.duration, 0);
                const totalQ = state.studyData.sessions.reduce((acc, s) => acc + s.qTotal, 0);
                const correctQ = state.studyData.sessions.reduce((acc, s) => acc + s.qCorrect, 0);
                const globalRetention = totalQ > 0 ? Math.round((correctQ / totalQ) * 100) : 0;
                
                let confBeforeAvg = 0, confAfterAvg = 0;
                const sessionsWithConf = state.studyData.sessions.filter(s => s.confBefore && s.confAfter);
                if(sessionsWithConf.length > 0) {
                    confBeforeAvg = (sessionsWithConf.reduce((acc, s) => acc + s.confBefore, 0) / sessionsWithConf.length).toFixed(1);
                    confAfterAvg = (sessionsWithConf.reduce((acc, s) => acc + s.confAfter, 0) / sessionsWithConf.length).toFixed(1);
                }

                let html = `
                <div class="grid grid-cols-2 sm:grid-cols-4 gap-4 mb-6">
                    <div class="bg-slate-950 border border-slate-800 p-4 rounded-xl flex flex-col items-center justify-center text-center"><i data-lucide="clock" class="text-indigo-400 mb-2 w-6 h-6"></i><span class="text-2xl font-black text-white">${(totalMinutes / 60).toFixed(1)}h</span><span class="text-[10px] text-slate-500 uppercase font-bold tracking-widest mt-1">Tempo Total</span></div>
                    <div class="bg-slate-950 border border-slate-800 p-4 rounded-xl flex flex-col items-center justify-center text-center"><i data-lucide="target" class="text-cyan-400 mb-2 w-6 h-6"></i><span class="text-2xl font-black text-white">${totalQ}</span><span class="text-[10px] text-slate-500 uppercase font-bold tracking-widest mt-1">Questões</span></div>
                    <div class="bg-slate-950 border border-slate-800 p-4 rounded-xl flex flex-col items-center justify-center text-center relative overflow-hidden"><i data-lucide="percent" class="text-emerald-400 mb-2 w-6 h-6"></i><span class="text-2xl font-black text-white">${globalRetention}%</span><span class="text-[10px] text-slate-500 uppercase font-bold tracking-widest mt-1">Retenção</span></div>
                    <div class="bg-slate-950 border border-slate-800 p-4 rounded-xl flex flex-col items-center justify-center text-center"><i data-lucide="brain" class="text-fuchsia-400 mb-2 w-6 h-6"></i><span class="text-2xl font-black text-white">${confBeforeAvg} > ${confAfterAvg}</span><span class="text-[10px] text-slate-500 uppercase font-bold tracking-widest mt-1">Confiança Média</span></div>
                </div>

                <h3 class="text-xs font-bold text-slate-400 uppercase tracking-widest mt-8 mb-3 flex items-center gap-2"><i data-lucide="bar-chart" class="w-4 h-4 text-indigo-400"></i> Painel de Desempenho</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8">
                `;

                // --- Gráfico 1: Estudos - Últimos 7 dias ---
                const todayForChart = new Date();
                todayForChart.setHours(0,0,0,0);
                const last7Days = [];
                for (let i = 6; i >= 0; i--) {
                    const d = new Date(todayForChart);
                    d.setDate(d.getDate() - i);
                    last7Days.push(d);
                }
                const dayNames = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
                let maxMins = 0;
                const studyChartData = last7Days.map(dateObj => {
                    let totalMins = 0;
                    const sessions = state.studyData?.sessions || [];
                    sessions.forEach(s => {
                        if (s.date) {
                            const sd = new Date(s.date);
                            if (sd.getFullYear() === dateObj.getFullYear() && sd.getMonth() === dateObj.getMonth() && sd.getDate() === dateObj.getDate()) {
                                totalMins += (s.duration || 0);
                            }
                        }
                    });
                    if (totalMins > maxMins) maxMins = totalMins;
                    return { label: dayNames[dateObj.getDay()], mins: totalMins };
                });

                html += `<div class="bg-slate-950 border border-slate-800 p-4 rounded-xl flex flex-col">
                            <h4 class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-4">Estudos — Últimos 7 dias</h4>`;
                
                if (maxMins === 0) {
                    html += `<div class="flex-1 flex items-center justify-center text-xs text-slate-600 italic">Nenhuma sessão registrada nos últimos 7 dias.</div>`;
                } else {
                    html += `<div class="flex items-end justify-between h-32 mt-auto px-1 sm:px-2 gap-1 sm:gap-2">`;
                    studyChartData.forEach(c => {
                        const heightPercent = maxMins > 0 ? (c.mins / maxMins) * 100 : 0;
                        html += `
                        <div class="flex flex-col items-center gap-1.5 w-full">
                            <span class="text-[9px] font-bold text-cyan-400">${c.mins > 0 ? c.mins + 'm' : ''}</span>
                            <div class="w-full max-w-[20px] bg-cyan-600 rounded-t-sm transition-all relative group" style="height: ${Math.max(heightPercent, 2)}%;">
                                ${c.mins > 0 ? `<div class="absolute -top-6 left-1/2 transform -translate-x-1/2 bg-slate-800 text-white text-[9px] px-1.5 py-0.5 rounded opacity-0 group-hover:opacity-100 whitespace-nowrap pointer-events-none transition-opacity">${c.mins} min</div>` : ''}
                            </div>
                            <span class="text-[9px] text-slate-500 uppercase font-bold">${c.label}</span>
                        </div>`;
                    });
                    html += `</div>`;
                }
                html += `</div>`;

                // --- Gráfico 2: Eficiência da Semana ---
                const efficiencyChartData = daysOfWeek.map(day => {
                    const dayTasks = (state.tasks || []).filter(t => t.day === day.id);
                    const total = dayTasks.length;
                    const completed = dayTasks.filter(t => t.completed).length;
                    const percent = total === 0 ? 0 : Math.round((completed / total) * 100);
                    return { label: day.label.substring(0,3), total, completed, percent };
                });

                html += `<div class="bg-slate-950 border border-slate-800 p-4 rounded-xl flex flex-col">
                            <h4 class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-4">Eficiência da Semana</h4>
                            <div class="space-y-2.5 overflow-y-auto pr-1">`;
                
                efficiencyChartData.forEach(c => {
                    const barColor = c.percent === 100 ? 'bg-emerald-500' : (c.percent > 0 ? 'bg-indigo-500' : 'bg-slate-700');
                    const textColor = c.percent === 100 ? 'text-emerald-400' : (c.percent > 0 ? 'text-indigo-400' : 'text-slate-600');
                    html += `
                    <div>
                        <div class="flex justify-between text-[9px] font-bold mb-1 uppercase tracking-wider">
                            <span class="text-slate-400">${c.label} <span class="text-slate-600 ml-1">(${c.completed}/${c.total})</span></span>
                            <span class="${textColor}">${c.percent}%</span>
                        </div>
                        <div class="w-full bg-slate-900 rounded-full h-1.5">
                            <div class="${barColor} h-1.5 rounded-full transition-all" style="width: ${c.percent}%"></div>
                        </div>
                    </div>`;
                });
                html += `</div></div></div>`;

                html += `<h3 class="text-sm font-bold text-slate-300 mb-4 flex items-center gap-2 uppercase tracking-widest"><i data-lucide="bar-chart-2" class="text-cyan-500 w-4 h-4"></i> Radar de Retenção</h3>
                <div class="space-y-4">`;

                if (state.studyData.subjects.length === 0) html += `<p class="text-slate-500 text-sm italic text-center p-8 bg-slate-950 rounded-xl border border-slate-800">Arsenal vazio.</p>`;
                state.studyData.subjects.forEach(sub => {
                    const stats = window.getSubjectStats(sub.id);
                    let radarStatus = "Esquecida", color = "bg-slate-600";
                    if(stats.lastSession && (now - stats.lastSession) / (1000*60*60*24) <= 10) {
                        if(stats.retention >= 80) { radarStatus = "Forte"; color = "bg-emerald-500"; }
                        else if(stats.retention >= 60) { radarStatus = "Atenção"; color = "bg-yellow-500"; }
                        else { radarStatus = "Crítica"; color = "bg-red-500"; }
                    }
                    
                    html += `
                    <div class="bg-slate-950 border border-slate-800 p-4 rounded-xl">
                        <div class="flex justify-between items-end mb-2">
                            <div class="flex items-center gap-2"><div class="w-3 h-3 rounded-full ${sub.color}"></div><span class="font-bold text-white text-sm">${sub.name}</span></div>
                            <span class="text-[10px] uppercase font-bold tracking-widest px-2 py-0.5 rounded text-white ${color}">${radarStatus}</span>

        // --- SAÚDE/CORPO ---

                });

                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div><label class="text-[10px] font-bold text-slate-500 uppercase">Categoria</label><select id="var-cat" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-white outline-none"><option>Alimentação fora</option><option>Mercado</option><option>Transporte</option><option>Saúde</option><option>Lazer</option><option>Roupas</option><option>Tecnologia</option><option>Educação</option><option>Outro</option></select></div>
                        <div><label class="text-[10px] font-bold text-slate-500 uppercase text-fuchsia-400">Gatilho Psi</label><select id="var-trigger" class="w-full bg-slate-900 border border-fuchsia-900/50 rounded-lg p-2.5 text-xs text-fuchsia-100 outline-none"><option>Necessidade real</option><option>Planejado</option><option class="text-red-400">Ansiedade</option><option class="text-red-400">Cansaço</option><option class="text-red-400">Recompensa</option><option class="text-red-400">Impulso</option><option>Tédio</option></select></div>
                    </div>
                    <button onclick="window.tryAddVariableExpense()" class="w-full bg-yellow-900/50 hover:bg-yellow-800 text-yellow-400 font-bold py-2.5 rounded-lg border border-yellow-700/50 text-xs transition-colors">Debitar Fundo Tático</button>
                </div>
                <div class="space-y-2">`;
                state.financeData.variableExpenses.slice().sort((a,b)=>new Date(b.date)-new Date(a.date)).forEach(v => {
                    html += `<div class="bg-slate-950 border border-slate-800 p-3 rounded-lg flex justify-between items-center group"><div class="flex flex-col"><span class="text-[9px] uppercase font-bold text-slate-500 mb-0.5">${new Date(v.date).toLocaleDateString()} | ${v.trigger}</span><span class="text-sm font-bold text-white">${v.description}</span></div><div class="flex items-center gap-3"><span class="text-xs text-orange-400 font-bold">R$${v.amount.toFixed(2)}</span><button onclick="window.deleteVariable(${v.id})" class="text-slate-600 hover:text-red-400 opacity-0 group-hover:opacity-100"><i data-lucide="trash-2" class="w-4 h-4"></i></button></div></div>`;
                });
                return html + `</div>`;
            }
            else if(uiState.financeTab === 'fixas') {
                let html = `
                <div class="bg-slate-950 border border-slate-800 p-5 rounded-xl mb-6 space-y-4">
                    <div class="grid grid-cols-2 gap-3">
                        <div><label class="text-[10px] font-bold text-slate-500 uppercase">Conta / Dívida</label><input type="text" id="fix-desc" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-white outline-none"></div>
                        <div><label class="text-[10px] font-bold text-slate-500 uppercase">Valor (R$)</label><input type="number" id="fix-amount" step="0.01" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-white outline-none"></div>
                    </div>
                    <div><label class="text-[10px] font-bold text-slate-500 uppercase">Categoria</label><select id="fix-cat" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-white outline-none"><option>Moradia</option><option>Água/Luz/Internet</option><option>Saúde</option><option>Educação</option><option>Assinaturas</option><option>Dívidas</option><option>Outro</option></select></div>
                    <button onclick="window.addFixedExpense()" class="w-full bg-blue-900/50 hover:bg-blue-800 text-blue-300 font-bold py-2.5 rounded-lg border border-blue-700/50 text-xs transition-colors">Adicionar Custo Fixo</button>
                </div><div class="space-y-2">`;
                state.financeData.fixedExpenses.forEach(f => {
                    const paidStyle = f.paid ? 'opacity-50 line-through' : '';
                    html += `<div class="bg-slate-950 border border-slate-800 p-3 rounded-lg flex justify-between items-center group"><div class="flex items-center gap-3"><button onclick="window.toggleFixedPaid(${f.id})"><i data-lucide="${f.paid?'check-circle':'circle'}" class="w-5 h-5 ${f.paid?'text-emerald-500':'text-slate-600'}"></i></button><div class="flex flex-col ${paidStyle}"><span class="text-sm font-bold text-white">${f.description}</span></div></div><div class="flex items-center gap-3"><span class="text-xs text-blue-400 font-bold ${paidStyle}">R$${f.amount.toFixed(2)}</span><button onclick="window.deleteFixed(${f.id})" class="text-slate-600 hover:text-red-400 opacity-0 group-hover:opacity-100"><i data-lucide="trash-2" class="w-4 h-4"></i></button></div></div>`;
                });
                return html + `</div>`;
            }
            else if(uiState.financeTab === 'receitas') {
                let html = `
                <div class="bg-slate-950 border border-slate-800 p-5 rounded-xl mb-6 space-y-4">
                    <div class="grid grid-cols-2 gap-3">
                        <div><label class="text-[10px] font-bold text-slate-500 uppercase">Origem</label><input type="text" id="inc-desc" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-white outline-none"></div>
                        <div><label class="text-[10px] font-bold text-slate-500 uppercase">Valor (R$)</label><input type="number" id="inc-amount" step="0.01" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-white outline-none"></div>
                    </div>
                    <div><label class="text-[10px] font-bold text-slate-500 uppercase">Categoria</label><select id="inc-cat" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-white outline-none"><option>Salário</option><option>Consultoria / PJ</option><option>Extra</option><option>Outro</option></select></div>
                    <button onclick="window.addIncome()" class="w-full bg-emerald-900/50 hover:bg-emerald-800 text-emerald-400 font-bold py-2.5 rounded-lg border border-emerald-700/50 text-xs transition-colors">Injetar Capital</button>
                </div><div class="space-y-2">`;
                state.financeData.incomes.forEach(i => {
                    html += `<div class="bg-slate-950 border border-slate-800 p-3 rounded-lg flex justify-between items-center group"><div class="flex flex-col"><span class="text-sm font-bold text-white">${i.description}</span></div><div class="flex items-center gap-3"><span class="text-xs text-emerald-400 font-bold">R$${i.amount.toFixed(2)}</span><button onclick="window.deleteIncome(${i.id})" class="text-slate-600 hover:text-red-400 opacity-0 group-hover:opacity-100"><i data-lucide="trash-2" class="w-4 h-4"></i></button></div></div>`;
                });
                return html + `</div>`;
            }
            else if(uiState.financeTab === 'diario') {
                let html = `
                <div class="bg-slate-950 border border-slate-800 p-5 rounded-xl mb-6">
                    <h3 class="text-sm font-bold text-slate-300 mb-3"><i data-lucide="book-open" class="inline w-4 h-4 text-fuchsia-400 mr-2"></i>Journal Financeiro</h3>
                    <div class="space-y-3">
                        <select id="mj-mood" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-white outline-none"><option>Ansioso com contas</option><option>Confiante</option><option>Frustrado com gastos</option><option>Calmo</option></select>
                        <input type="text" id="mj-event" placeholder="Evento (Ex: Paguei fatura alta, Vontade de comprar X)" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-white outline-none">
                        <textarea id="mj-thought" placeholder="O que pensou/sentiu?" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-white outline-none h-16"></textarea>
                        <button onclick="window.logMoneyJournal()" class="w-full bg-fuchsia-900/50 hover:bg-fuchsia-800 text-fuchsia-300 font-bold py-2 rounded-lg border border-fuchsia-700/50 text-xs">Registrar Reflexão (+15 XP)</button>
                    </div>
                </div><div class="space-y-3">`;
                state.financeData.moneyJournal.slice().sort((a,b)=>new Date(b.date)-new Date(a.date)).forEach(m => {
                    html += `<div class="bg-slate-950 border border-slate-800 p-4 rounded-xl"><div class="flex items-center gap-2 mb-2"><span class="text-[9px] uppercase font-bold text-slate-500">${new Date(m.date).toLocaleDateString()}</span><span class="text-[9px] uppercase font-bold bg-slate-900 text-slate-300 px-1.5 py-0.5 rounded border border-slate-700">${m.mood}</span></div><h4 class="font-bold text-white text-sm mb-1">${m.event}</h4>${m.action ? `<p class="text-[10px] text-emerald-400 font-bold mb-1 uppercase">Ação: ${m.action}</p>`:''}<p class="text-xs text-slate-400">${m.thought}</p></div>`;
                });
                return html + `</div>`;
            }
            return '';
        }

    </script>
</body>
</html>
