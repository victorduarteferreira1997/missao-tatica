                        </div>
                        <button onclick="window.setMainView('control')" class="shrink-0 text-[10px] font-black uppercase tracking-wider text-slate-500 hover:text-sky-300">Abrir Radar</button>
                    </section>`;
            }

            const compactRows = rows.slice(0, 2).map(row => {
                const demand = row.demand;
                const mainSignal = row.signals[0];
                const meta = severityMeta[mainSignal.severity] || severityMeta.info;
                return `
                    <div class="rounded-xl border ${meta.cls} px-3 py-2.5">
                        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2">
                            <div class="min-w-0 flex-1">
                                <div class="flex flex-wrap items-center gap-1.5 mb-1">
                                    <span class="inline-flex items-center gap-1 text-[9px] font-black uppercase tracking-wide"><i data-lucide="${meta.icon}" class="w-3 h-3"></i>${window.escapeHtml(mainSignal.label)}</span>
                                    ${demand.workflowStatus === 'waiting' && demand.waitingFor ? `<span class="text-[9px] text-amber-200/80">Aguardando ${window.escapeHtml(demand.waitingFor)}</span>` : ''}
                                </div>
                                <div class="font-black text-white text-xs sm:text-sm truncate">${window.escapeHtml(demand.title)}</div>
                                <div class="flex flex-wrap gap-x-3 gap-y-1 mt-1 text-[9px] sm:text-[10px] text-slate-400">
                                    ${demand.followUpAt ? `<span><strong class="text-slate-500 uppercase">Follow-up</strong> ${window.formatOperationalDate(demand.followUpAt)}</span>` : ''}
                                    ${demand.dueDate ? `<span><strong class="text-slate-500 uppercase">Prazo</strong> ${window.formatOperationalDate(demand.dueDate)}</span>` : ''}
                                    ${demand.nextReviewAt ? `<span><strong class="text-slate-500 uppercase">Revisão</strong> ${window.formatOperationalDate(demand.nextReviewAt)}</span>` : ''}
                                </div>
                            </div>
                            <button onclick="window.openOperationalDemandModal('${String(demand.id)}')" class="shrink-0 rounded-lg border border-slate-700 bg-slate-950/50 px-2.5 py-1.5 text-[9px] font-black uppercase tracking-wider text-slate-300 hover:text-sky-300 hover:border-sky-700">Ver</button>
                        </div>
                    </div>`;
            }).join('');

            return `
                <section class="mb-4 rounded-2xl border border-sky-900/50 bg-sky-950/10 p-3 font-mono">
                    <div class="flex items-center justify-between gap-3 mb-2">
                        <div class="min-w-0">
                            <div class="flex items-center gap-2 text-sky-300"><i data-lucide="radar" class="w-4 h-4"></i><span class="text-[10px] font-black uppercase tracking-[0.18em]">Situação Operacional</span></div>
                            <div class="text-[10px] text-slate-500 mt-0.5">${rows.length} item(ns) conhecido(s) pedem atenção.</div>
                        </div>
                        <button onclick="window.setMainView('control')" class="shrink-0 inline-flex items-center gap-1 rounded-lg border border-sky-900/70 bg-sky-950/40 px-2.5 py-1.5 text-[9px] font-black uppercase tracking-wider text-sky-300 hover:bg-sky-900/50"><i data-lucide="arrow-up-right" class="w-3 h-3"></i>Radar</button>
                    </div>
                    <div class="space-y-1.5">${compactRows}</div>
                    ${rows.length > 2 ? `<div class="text-[9px] text-slate-600 mt-2">+ ${rows.length - 2} no Radar.</div>` : ''}
                </section>`;
        };

        window.toggleRadarDetails = function(sectionKey, event) {
            const button = event?.currentTarget;
            const panelId = button?.getAttribute('aria-controls');
            const panel = panelId ? document.getElementById(panelId) : null;
            if (!button || !panel) return;
            const open = button.getAttribute('aria-expanded') !== 'true';
            uiState.radarExpandedSections[sectionKey] = open;
            panel.hidden = !open;
            button.setAttribute('aria-expanded', String(open));
            const label = button.querySelector('[data-radar-details-label]');
            if (label) label.textContent = open ? 'Ocultar detalhes' : 'Detalhes';
            const chevron = button.querySelector('[data-radar-details-chevron]');
            if (chevron) chevron.style.transform = open ? 'rotate(180deg)' : 'rotate(0deg)';
        };

        window.renderOperationalControl = function() {
            const operationalControl = window.getOperationalControl();
            const demands = [...operationalControl.demands];
            const active = demands.filter(d => d.workflowStatus !== 'closed');
            const closed = demands.filter(d => d.workflowStatus === 'closed');
            const waiting = active.filter(d => d.workflowStatus === 'waiting');
            const todayKey = dateKeyFromDate(new Date());
            const nearTermSignals = window.getOperationalSignalsForDate(todayKey, operationalControl.config?.dueSoonDays ?? 2);

            const signalsByDemand = new Map(nearTermSignals.map(row => [String(row.demand.id), row]));
            const signalRank = demand => signalsByDemand.get(String(demand.id))?.severityRank ?? (demand.attentionLevel === 'immediate' ? 0 : demand.attentionLevel === 'attention' ? 1 : 9);
            const attentionOrder = { immediate: 0, attention: 1, controlled: 2 };
            const statusOrder = { active: 0, waiting: 1, backlog: 2 };
            active.sort((a, b) =>
                signalRank(a) - signalRank(b) ||
                ((attentionOrder[a.attentionLevel] ?? 9) - (attentionOrder[b.attentionLevel] ?? 9)) ||
                ((statusOrder[a.workflowStatus] ?? 9) - (statusOrder[b.workflowStatus] ?? 9)) ||
                String(a.followUpAt || a.dueDate || a.nextReviewAt || '9999-12-31').localeCompare(String(b.followUpAt || b.dueDate || b.nextReviewAt || '9999-12-31')) ||
                String(a.title).localeCompare(String(b.title), 'pt-BR')
            );

            const statusMeta = {
                active: { label: 'Ativa', icon: 'play-circle', cls: 'text-sky-300 border-sky-900/60 bg-sky-950/30' },
                waiting: { label: 'Aguardando', icon: 'clock-3', cls: 'text-amber-300 border-amber-900/60 bg-amber-950/30' },
                backlog: { label: 'Para depois', icon: 'archive', cls: 'text-slate-400 border-slate-800 bg-slate-900' },
                closed: { label: 'Encerrada', icon: 'check-circle-2', cls: 'text-emerald-300 border-emerald-900/60 bg-emerald-950/30' }
            };
            const attentionMeta = {
                controlled: { label: 'Sob controle', cls: 'text-emerald-300' },
                attention: { label: 'Atenção', cls: 'text-amber-300' },
                immediate: { label: 'Ação imediata', cls: 'text-red-300' }
            };

            const severityMeta = {
                critical: 'text-red-300', attention: 'text-amber-300', upcoming: 'text-sky-300', info: 'text-slate-400'
            };
            const renderDemandCard = (demand, isClosed = false) => {
                const status = statusMeta[demand.workflowStatus] || statusMeta.active;
                const att = attentionMeta[demand.attentionLevel] || attentionMeta.controlled;
                const areaProject = [demand.area, demand.project].filter(Boolean).join(' · ');
                const isWaiting = demand.workflowStatus === 'waiting';
                const signal = !isClosed ? signalsByDemand.get(String(demand.id)) : null;
                const sortedSignals = [...(signal?.signals || [])].sort((a, b) => ({ critical: 0, attention: 1, upcoming: 2, info: 3 }[a.severity] ?? 9) - ({ critical: 0, attention: 1, upcoming: 2, info: 3 }[b.severity] ?? 9));
                const mainSignal = sortedSignals[0];
                const demandArg = window.escapeHtml(JSON.stringify(String(demand.id)));
                const sectionKey = `demand:${demand.id}`;
                const dateLabel = value => window.escapeHtml(window.formatOperationalDate(value));
                return `<article class="rounded-xl border ${mainSignal?.severity === 'critical' ? 'border-red-900/60' : 'border-slate-800'} bg-slate-900/70 p-3 sm:p-4">
                    <div class="flex flex-wrap items-start justify-between gap-2">
                        <div class="min-w-0 flex-1"><h3 class="break-words text-base font-semibold leading-snug text-slate-100">${window.escapeHtml(demand.title)}</h3>${areaProject ? `<p class="mt-1 text-xs text-slate-400">${window.escapeHtml(areaProject)}</p>` : ''}</div>
                        <span class="inline-flex items-center gap-1.5 rounded-md border px-2 py-1 text-xs ${status.cls}"><i data-lucide="${status.icon}" class="h-3.5 w-3.5"></i>${status.label}</span>
                    </div>
                    ${mainSignal ? `<p class="mt-2 flex items-start gap-1.5 text-xs ${severityMeta[mainSignal.severity] || severityMeta.info}"><i data-lucide="${mainSignal.severity === 'critical' ? 'triangle-alert' : 'calendar-clock'}" class="mt-0.5 h-3.5 w-3.5 shrink-0"></i>${window.escapeHtml(mainSignal.label)}${sortedSignals.length > 1 ? `<span class="text-slate-400">· +${sortedSignals.length - 1} avisos</span>` : ''}</p>` : (!isClosed && demand.attentionLevel !== 'controlled' ? `<p class="mt-2 text-xs ${att.cls}">${att.label}</p>` : '')}
                    <div class="mt-3"><p class="text-xs font-medium text-slate-400">Próxima ação</p><p class="mt-1 break-words text-sm ${demand.nextAction ? 'text-slate-200' : 'text-amber-200'}">${demand.nextAction ? window.escapeHtml(demand.nextAction) : 'Defina a próxima ação ao editar.'}</p></div>
                    <div class="mt-2 flex flex-wrap gap-x-4 gap-y-1 text-xs text-slate-400">
                        ${demand.dueDate ? `<span>Prazo: <span class="text-slate-300">${dateLabel(demand.dueDate)}</span></span>` : ''}
                        ${isWaiting ? `<span>Aguardando: <span class="text-amber-200">${window.escapeHtml(demand.waitingFor || 'Responsável não informado')}</span></span>` : ''}
                        ${isWaiting && demand.followUpAt ? `<span>Retorno: <span class="text-amber-200">${dateLabel(demand.followUpAt)}</span></span>` : ''}
                    </div>
                    <div class="mt-3 flex flex-wrap items-center justify-between gap-2 border-t border-slate-800 pt-2">
                        <button type="button" onclick="window.toggleRadarDetails(${window.escapeHtml(JSON.stringify(sectionKey))}, event)" aria-expanded="${Boolean(uiState.radarExpandedSections[sectionKey])}" aria-controls="radar-details-${encodeURIComponent(String(demand.id))}" class="inline-flex min-h-10 items-center gap-2 rounded-lg px-2 text-sm font-medium text-slate-300 hover:bg-slate-800 hover:text-white focus-visible:outline focus-visible:outline-2 focus-visible:outline-indigo-400">
                            <i data-lucide="chevron-down" data-radar-details-chevron class="h-4 w-4 transition-transform" style="transform:rotate(${uiState.radarExpandedSections[sectionKey] ? '180' : '0'}deg)"></i><span data-radar-details-label>${uiState.radarExpandedSections[sectionKey] ? 'Ocultar detalhes' : 'Detalhes'}</span>
                        </button>
                        <div class="ml-auto flex items-center gap-2">
                        <button type="button" onclick="window.openOperationalDemandModal(${demandArg})" class="inline-flex min-h-10 items-center gap-1.5 rounded-lg border border-slate-700 px-3 py-2 text-xs font-medium text-slate-300 hover:bg-slate-800"><i data-lucide="pencil" class="h-3.5 w-3.5"></i>Editar</button>
                        ${isClosed ? `<button type="button" onclick="window.reopenOperationalDemand(${demandArg})" class="inline-flex min-h-10 items-center gap-1.5 rounded-lg border border-sky-900/60 px-3 py-2 text-xs font-medium text-sky-200 hover:bg-sky-950/50"><i data-lucide="rotate-ccw" class="h-3.5 w-3.5"></i>Reabrir</button>` : `<button type="button" onclick="window.closeOperationalDemand(${demandArg})" class="inline-flex min-h-10 items-center gap-1.5 rounded-lg border border-slate-700 px-3 py-2 text-xs font-medium text-slate-300 hover:bg-slate-800 hover:text-emerald-200"><i data-lucide="check" class="h-3.5 w-3.5"></i>Encerrar</button>`}
                        </div>
                    </div>
                    <div id="radar-details-${encodeURIComponent(String(demand.id))}" role="region" aria-label="Detalhes de ${window.escapeHtml(demand.title)}" ${uiState.radarExpandedSections[sectionKey] ? '' : 'hidden'} class="mt-3 border-t border-slate-800 pt-3">
                        <div class="flex flex-col items-start sm:flex-row gap-4 sm:gap-6">
                            <dl class="w-full min-w-0 flex-1 grid content-start grid-cols-1 sm:grid-cols-2 gap-x-4 gap-y-3">
                                <div><dt class="text-xs text-slate-400">Próxima revisão</dt><dd class="mt-1 text-sm text-slate-200">${dateLabel(demand.nextReviewAt)}</dd></div>
                                <div><dt class="text-xs text-slate-400">Responsável</dt><dd class="mt-1 break-words text-sm text-slate-200">${window.escapeHtml(demand.owner || 'Não informado')}</dd></div>
                                <div class="sm:col-span-2"><dt class="text-xs text-slate-400">Solicitante</dt><dd class="mt-1 break-words text-sm text-slate-200">${window.escapeHtml(demand.requester || 'Não informado')}</dd></div>
                                ${isWaiting ? `<div><dt class="text-xs text-slate-400">Aguardando desde</dt><dd class="mt-1 text-sm text-slate-200">${dateLabel(demand.waitingSince)}</dd></div>` : ''}
                            </dl>
                            ${sortedSignals.length > 1 ? `<div class="w-full min-w-0 flex-1 border-t sm:border-t-0 sm:border-l border-slate-800 pt-3 sm:pt-0 sm:pl-6"><h4 class="text-xs font-medium text-slate-300">Outros pontos de atenção</h4><ul class="mt-2 space-y-2 text-sm leading-relaxed">${sortedSignals.slice(1).map(item => `<li class="flex items-start gap-2 ${item.severity === 'critical' ? 'text-red-300' : 'text-slate-300'}"><i data-lucide="circle-dot" class="mt-1 h-3.5 w-3.5 shrink-0 ${severityMeta[item.severity] || severityMeta.info}"></i><span class="min-w-0 flex-1 break-words">${window.escapeHtml(item.label)}</span></li>`).join('')}</ul></div>` : ''}
                        </div>
                    </div>
                </article>`;
            };
            return `<section class="space-y-3 font-sans">
                <header class="rounded-xl border border-slate-800 bg-slate-900/70 p-3 sm:p-4">
                    <div class="flex flex-wrap items-center justify-between gap-3">
                        <div><h2 class="text-lg font-semibold text-white">Radar de demandas</h2><p class="mt-1 text-sm text-slate-400">Acompanhe próximas ações, prazos e retornos.</p></div>
                        <button type="button" onclick="window.openOperationalDemandModal()" class="inline-flex min-h-10 items-center gap-2 rounded-lg bg-indigo-600 px-3 py-2 text-sm font-medium text-white hover:bg-indigo-500"><i data-lucide="plus" class="h-4 w-4"></i>Nova demanda</button>
                    </div>
                    <div class="mt-3 flex flex-wrap gap-x-4 gap-y-2 border-t border-slate-800 pt-3 text-xs text-slate-400"><span>${active.length} em acompanhamento</span><span>${waiting.length} aguardando retorno</span><span class="${nearTermSignals.length ? 'text-amber-200' : 'text-slate-400'}">${nearTermSignals.length} precisam de atenção</span></div>

                        ${editingMode ? `<div class="grid grid-cols-2 gap-2 mb-2"><button onclick="window.saveStudyPlanBlockChanges()" class="bg-cyan-700 hover:bg-cyan-600 text-white text-xs font-black uppercase tracking-widest rounded-lg py-2.5 flex items-center justify-center gap-2"><i data-lucide="save" class="w-4 h-4"></i> Salvar alterações</button><button onclick="window.cancelEditStudyPlanBlock()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-black uppercase tracking-widest rounded-lg py-2.5">Cancelar</button></div>` : `<button onclick="window.addStudyPlanBlock()" class="w-full bg-cyan-700 hover:bg-cyan-600 text-white text-xs font-black uppercase tracking-widest rounded-lg py-2 mb-2">Adicionar ao calendário</button>`}

            const candidates = [
                { id: 'primeiro_sangue', count: p.missionEvents.length, target: 1 },
                { id: 'pomo_master', count: Number(p.currentStats.pomodorosCompleted) || 0, target: 1 },

        function renderStudyContent() {
            if (uiState.studyTab === 'plano') {

                const completedBlocks = dayBlocks.filter(b => b.status === 'completed').length;
                const plannedMinutes = dayBlocks.reduce((acc, b) => acc + (parseInt(b.plannedMinutes, 10) || 0), 0);
                const completedMinutes = dayBlocks.filter(b => b.status === 'completed').reduce((acc, b) => acc + (parseInt(b.plannedMinutes, 10) || 0), 0);
                const progressPct = dayBlocks.length ? Math.round((completedBlocks / dayBlocks.length) * 100) : 0;
                const pendingBlocks = dayBlocks.filter(b => !['completed','cancelled'].includes(b.status));
                const nextBlock = pendingBlocks[0] || null;
                const nextSubject = nextBlock?.subjectId ? state.studyData.subjects.find(s => String(s.id) === String(nextBlock.subjectId)) : null;
                const globalDueReviews = (state.studyData.reviews || []).filter(r => {
                    if (r.status !== 'pending') return false;
                    const due = new Date(r.dueDate); due.setHours(0,0,0,0);
                    const today = new Date(); today.setHours(0,0,0,0);
                    return due <= today;
                }).length;
                const globalOpenErrors = (state.studyData.errorLog || []).filter(e => e.status === 'open').length;

                const plannedSubjectIds = new Set(dayBlocks.filter(b => b.subjectId !== null && b.subjectId !== undefined && b.subjectId !== '').map(b => String(b.subjectId)));
                const now = new Date();
                const dueReviews = state.studyData.reviews.filter(r => r.status === 'pending' && new Date(r.dueDate) <= now && plannedSubjectIds.has(String(r.subjectId)));
                const openErrors = state.studyData.errorLog.filter(e => e.status === 'open' && plannedSubjectIds.has(String(e.subjectId)));
                let recs = [];

                if (dueReviews.length > 0) recs.push({ title: 'Revisões ligadas ao plano', desc: `Há ${dueReviews.length} revisão${dueReviews.length !== 1 ? 'ões' : ''} pendente${dueReviews.length !== 1 ? 's' : ''} das disciplinas previstas para este dia.`, color: 'text-red-400', border: 'border-red-900/50', icon: 'rotate-cw' });
                if (openErrors.length > 0) recs.push({ title: 'Erros ligados ao plano', desc: `Há ${openErrors.length} item${openErrors.length !== 1 ? 's' : ''} aberto${openErrors.length !== 1 ? 's' : ''} no Caderno de Erros das disciplinas previstas para este dia.`, color: 'text-orange-400', border: 'border-orange-900/50', icon: 'microscope' });

                plannedSubjectIds.forEach(subjectId => {
                    const sub = state.studyData.subjects.find(s => String(s.id) === String(subjectId));
                    if (!sub) return;
                    const stats = window.getSubjectStats(sub.id);
                    if (stats.retention > 0 && stats.retention < 70) {
                        recs.push({ title: `Reforço sugerido: ${sub.name}`, desc: `Retenção atual de ${stats.retention}%. Considere questões curtas ou recuperação ativa durante o bloco planejado.`, color: 'text-yellow-400', border: 'border-yellow-900/50', icon: 'brain' });
                    }
                    if (!stats.lastSession || (now - stats.lastSession) / (1000 * 60 * 60 * 24) > 7) {
                        recs.push({ title: `Retomada sugerida: ${sub.name}`, desc: 'Esta disciplina está no plano de hoje e não possui sessão recente registrada. Comece com um bloco pequeno para reduzir a resistência inicial.', color: 'text-slate-300', border: 'border-slate-700', icon: 'history' });
                    }
                });

                if (dayBlocks.length > 0 && state.energy < 30) {
                    recs.unshift({ title: 'Bateria executiva baixa', desc: 'Mantenha o planejamento, mas reduza a exigência: leitura leve, flashcards ou um bloco menor.', color: 'text-blue-400', border: 'border-blue-900/50', icon: 'battery-low' });

                            ${dayBlocks.length ? `<div class="w-full bg-slate-800 rounded-full h-1.5 mt-4"><div class="bg-cyan-500 h-1.5 rounded-full transition-all" style="width:${progressPct}%"></div></div><div class="flex justify-between gap-3 mt-2 text-[10px] text-slate-500"><span>${completedMinutes}/${plannedMinutes} min do plano concluído</span><button onclick="window.setStudyTab('planning')" class="text-cyan-400 hover:text-cyan-300 font-bold">Ajustar planejamento</button></div>` : ''}
                        </div>
                        <div class="bg-slate-950 border border-slate-800 rounded-2xl p-4 flex flex-col gap-2">
                            <div class="text-[9px] text-slate-600 uppercase font-black tracking-[0.2em] mb-1">Atenção acadêmica</div>
                            <button type="button" onclick="window.setStudyTab('reviews')" class="flex items-center justify-between gap-3 rounded-xl border ${globalDueReviews ? 'border-red-900/60 bg-red-950/15' : 'border-slate-800 bg-slate-900/60'} p-3 text-left"><span class="flex items-center gap-2 text-xs font-bold ${globalDueReviews ? 'text-red-300' : 'text-slate-400'}"><i data-lucide="rotate-cw" class="w-4 h-4"></i> Revisões vencidas/hoje</span><span class="text-sm font-black ${globalDueReviews ? 'text-red-300' : 'text-slate-600'}">${globalDueReviews}</span></button>
                            <button type="button" onclick="window.setStudyTab('erros')" class="flex items-center justify-between gap-3 rounded-xl border ${globalOpenErrors ? 'border-fuchsia-900/50 bg-fuchsia-950/10' : 'border-slate-800 bg-slate-900/60'} p-3 text-left"><span class="flex items-center gap-2 text-xs font-bold ${globalOpenErrors ? 'text-fuchsia-300' : 'text-slate-400'}"><i data-lucide="microscope" class="w-4 h-4"></i> Erros em aberto</span><span class="text-sm font-black ${globalOpenErrors ? 'text-fuchsia-300' : 'text-slate-600'}">${globalOpenErrors}</span></button>
                            <button type="button" onclick="window.setStudyTab('log')" class="mt-auto bg-slate-900 hover:bg-slate-800 border border-slate-800 text-slate-300 rounded-xl p-3 text-xs font-black flex items-center justify-center gap-2"><i data-lucide="plus" class="w-4 h-4 text-cyan-400"></i> Registrar estudo avulso</button>
                        </div>
                    </div>
                    ${dayBlocks.length ? `<div class="mb-5"><div class="flex items-center justify-between gap-3 mb-3"><div><h3 class="text-xs font-black text-slate-300 uppercase tracking-widest">Plano completo do dia</h3><p class="text-[10px] text-slate-600 mt-1">Abra os cards apenas quando precisar executar, registrar, remarcar ou concluir.</p></div></div><div class="grid grid-cols-1 lg:grid-cols-2 gap-3">${dayBlocks.map(b => renderStudyPlanBlockCard(b, true)).join('')}</div></div>` : ''}`;

                if (dayBlocks.length > 0) {
                    html += `<details class="bg-slate-950 border border-slate-800 rounded-xl overflow-hidden"><summary class="cursor-pointer list-none p-4 flex items-center justify-between gap-3 hover:bg-slate-900/60"><div class="flex items-center gap-2"><i data-lucide="sparkles" class="w-4 h-4 text-cyan-400"></i><span class="text-xs font-black text-slate-300 uppercase tracking-widest">Apoios para o plano</span></div><span class="text-[10px] text-slate-600">${recs.length} aviso${recs.length === 1 ? '' : 's'} • expandir</span></summary><div class="border-t border-slate-800 p-4"><p class="text-[10px] text-slate-600 mb-4">Avisos ligados apenas às disciplinas planejadas para ${selectedDay.label}.</p><div class="space-y-3">`;
                    if (recs.length === 0) html += `<div class="text-slate-500 italic text-sm border border-dashed border-slate-800 rounded-lg p-4">Nenhum alerta específico para os blocos planejados. Execute a agenda normalmente.</div>`;
                    recs.slice(0, 5).forEach(r => {
                        html += `<div class="bg-slate-900 border ${r.border} p-4 rounded-lg flex items-start gap-3"><i data-lucide="${r.icon || 'info'}" class="${r.color} w-5 h-5 mt-0.5"></i><div><h4 class="font-bold text-white text-sm">${r.title}</h4><p class="text-xs text-slate-400 mt-1">${r.desc}</p></div></div>`;
                    });
                    html += `</div></div></details>`;
                }

                return html;
            }
            else if (uiState.studyTab === 'planning') {
                return renderStudyPlanningContent();
            }
            else if (uiState.studyTab === 'dashboard') {
                const sessions = state.studyData?.sessions || [];
                const subjects = state.studyData?.subjects || [];
                const totalSessions = sessions.length;
                const totalMinutes = sessions.reduce((acc, s) => acc + (Number(s.duration) || 0), 0);
                const totalQ = sessions.reduce((acc, s) => acc + (Number(s.qTotal) || 0), 0);
                const correctQ = sessions.reduce((acc, s) => acc + (Number(s.qCorrect) || 0), 0);
                const globalRetention = totalQ > 0 ? Math.round((correctQ / totalQ) * 100) : null;
                const progressNow = new Date();

                let confBeforeAvg = null, confAfterAvg = null;
                const sessionsWithConf = sessions.filter(s => Number.isFinite(Number(s.confBefore)) && Number.isFinite(Number(s.confAfter)));
                if (sessionsWithConf.length > 0) {
                    confBeforeAvg = (sessionsWithConf.reduce((acc, s) => acc + Number(s.confBefore), 0) / sessionsWithConf.length).toFixed(1);
                    confAfterAvg = (sessionsWithConf.reduce((acc, s) => acc + Number(s.confAfter), 0) / sessionsWithConf.length).toFixed(1);
                }

                const weeklyBlocks = (state.studyData?.studyPlan?.weeklyBlocks || []).filter(b => b.status !== 'cancelled');
                const weeklyCompleted = weeklyBlocks.filter(b => b.status === 'completed').length;
                const weeklyPartial = weeklyBlocks.filter(b => b.status === 'partial').length;
                const weeklyPlanPct = weeklyBlocks.length ? Math.round((weeklyCompleted / weeklyBlocks.length) * 100) : 0;
                const dueReviewsCount = (state.studyData?.reviews || []).filter(r => {
                    if (r.status !== 'pending') return false;
                    const due = new Date(r.dueDate);
                    if (Number.isNaN(due.getTime())) return false;
                    due.setHours(0,0,0,0);
                    const today = new Date(); today.setHours(0,0,0,0);
                    return due <= today;
                }).length;

                let html = `
                <div class="mb-5">
                    <div class="flex flex-col sm:flex-row sm:items-end justify-between gap-3 mb-3">
                        <div><h3 class="text-sm font-black text-white uppercase tracking-widest flex items-center gap-2"><i data-lucide="chart-no-axes-combined" class="w-4 h-4 text-cyan-400"></i> Visão geral</h3><p class="text-[11px] text-slate-500 mt-1">Primeiro o essencial. Retenção por disciplina e histórico ficam recolhidos abaixo.</p></div>
                        ${dueReviewsCount ? `<button type="button" onclick="window.setStudyTab('reviews')" class="inline-flex items-center gap-2 rounded-lg border border-red-900/60 bg-red-950/20 text-red-300 px-3 py-2 text-[10px] font-black uppercase tracking-widest"><i data-lucide="rotate-cw" class="w-3.5 h-3.5"></i>${dueReviewsCount} revisão${dueReviewsCount === 1 ? '' : 'ões'} para atenção</button>` : `<span class="inline-flex items-center gap-1.5 text-[10px] font-bold text-emerald-400"><i data-lucide="check-circle-2" class="w-3.5 h-3.5"></i> Revisões em dia</span>`}
                    </div>
                    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
                        <div class="bg-slate-950 border border-slate-800 p-4 rounded-xl"><div class="flex items-center gap-2 text-[9px] text-slate-500 uppercase font-black tracking-widest"><i data-lucide="clock" class="text-indigo-400 w-4 h-4"></i> Tempo estudado</div><div class="text-2xl font-black text-white mt-2">${(totalMinutes / 60).toFixed(1)}h</div><div class="text-[10px] text-slate-600 mt-1">${totalSessions} sessão${totalSessions === 1 ? '' : 'ões'}</div></div>
                        <div class="bg-slate-950 border border-slate-800 p-4 rounded-xl"><div class="flex items-center gap-2 text-[9px] text-slate-500 uppercase font-black tracking-widest"><i data-lucide="target" class="text-cyan-400 w-4 h-4"></i> Questões</div><div class="text-2xl font-black text-white mt-2">${totalQ}</div><div class="text-[10px] text-slate-600 mt-1">${correctQ} acerto${correctQ === 1 ? '' : 's'}</div></div>
                        <div class="bg-slate-950 border border-slate-800 p-4 rounded-xl"><div class="flex items-center gap-2 text-[9px] text-slate-500 uppercase font-black tracking-widest"><i data-lucide="percent" class="text-emerald-400 w-4 h-4"></i> Acerto global</div><div class="text-2xl font-black text-white mt-2">${globalRetention === null ? '—' : globalRetention + '%'}</div><div class="text-[10px] text-slate-600 mt-1">${totalQ ? 'sobre questões registradas' : 'sem questões registradas'}</div></div>
                        <div class="bg-slate-950 border border-slate-800 p-4 rounded-xl"><div class="flex items-center gap-2 text-[9px] text-slate-500 uppercase font-black tracking-widest"><i data-lucide="brain" class="text-fuchsia-400 w-4 h-4"></i> Confiança</div><div class="text-2xl font-black text-white mt-2">${confBeforeAvg === null ? '—' : `${confBeforeAvg} <span class="text-slate-600 text-lg">→</span> ${confAfterAvg}`}</div><div class="text-[10px] text-slate-600 mt-1">antes → depois</div></div>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-5">`;

                // Estudos dos últimos 7 dias.
                const todayForChart = new Date();
                todayForChart.setHours(0,0,0,0);
                const last7Days = [];
                for (let i = 6; i >= 0; i--) {
                    const d = new Date(todayForChart);
                    d.setDate(d.getDate() - i);
                    last7Days.push(d);
                }
                const dayNames = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
                let maxMins = 0;
                const studyChartData = last7Days.map(dateObj => {
                    let totalMins = 0;
                    sessions.forEach(s => {
                        if (!s.date) return;
                        const sd = new Date(s.date);
                        if (!Number.isNaN(sd.getTime()) && sd.getFullYear() === dateObj.getFullYear() && sd.getMonth() === dateObj.getMonth() && sd.getDate() === dateObj.getDate()) {
                            totalMins += (Number(s.duration) || 0);
                        }
                    });
                    if (totalMins > maxMins) maxMins = totalMins;
                    return { label: dayNames[dateObj.getDay()], mins: totalMins };
                });

                html += `<div class="bg-slate-950 border border-slate-800 p-4 rounded-xl flex flex-col min-h-[190px]">
                            <div class="flex items-center justify-between gap-2 mb-4"><h4 class="text-[10px] font-bold text-slate-500 uppercase tracking-widest">Estudos — últimos 7 dias</h4><span class="text-[9px] text-slate-600">minutos</span></div>`;
                if (maxMins === 0) {
                    html += `<div class="flex-1 flex items-center justify-center text-xs text-slate-600 italic text-center">Nenhuma sessão registrada nos últimos 7 dias.</div>`;
                } else {
                    html += `<div class="flex items-end justify-between h-32 mt-auto px-1 sm:px-2 gap-1 sm:gap-2">`;
                    studyChartData.forEach(c => {
                        const heightPercent = maxMins > 0 ? (c.mins / maxMins) * 100 : 0;
                        html += `<div class="flex flex-col items-center gap-1.5 w-full"><span class="text-[9px] font-bold text-cyan-400">${c.mins > 0 ? c.mins + 'm' : ''}</span><div class="w-full max-w-[20px] ${c.mins ? 'bg-cyan-600' : 'bg-slate-800'} rounded-t-sm transition-all" style="height:${c.mins ? Math.max(heightPercent, 4) : 2}%;"></div><span class="text-[9px] text-slate-500 uppercase font-bold">${c.label}</span></div>`;
                    });
                    html += `</div>`;
                }
                html += `</div>`;

                // Execução do plano de estudos da semana — agora o indicador principal é realmente acadêmico.
                const planByDay = daysOfWeek.map(day => {
                    const blocks = weeklyBlocks.filter(b => b.day === day.id);
                    const completed = blocks.filter(b => b.status === 'completed').length;
                    const partial = blocks.filter(b => b.status === 'partial').length;
                    const pct = blocks.length ? Math.round((completed / blocks.length) * 100) : 0;
                    return { label: day.label.substring(0,3), total: blocks.length, completed, partial, pct };
                });
                html += `<div class="bg-slate-950 border border-slate-800 p-4 rounded-xl flex flex-col min-h-[190px]">
                            <div class="flex items-center justify-between gap-2 mb-3"><div><h4 class="text-[10px] font-bold text-slate-500 uppercase tracking-widest">Plano de estudos da semana</h4><p class="text-[9px] text-slate-600 mt-1">${weeklyCompleted}/${weeklyBlocks.length} concluídos${weeklyPartial ? ` • ${weeklyPartial} parcial${weeklyPartial === 1 ? '' : 'is'}` : ''}</p></div><span class="text-lg font-black ${weeklyPlanPct === 100 && weeklyBlocks.length ? 'text-emerald-400' : 'text-cyan-300'}">${weeklyBlocks.length ? weeklyPlanPct + '%' : '—'}</span></div>
                            <div class="space-y-2.5 mt-auto">`;
                planByDay.forEach(c => {
                    const textClass = c.pct === 100 && c.total ? 'text-emerald-400' : (c.completed ? 'text-cyan-400' : 'text-slate-600');
                    html += `<div><div class="flex justify-between text-[9px] font-bold mb-1 uppercase tracking-wider"><span class="text-slate-400">${c.label} <span class="text-slate-600 ml-1">(${c.completed}/${c.total}${c.partial ? ` +${c.partial} parcial` : ''})</span></span><span class="${textClass}">${c.total ? c.pct + '%' : '—'}</span></div><div class="w-full bg-slate-900 rounded-full h-1.5"><div class="${c.pct === 100 && c.total ? 'bg-emerald-500' : 'bg-cyan-600'} h-1.5 rounded-full transition-all" style="width:${c.pct}%"></div></div></div>`;
                });
                html += `</div></div></div>`;

                // Retenção por disciplina preservada, mas recolhida para reduzir poluição.
                const subjectRows = subjects.map(sub => {
                    const stats = window.getSubjectStats(sub.id);
                    let radarStatus = 'Sem dados', color = 'bg-slate-700', textColor = 'text-slate-400';
                    if (stats.lastSession) {
                        const daysSince = (progressNow - stats.lastSession) / (1000 * 60 * 60 * 24);
                        if (daysSince > 10) { radarStatus = 'Revisar'; color = 'bg-slate-600'; textColor = 'text-slate-300'; }
                        else if (stats.totalQ === 0) { radarStatus = 'Sem questões'; color = 'bg-slate-600'; textColor = 'text-slate-300'; }
                        else if (stats.retention >= 80) { radarStatus = 'Forte'; color = 'bg-emerald-500'; textColor = 'text-emerald-300'; }
                        else if (stats.retention >= 60) { radarStatus = 'Atenção'; color = 'bg-yellow-500'; textColor = 'text-yellow-300'; }
                        else { radarStatus = 'Crítica'; color = 'bg-red-500'; textColor = 'text-red-300'; }
                    }
                    return { sub, stats, radarStatus, color, textColor };
                });
                const attentionSubjects = subjectRows.filter(row => ['Atenção','Crítica','Revisar'].includes(row.radarStatus)).length;

                html += `<details class="bg-slate-950 border border-slate-800 rounded-xl overflow-hidden mb-3">
                    <summary class="cursor-pointer list-none p-4 flex items-center justify-between gap-3 hover:bg-slate-900/60"><div class="flex items-center gap-2 min-w-0"><i data-lucide="bar-chart-2" class="text-cyan-400 w-4 h-4 shrink-0"></i><div class="min-w-0"><div class="text-xs font-black text-slate-300 uppercase tracking-widest">Retenção por disciplina</div><div class="text-[10px] text-slate-600 mt-0.5">Abra quando quiser diagnosticar uma matéria específica.</div></div></div><span class="text-[10px] font-bold ${attentionSubjects ? 'text-yellow-300' : 'text-slate-600'}">${attentionSubjects ? attentionSubjects + ' para atenção' : subjects.length + ' disciplina' + (subjects.length === 1 ? '' : 's')}</span></summary>
                    <div class="border-t border-slate-800 p-4 space-y-3">`;
                if (subjects.length === 0) {
                    html += `<p class="text-slate-500 text-sm italic text-center p-5 border border-dashed border-slate-800 rounded-xl">Nenhuma disciplina cadastrada em Conteúdo.</p>`;
                } else {
                    subjectRows.forEach(({sub, stats, radarStatus, color, textColor}) => {
                        html += `<div class="bg-slate-900/70 border border-slate-800 p-4 rounded-xl"><div class="flex justify-between items-center gap-3 mb-2"><div class="flex items-center gap-2 min-w-0"><div class="w-3 h-3 rounded-full ${sub.color} shrink-0"></div><span class="font-bold text-white text-sm truncate">${window.escapeHtml(sub.name)}</span></div><span class="text-[9px] uppercase font-black tracking-widest px-2 py-1 rounded border border-slate-700 ${textColor}">${radarStatus}</span></div><div class="flex justify-between text-[10px] font-bold text-slate-500 mb-1 uppercase tracking-wider"><span>Acerto (${stats.correctQ}/${stats.totalQ})</span><span class="${stats.totalQ ? textColor : 'text-slate-600'}">${stats.totalQ ? stats.retention + '%' : '—'}</span></div><div class="w-full bg-slate-950 rounded-full h-2 border border-slate-800"><div class="${color} h-full rounded-full transition-all" style="width:${stats.totalQ ? stats.retention : 0}%"></div></div>${stats.lastSession ? `<div class="text-[9px] text-slate-600 mt-2">Última sessão: ${stats.lastSession.toLocaleDateString('pt-BR')}</div>` : ''}</div>`;
                    });
                }
                html += `</div></details>`;

                // Histórico preservado, recolhido para não disputar atenção com o resumo.
                const recentSessions = sessions.slice().sort((a, b) => new Date(b.date) - new Date(a.date)).slice(0, 10);
                html += `<details class="bg-slate-950 border border-slate-800 rounded-xl overflow-hidden mb-3"><summary class="cursor-pointer list-none p-4 flex items-center justify-between gap-3 hover:bg-slate-900/60"><div class="flex items-center gap-2"><i data-lucide="history" class="w-4 h-4 text-cyan-500"></i><div><div class="text-xs font-black text-slate-300 uppercase tracking-widest">Histórico de sessões</div><div class="text-[10px] text-slate-600 mt-0.5">Últimas 10 sessões registradas.</div></div></div><span class="text-[10px] text-slate-600">${totalSessions} total</span></summary><div class="border-t border-slate-800 p-4 space-y-3">`;
                if (recentSessions.length === 0) {
                    html += `<p class="text-slate-500 text-sm italic text-center p-4 border border-dashed border-slate-800 rounded-xl">Nenhuma sessão registrada.</p>`;
                } else {
                    recentSessions.forEach(s => {
                        const sub = subjects.find(sub => String(sub.id) === String(s.subjectId)) || { name: 'Disciplina removida', color: 'bg-slate-500' };
                        const typeLabel = SESSION_TYPES[s.type]?.label || s.type || 'Sessão';
                        const xpText = s.xpAwarded ? `<span class="text-[9px] text-indigo-400 font-bold bg-indigo-950/50 px-1.5 py-0.5 rounded border border-indigo-900/50">+${s.xpAwarded} XP</span>` : '';
                        const sessionDate = new Date(s.date);
                        const dateLabel = Number.isNaN(sessionDate.getTime()) ? 'Data não registrada' : sessionDate.toLocaleDateString('pt-BR');
                        html += `<div class="bg-slate-900/70 border border-slate-800 p-3 rounded-lg flex justify-between items-center group gap-3"><div class="flex flex-col min-w-0"><div class="flex items-center gap-2 mb-1 flex-wrap"><span class="text-[9px] uppercase font-bold text-slate-500">${dateLabel} | ${window.escapeHtml(typeLabel)} | ${Number(s.duration) || 0}m</span>${xpText}</div><span class="text-sm font-bold text-white flex items-center gap-1.5 min-w-0"><span class="w-2 h-2 rounded-full ${sub.color} shrink-0"></span><span class="truncate">${window.escapeHtml(sub.name)}</span>${s.topic ? `<span class="text-xs text-slate-400 font-normal truncate">— ${window.escapeHtml(s.topic)}</span>` : ''}</span></div><button onclick="window.deleteStudySession(${Number(s.id) || 0})" class="text-slate-600 hover:text-red-400 p-2 transition-all shrink-0" title="Excluir sessão"><i data-lucide="trash-2" class="w-4 h-4"></i></button></div>`;
                    });
                }
                html += `</div></details>`;

                // A antiga Eficiência da Semana foi preservada como contexto secundário, sem misturar missão geral com desempenho acadêmico principal.
                const efficiencyChartData = daysOfWeek.map(day => {
                    const dayTasks = (state.tasks || []).filter(t => t.day === day.id);
                    const total = dayTasks.length;
                    const completed = dayTasks.filter(t => t.completed).length;
                    const percent = total === 0 ? 0 : Math.round((completed / total) * 100);
                    return { label: day.label.substring(0,3), total, completed, percent };
                });
                html += `<details class="bg-slate-950 border border-slate-800 rounded-xl overflow-hidden"><summary class="cursor-pointer list-none p-4 flex items-center justify-between gap-3 hover:bg-slate-900/60"><div class="flex items-center gap-2"><i data-lucide="layout-dashboard" class="w-4 h-4 text-slate-500"></i><div><div class="text-xs font-black text-slate-400 uppercase tracking-widest">Contexto geral da semana</div><div class="text-[10px] text-slate-600 mt-0.5">Eficiência das missões gerais — informação preservada da versão anterior.</div></div></div><span class="text-[10px] text-slate-600">expandir</span></summary><div class="border-t border-slate-800 p-4 space-y-2.5">`;
                efficiencyChartData.forEach(c => {
                    const barColor = c.percent === 100 ? 'bg-emerald-500' : (c.percent > 0 ? 'bg-indigo-500' : 'bg-slate-700');
                    const textColor = c.percent === 100 ? 'text-emerald-400' : (c.percent > 0 ? 'text-indigo-400' : 'text-slate-600');
                    html += `<div><div class="flex justify-between text-[9px] font-bold mb-1 uppercase tracking-wider"><span class="text-slate-400">${c.label} <span class="text-slate-600 ml-1">(${c.completed}/${c.total})</span></span><span class="${textColor}">${c.percent}%</span></div><div class="w-full bg-slate-900 rounded-full h-1.5"><div class="${barColor} h-1.5 rounded-full transition-all" style="width:${c.percent}%"></div></div></div>`;
                });
                html += `</div></details>`;

                return html;
            }

                const archived = visibleReviews.filter(r => r.status === 'archived').sort((a, b) => new Date(b.archivedAt || b.completedAt || b.dueDate) - new Date(a.archivedAt || a.completedAt || a.dueDate)).slice(0, 10);

                const dueToday = pending.filter(r => new Date(r.dueDate) <= now);
                const upcoming = pending.filter(r => new Date(r.dueDate) > now).slice(0, 10);

                const renderReviewCard = (r) => {
                    const sub = state.studyData.subjects.find(s => s.id === r.subjectId) || { name: 'Deletada', color: 'bg-slate-500' };
                    const phase = r.phase || 'initial';
                    const phaseLabel = phase === 'maintenance' ? 'Manutenção' : 'Inicial';
                    const phaseColor = phase === 'maintenance' ? 'bg-emerald-950 text-emerald-400 border-emerald-900/50' : 'bg-cyan-950 text-cyan-400 border-cyan-900/50';
                    
                    const step = r.cycleStep || r.intervalDays || 1;
                    const stepLabel = 'D+' + step;
                    
                    let statusLabel = 'Programada';
                    let statusColor = 'bg-slate-800 text-slate-400 border-slate-700';
                    const dueDateObj = new Date(r.dueDate);
                    const todayDate = new Date();
                    todayDate.setHours(0,0,0,0);
                    const due = new Date(dueDateObj);
                    due.setHours(0,0,0,0);
                    
                    const isCompleted = r.status === 'completed';
                    const isArchived = r.status === 'archived';
                    
                    if (isArchived) {
                        statusLabel = 'Arquivada';
                        statusColor = 'bg-slate-900 text-slate-600 border-slate-800';
                    } else if (isCompleted) {
                        statusLabel = 'Concluída';
                        statusColor = 'bg-emerald-900/20 text-emerald-500 border-emerald-900/50';
                    } else if (due < todayDate) {
                        statusLabel = 'Atrasada';
                        statusColor = 'bg-red-950 text-red-400 border-red-900/50';
                    } else if (due.getTime() === todayDate.getTime()) {
                        statusLabel = 'Hoje';
                        statusColor = 'bg-yellow-950 text-yellow-400 border-yellow-900/50';
                    }

                    const diffMap = { easy: 'Fácil', medium: 'Médio', hard: 'Difícil', forgot: 'Não lembrei' };
                    const diffText = r.difficultyOrigin ? diffMap[r.difficultyOrigin] || r.difficultyOrigin : null;
                    const completedAtText = r.completedAt ? new Date(r.completedAt).toLocaleDateString('pt-BR') : null;
                    const archivedAtText = r.archivedAt ? new Date(r.archivedAt).toLocaleDateString('pt-BR') : null;

                    return `
                    <div class="bg-slate-950 border border-slate-800 p-3 rounded-xl flex justify-between items-center group hover:border-slate-700 transition-colors">
                        <div class="flex-1 min-w-0 pr-3">
                            <div class="flex flex-wrap items-center gap-1.5 mb-1.5">
                                <span class="text-[9px] uppercase font-bold px-1.5 py-0.5 rounded border ${phaseColor}">${phaseLabel}</span>
                                <span class="text-[9px] uppercase font-bold bg-slate-800 text-slate-300 px-1.5 py-0.5 rounded border border-slate-700">${stepLabel}</span>
                                <span class="text-[9px] uppercase font-bold px-1.5 py-0.5 rounded border ${statusColor}">${statusLabel}</span>
                            </div>
                            <div class="font-bold text-sm text-white flex items-center gap-1.5 truncate">
                                <div class="w-2 h-2 rounded-full ${sub.color} shrink-0"></div> <span class="truncate">${sub.name}</span>
                            </div>
                            <div class="text-xs text-slate-400 truncate mt-0.5">${r.topic || 'Revisão Geral'}</div>
                            <div class="flex items-center gap-2 mt-1.5 flex-wrap">
                                <span class="text-[10px] text-slate-500 flex items-center gap-1"><i data-lucide="calendar" class="w-3 h-3"></i>${dueDateObj.toLocaleDateString('pt-BR')}</span>
                                ${diffText ? `<span class="text-[10px] text-slate-500 border-l border-slate-800 pl-2">Última: ${diffText}</span>` : ''}
                                ${(isCompleted || isArchived) && completedAtText ? `<span class="text-[10px] text-emerald-600/80 border-l border-slate-800 pl-2">Feita: ${completedAtText}</span>` : ''}
                                ${isArchived && archivedAtText ? `<span class="text-[10px] text-slate-500 border-l border-slate-800 pl-2">Arq: ${archivedAtText}</span>` : ''}
                            </div>
                        </div>
                        ${!isCompleted && !isArchived ? `
                        <button onclick="window.showReviewPrompt(${r.id})" class="bg-emerald-900/30 hover:bg-emerald-600 text-emerald-500 hover:text-white p-2.5 rounded-lg transition-all shrink-0" title="Concluir Revisão">
                            <i data-lucide="check-circle-2" class="w-5 h-5"></i>
                        </button>
                        ` : ''}
                        ${isCompleted ? `
                        <button onclick="window.archiveReview(${r.id})" class="bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-white p-2.5 rounded-lg transition-all shrink-0" title="Arquivar Revisão">
                            <i data-lucide="archive" class="w-4 h-4"></i>
                        </button>
                        ` : ''}
                        ${isArchived ? `
                        <div class="p-2.5 text-slate-600 shrink-0">
                            <i data-lucide="archive" class="w-4 h-4"></i>
                        </div>
                        ` : ''}
                    </div>`;
                };

                html += `<div class="grid grid-cols-1 md:grid-cols-2 gap-6">`;
                
                // Primeira coluna
                html += `<div><h4 class="text-xs font-bold text-red-400 uppercase tracking-widest mb-3 flex items-center gap-2"><i data-lucide="alert-circle" class="w-4 h-4"></i> Ação Imediata (${dueToday.length})</h4><div class="space-y-3">`;
                if (dueToday.length === 0) html += `<p class="text-xs text-slate-600 italic">Limpo.</p>`;
                dueToday.forEach(r => html += renderReviewCard(r));
                html += `</div></div>`;

                // Segunda coluna
                html += `<div>`;
                
                html += `<h4 class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-3 flex items-center gap-2"><i data-lucide="calendar" class="w-4 h-4"></i> Radar (${upcoming.length})</h4><div class="space-y-3 mb-6">`;
                if (upcoming.length === 0) html += `<p class="text-xs text-slate-600 italic">Vazio.</p>`;
                upcoming.forEach(r => html += renderReviewCard(r));
                html += `</div>`;

                if (completed.length > 0) {
                    html += `<h4 class="text-xs font-bold text-emerald-500 uppercase tracking-widest mb-3 flex items-center gap-2"><i data-lucide="check-circle" class="w-4 h-4"></i> Últimas Concluídas</h4><div class="space-y-3 opacity-70 hover:opacity-100 transition-opacity">`;
                    completed.forEach(r => html += renderReviewCard(r));
                    html += `</div>`;
                }

                if (archived.length > 0) {
                    html += `<h4 class="text-xs font-bold text-slate-500 uppercase tracking-widest mt-6 mb-3 flex items-center gap-2"><i data-lucide="archive" class="w-4 h-4"></i> Revisões Arquivadas</h4><div class="space-y-3 opacity-50 hover:opacity-100 transition-opacity grayscale hover:grayscale-0">`;
                    archived.forEach(r => html += renderReviewCard(r));
                    html += `</div>`;

                html += `</div></div>`;
                return html;
            }
            else if (uiState.studyTab === 'erros') {
                const openErrors = state.studyData.errorLog.filter(e => e.status === 'open');
                const subjectsWithErrors = new Set(openErrors.map(e => String(e.subjectId))).size;

                        <div class="border-t border-slate-800 p-4">
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-3">
                                <select id="error-subject" class="bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-white focus:outline-none"><option value="">Disciplina...</option>${window.renderStudySubjectOptions({ includeEmpty: false })}</select>
                                <input type="text" id="error-topic" placeholder="Tópico (ex: Crase)" class="bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-white focus:outline-none">
                                <input type="text" id="error-source" placeholder="Fonte (ex: QConcursos #123)" class="bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-white focus:outline-none">
                                <select id="error-reason" class="bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-white focus:outline-none"><option value="Não sabia">Não sabia o conteúdo</option><option value="Confundi">Confundi conceito</option><option value="Falta de atenção">Falta de atenção</option><option value="Esqueci">Esqueci detalhe</option></select>
                            </div>
                            <textarea id="error-notes" placeholder="Anotação de correção rápida..." class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-white mb-3 h-20 focus:outline-none"></textarea>
                            <button onclick="window.logError()" class="w-full bg-fuchsia-900/50 hover:bg-fuchsia-800 text-fuchsia-300 font-bold py-2.5 rounded-lg border border-fuchsia-700/50 transition-all text-xs">Registrar erro (+10 XP)</button>
                        </div>
                    </details>

                    <section>
                        <div class="flex items-center justify-between gap-3 mb-3 px-1"><div><h4 class="text-xs font-black text-slate-300 uppercase tracking-widest">Precisa de correção</h4><p class="text-[10px] text-slate-600 mt-0.5">Resolva quando você já tiver entendido/corrigido o ponto.</p></div></div>
                        <div class="space-y-3">`;
                if(openErrors.length === 0) html += `<div class="text-center p-7 text-slate-500 border border-dashed border-slate-800 rounded-xl"><i data-lucide="check-circle-2" class="w-7 h-7 mx-auto mb-2 text-emerald-700"></i><p class="text-sm font-bold text-slate-400">Nenhum erro aberto.</p></div>`;
                openErrors.forEach(e => {
                    const sub = state.studyData.subjects.find(s => String(s.id) === String(e.subjectId)) || {name: 'Deletada', color: 'bg-slate-500'};
                    html += `<div class="bg-slate-950 border border-slate-800 p-4 rounded-xl"><div class="flex items-start justify-between gap-3"><div class="min-w-0"><div class="flex flex-wrap items-center gap-2 mb-2"><span class="inline-flex items-center gap-1 text-[9px] uppercase font-black text-slate-400"><span class="w-2 h-2 rounded-full ${sub.color}"></span>${window.escapeHtml(sub.name)}</span><span class="text-[9px] uppercase font-bold bg-red-950/40 text-red-400 px-1.5 py-0.5 rounded border border-red-900/40">${window.escapeHtml(e.errorReason || '')}</span><span class="text-[9px] text-slate-600">${new Date(e.date).toLocaleDateString('pt-BR')}</span></div><h4 class="font-black text-white text-sm">${window.escapeHtml(e.topic || 'Erro sem tópico')}</h4>${e.questionSource ? `<p class="text-[10px] text-slate-600 mt-1">Fonte: ${window.escapeHtml(e.questionSource)}</p>` : ''}${e.notes ? `<p class="text-xs text-slate-400 mt-2 leading-relaxed">${window.escapeHtml(e.notes)}</p>` : ''}</div><button onclick="window.resolveError(${e.id})" class="shrink-0 bg-emerald-950/30 hover:bg-emerald-900/50 border border-emerald-900/50 text-emerald-400 px-3 py-2 rounded-lg text-[9px] font-black uppercase tracking-widest">Resolvido</button></div><div class="mt-3 pt-3 border-t border-slate-900 flex justify-end"><button onclick="window.deleteError(${e.id})" class="text-[9px] uppercase tracking-widest font-black text-slate-700 hover:text-red-400">Excluir registro</button></div></div>`;
                });
                return html + `</div></section></div>`;
            }
            else if (uiState.studyTab === 'ciclos') {
                const activeCycle = (state.studyData.cycles || []).find(c => c.active);
                let html = `
                <div class="space-y-5">
                    <section class="rounded-2xl border border-slate-800 bg-slate-950/75 p-4 sm:p-5"><div class="flex items-center gap-2"><i data-lucide="refresh-cw" class="w-5 h-5 text-cyan-300"></i><div><h3 class="text-sm font-black text-white uppercase tracking-widest">Ciclos de estudo</h3><p class="text-xs text-slate-500 mt-1">Use um ciclo para definir o conjunto de disciplinas em foco. Apenas um fica ativo por vez.</p></div></div></section>`;

                if (activeCycle) {
                    const activeSubs = activeCycle.subjectIds.map(id => state.studyData.subjects.find(s => String(s.id) === String(id))?.name).filter(Boolean);
                    html += `<section class="rounded-2xl border border-cyan-700/50 bg-cyan-950/15 p-4"><div class="flex items-start justify-between gap-3"><div><span class="text-[9px] uppercase font-black tracking-widest text-cyan-400">Ciclo ativo</span><h4 class="text-base font-black text-white mt-1">${window.escapeHtml(activeCycle.name)}</h4><p class="text-xs text-slate-400 mt-1">Meta: ${activeCycle.weeklyHoursGoal}h por semana</p><p class="text-[10px] text-slate-500 mt-2">${activeSubs.length ? activeSubs.map(window.escapeHtml).join(' • ') : 'Nenhuma disciplina vinculada'}</p></div></div></section>`;
                } else {
                    html += `<div class="rounded-xl border border-dashed border-slate-800 p-5 text-center text-sm text-slate-500">Nenhum ciclo ativo.</div>`;
                }

                html += `<div class="space-y-3">`;
                const inactiveCycles = (state.studyData.cycles || []).filter(c => !c.active);
                if (inactiveCycles.length) {
                    html += `<div class="text-[10px] font-black text-slate-500 uppercase tracking-widest px-1">Outros ciclos</div>`;
                    inactiveCycles.forEach(c => {
                        const subs = c.subjectIds.map(id => state.studyData.subjects.find(s=>String(s.id)===String(id))?.name).filter(Boolean).join(', ');
                        html += `<div class="border border-slate-800 bg-slate-950 p-4 rounded-xl"><div class="flex items-start justify-between gap-3"><div class="min-w-0"><h4 class="font-bold text-white text-sm">${window.escapeHtml(c.name)}</h4><p class="text-xs text-slate-500 mt-1">Meta: ${c.weeklyHoursGoal}h semanais</p><p class="text-[10px] text-slate-600 mt-1 truncate">${window.escapeHtml(subs || 'Sem disciplinas')}</p></div><div class="flex gap-2 shrink-0"><button onclick="window.activateCycle(${c.id})" class="bg-cyan-950/40 border border-cyan-900/50 text-cyan-400 px-3 py-2 rounded-lg text-[9px] font-black uppercase">Ativar</button><button onclick="window.deleteCycle(${c.id})" class="border border-slate-800 text-slate-600 hover:text-red-400 p-2 rounded-lg" title="Excluir ciclo"><i data-lucide="trash-2" class="w-4 h-4"></i></button></div></div></div>`;

                html += `</div>
                    <details ${state.studyData.cycles.length === 0 ? 'open' : ''} class="group rounded-2xl border border-slate-800 bg-slate-950/65 overflow-hidden"><summary class="cursor-pointer list-none flex items-center justify-between gap-3 p-4 hover:bg-slate-900/60"><div class="flex items-center gap-2"><i data-lucide="plus" class="w-4 h-4 text-cyan-300"></i><div><div class="text-xs font-black text-slate-200 uppercase tracking-widest">Criar novo ciclo</div><div class="text-[10px] text-slate-600 mt-0.5">A criação fica recolhida quando já existe um ciclo.</div></div></div><i data-lucide="chevron-down" class="w-4 h-4 text-slate-500 group-open:rotate-180 transition-transform"></i></summary><div class="border-t border-slate-800 p-4"><div class="space-y-3"><input type="text" id="cycle-name" placeholder="Nome do ciclo" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-white"><select id="cycle-subs" multiple class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-white h-24">${window.renderStudySubjectOptions({ includeEmpty: false })}</select><input type="number" id="cycle-hours" placeholder="Meta semanal (horas)" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-white"><button onclick="window.createStudyCycle()" class="w-full bg-cyan-900/50 hover:bg-cyan-800 text-cyan-300 font-bold py-2.5 rounded-lg border border-cyan-700/50 text-xs">Ativar novo ciclo</button></div></div></details>
                </div>`;
                return html;

            return '';
