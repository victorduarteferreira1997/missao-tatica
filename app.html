            const recharge = kind === 'recharge';
            const title = recharge ? 'Recarga' : 'Rituais';
            const closeHandler = recharge ? 'toggleRechargeModal' : 'toggleRitualModal';
            return `<div class="fixed inset-0 bg-slate-950/90 flex items-center justify-center p-4 z-[60] backdrop-blur-sm font-sans"><section id="${kind}-module-dialog" role="dialog" aria-modal="true" aria-labelledby="${kind}-module-title" class="modal-enter w-full max-w-4xl max-h-[92vh] rounded-2xl border border-slate-700 bg-slate-900 shadow-2xl flex flex-col overflow-hidden"><header class="flex shrink-0 items-start justify-between gap-4 border-b border-slate-800 px-6 py-5"><div><h2 id="${kind}-module-title" class="text-xl font-semibold text-white">${title}</h2><p class="text-sm text-slate-400 mt-1">${recharge ? 'Faça uma pausa. Registre quando terminar.' : 'Pequenos passos para começar e encerrar o dia.'}</p></div><button id="${kind}-module-close" type="button" onclick="window.${closeHandler}()" aria-label="Fechar ${title}" class="h-9 w-9 shrink-0 inline-flex items-center justify-center rounded-lg text-slate-400 hover:text-white hover:bg-slate-800"><i data-lucide="x" class="w-5 h-5"></i></button></header><div id="${kind}-module-body" class="min-h-0 overflow-y-auto overscroll-contain p-6">${recharge ? window.renderRechargeModule() : window.renderRitualsSection()}</div></section></div>`;
        };
        window.captureRecoveryDialogs = function(root) {
            const snapshots = {};
            uiState.recoveryDrafts ||= {};
            for (const kind of ['ritual', 'recharge']) {
                const dialog = root.querySelector(`#${kind}-module-dialog`);
                if (!dialog) continue;
                snapshots[kind] = { scrollTop: dialog.querySelector(`#${kind}-module-body`)?.scrollTop || 0,
                    focusId: dialog.contains(document.activeElement) ? document.activeElement.id : '' };
                if (!uiState.recoveryDraftReset?.[kind]) {
                    uiState.recoveryDrafts[kind] = [...dialog.querySelectorAll('input[id], select[id]')].map(el => ({ id: el.id, value: el.value }));
                }
            }
            return snapshots;
        };
        window.bindRecoveryDialogs = function(root, snapshots = {}) {
            for (const kind of ['ritual', 'recharge']) {
                const dialog = root.querySelector(`#${kind}-module-dialog`);
                if (!dialog) continue;
                if (uiState.recoveryDraftReset?.[kind]) delete uiState.recoveryDraftReset[kind];
                else (uiState.recoveryDrafts?.[kind] || []).forEach(field => {
                    const input = document.getElementById(field.id);
                    if (input && dialog.contains(input)) input.value = field.value;
                });
                const body = dialog.querySelector(`#${kind}-module-body`);
                if (body && snapshots[kind]) body.scrollTop = snapshots[kind].scrollTop;
                window.bindFormDialog(root, { id: `${kind}-module-dialog`, initialFocus: snapshots[kind]?.focusId || `${kind}-module-close`,
                    close: kind === 'ritual' ? window.toggleRitualModal : window.toggleRechargeModal,
                    blocked: uiState.confirm.show || uiState.alert.show || Boolean(uiState.dataManager) });
            }
        };

        // ==========================================
        // MÓDULO: RECARGA EXECUTIVA
        // ==========================================
        window.getRechargeActions = function() {
            if (!state.rechargeData) state.rechargeData = { actions: [], logs: [] };
            if (!Array.isArray(state.rechargeData.actions)) state.rechargeData.actions = [];
            return state.rechargeData.actions
                .filter(action => action.active !== false)
                .sort((a, b) => (a.isDefault === b.isDefault ? String(a.title).localeCompare(String(b.title)) : (a.isDefault ? -1 : 1)));
        };

        window.useRechargeAction = function(actionId) {
            const action = state.rechargeData?.actions?.find(a => String(a.id) === String(actionId) && a.active !== false);
            if (!action) { window.showAlertModal('Recarga não encontrada.'); return; }

            const energyGain = Math.max(0, Math.min(100, parseInt(action.energyGain, 10) || 0));
            const xpGain = Math.max(0, Math.min(100, parseInt(action.xp, 10) || 0));
            const duration = Math.max(1, Math.min(240, parseInt(action.duration, 10) || 5));
            const beforeEnergy = state.energy;

            if (energyGain > 0 && beforeEnergy >= 100) {
                window.showAlertModal('Sua Bateria Executiva já está em 100%. Use a recarga quando houver desgaste real.');
                return;
            }

            window.changeEnergy(energyGain);
            const afterEnergy = state.energy;
            if (xpGain > 0) {
                state.xp += xpGain;
                window.checkLevelUp();
            }

            state.rechargeData.logs.push({
                id: Date.now(),
                actionId: action.id,
                title: action.title,
                type: action.type || 'custom',
                duration,
                energyGainPlanned: energyGain,
                energyGainApplied: Math.max(0, afterEnergy - beforeEnergy),
                xpAwarded: xpGain, xpCampaign: window.normalizePrestige().campaign,
                beforeEnergy,
                afterEnergy,
                date: new Date().toISOString()
            });

            window.saveState();
            window.showToast('Bateria recarregada', `+${Math.max(0, afterEnergy - beforeEnergy)} HP registrado.`, action.icon || 'battery-charging', 'text-emerald-400');
        };

        window.addRechargeAction = function() {
            const title = document.getElementById('recharge-title')?.value.trim();
            const description = document.getElementById('recharge-desc')?.value.trim() || 'Recarga personalizada para recuperar bateria executiva.';
            const icon = document.getElementById('recharge-icon')?.value || 'battery-charging';
            let energyGain = parseInt(document.getElementById('recharge-energy')?.value, 10);
            let duration = parseInt(document.getElementById('recharge-duration')?.value, 10);
            let xp = parseInt(document.getElementById('recharge-xp')?.value, 10);

            if (!title) { window.showAlertModal('Nome da recarga é obrigatório.'); return; }
            if (isNaN(energyGain)) energyGain = 10;
            if (isNaN(duration)) duration = 5;
            if (isNaN(xp)) xp = 0;

            energyGain = Math.max(1, Math.min(100, energyGain));
            duration = Math.max(1, Math.min(240, duration));
            xp = Math.max(0, Math.min(100, xp));

            state.rechargeData.actions.push({
                id: `custom-recharge-${Date.now()}`,
                title,
                description,
                icon,
                energyGain,
                duration,
                xp,
                type: 'custom',
                active: true,
                isDefault: false,
                createdAt: new Date().toISOString()
            });

            window.clearRecoveryDraft('recharge');
            window.setRecoverySection('recharge-create', false);
            window.saveState();
            window.showToast('Recarga criada', 'Nova opção adicionada ao Arsenal de Energia.', 'battery-charging', 'text-emerald-400');
        };

        window.deleteRechargeAction = function(actionId) {
            const action = state.rechargeData?.actions?.find(a => String(a.id) === String(actionId));
            if (!action) { window.showAlertModal('Recarga não encontrada.'); return; }
            const message = action.isDefault
                ? `Arquivar "${action.title}"? Ela sairá das opções. Você pode restaurá-la em Gerenciar ações. O histórico será preservado.`
                : `Arquivar a recarga personalizada "${action.title}"? O histórico será preservado e você pode restaurá-la em Gerenciar ações.`;
            window.showConfirmModal(message, () => {
                const current = state.rechargeData?.actions?.find(a => String(a.id) === String(actionId));
                if (!current) return;
                current.active = false;
                window.saveState();
                window.showToast('Recarga arquivada', 'O histórico foi preservado.', 'archive', 'text-slate-300');
            });
        };

        window.restoreRechargeAction = function(actionId) {
            const action = state.rechargeData?.actions?.find(a => String(a.id) === String(actionId));
            if (!action || action.active !== false) return;
            action.active = true; window.saveState();
            window.showToast('Recarga restaurada', 'A ação voltou para suas opções.', 'rotate-ccw', 'text-emerald-300');
        };
        window.renderRechargeModule = function() {
            const actions = window.getVisibleRechargeActions();
            const filter = uiState.rechargeDurationFilter || 'short';
            const energy = Math.max(0, Math.min(100, Number(state.energy) || 0));
            const todayLogs = (state.rechargeData?.logs || []).filter(log => window.getRecoveryLogDateKey(log) === window.getLocalDateKey());
            const totalHpToday = todayLogs.reduce((sum, log) => sum + (Number(log.energyGainApplied) || 0), 0);
            const open = key => uiState.recoverySections?.[key] ? 'open' : '';
            const all = (state.rechargeData?.actions || []).slice().sort((a,b) => Number(a.active === false) - Number(b.active === false) || String(a.title).localeCompare(String(b.title), 'pt-BR'));
            const field = 'w-full mt-1.5 rounded-lg border border-slate-700 bg-slate-950 px-3 py-2.5 text-sm text-white outline-none focus:border-emerald-400';
            const summary = 'flex items-center justify-between gap-3 cursor-pointer text-sm font-medium text-slate-300';
            return `<div class="space-y-5"><section class="rounded-xl border border-emerald-900/40 bg-emerald-950/15 p-5"><div class="flex items-center justify-between gap-5"><div><p class="text-sm text-slate-300">Bateria executiva</p><p class="text-xs text-slate-400 mt-1">${energy >= 100 ? 'Bateria completa. Você pode descansar mesmo sem registrar HP.' : 'Escolha uma pausa que cabe no seu tempo.'}</p></div><p class="text-3xl font-semibold tabular-nums ${energy < 20 ? 'text-amber-300' : 'text-emerald-300'}">${energy}<span class="text-base text-slate-500">%</span></p></div><div role="progressbar" aria-label="Bateria executiva" aria-valuenow="${energy}" aria-valuemin="0" aria-valuemax="100" class="h-2 rounded-full bg-slate-800 mt-4 overflow-hidden"><div class="h-full rounded-full ${energy < 20 ? 'bg-amber-400' : 'bg-emerald-500'}" style="width:${energy}%"></div></div></section><section><div class="flex flex-wrap justify-between items-center gap-3 mb-4"><h3 class="text-sm font-semibold text-slate-200">Quanto tempo você tem?</h3><div class="flex gap-1 rounded-lg bg-slate-950 border border-slate-800 p-1">${[{id:'short', name:'Até 5 min'}, {id:'medium', name:'Até 15 min'}, {id:'all', name:'Todas'}].map(option => `<button id="recharge-filter-${option.id}" type="button" onclick="window.setRechargeDurationFilter('${option.id}')" aria-pressed="${filter === option.id}" class="rounded-md px-3 py-2 text-xs ${filter === option.id ? 'bg-slate-700 text-white' : 'text-slate-400 hover:text-white'}">${option.name}</button>`).join('')}</div></div><div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">${actions.map(action => {
                const hp = Math.max(0, Math.min(100, Number(action.energyGain) || 0));
                const applicable = Math.min(hp, 100 - energy);
                const full = energy >= 100 && hp > 0;
                return `<article class="rounded-xl border border-slate-800 bg-slate-950/40 p-4 flex flex-col"><div class="flex items-start gap-2.5"><i data-lucide="${window.getRecoveryIcon(action.icon, 'battery-charging')}" class="w-5 h-5 mt-0.5 shrink-0 text-emerald-400"></i><h4 class="text-sm font-semibold leading-snug text-slate-100 break-words">${window.escapeHtml(action.title)}</h4></div><p class="text-xs leading-relaxed text-slate-400 mt-3 flex-1 break-words">${window.escapeHtml(action.description || '')}</p><div class="flex flex-wrap gap-x-3 gap-y-1 items-center mt-4"><span class="text-xs text-slate-300">${Number(action.duration) || 5} min</span>${window.renderRecoveryEffects(Math.max(0, Math.min(100, Number(action.xp) || 0)), applicable)}${full ? '<span class="text-xs text-slate-500">Bateria completa</span>' : ''}</div><button type="button" onclick="window.useRechargeAction(${window.recoveryHandlerArgument(action.id)})" ${full ? 'disabled' : ''} class="mt-4 w-full rounded-lg border border-emerald-800/60 bg-emerald-900/35 px-3 py-2.5 text-sm font-medium text-emerald-200 hover:bg-emerald-900/60 disabled:opacity-40 disabled:cursor-not-allowed">Registrar recarga</button></article>`;
            }).join('') || `<div class="sm:col-span-2 lg:col-span-3 rounded-xl border border-dashed border-slate-700 px-5 py-6 text-center"><p class="text-sm text-slate-400">Nenhuma ação ativa neste tempo.</p><button type="button" onclick="window.setRechargeDurationFilter('all')" class="mt-3 text-sm text-emerald-300">Ver todas as opções</button></div>`}</div><p class="text-xs text-slate-500 mt-3">Registrar confirma a pausa realizada; não inicia um cronômetro. Recargas padrão não gastam moedas.</p></section><div class="space-y-3 border-t border-slate-800 pt-5"><details id="recharge-create-section" ${open('recharge-create')} ontoggle="window.setRecoverySection('recharge-create', this.open)" class="rounded-xl border border-slate-800 p-4"><summary class="${summary}"><span>Criar uma recarga</span><i data-lucide="plus" class="w-4 h-4 text-slate-500"></i></summary><form novalidate onsubmit="event.preventDefault(); window.addRechargeAction()" class="space-y-4 mt-4"><label class="block text-sm text-slate-300">Nome<input id="recharge-title" maxlength="100" placeholder="Ex.: Leitura leve sem tela" class="${field}"></label><label class="block text-sm text-slate-300">Quando usar <span class="text-xs text-slate-500">(opcional)</span><input id="recharge-desc" maxlength="300" placeholder="Uma descrição curta" class="${field}"></label><div class="grid grid-cols-2 gap-3"><label class="block text-sm text-slate-300">Duração em minutos<input id="recharge-duration" type="number" value="5" min="1" max="240" class="${field}"></label><label class="block text-sm text-slate-300">HP recuperado<input id="recharge-energy" type="number" value="10" min="1" max="100" class="${field}"></label></div><details ${open('recharge-settings')} ontoggle="window.setRecoverySection('recharge-settings', this.open)" class="border-t border-slate-800 pt-3"><summary class="text-xs text-slate-400 cursor-pointer">Ajustes opcionais</summary><div class="grid grid-cols-2 gap-3 mt-3"><label class="block text-sm text-slate-300">XP<input id="recharge-xp" type="number" value="0" min="0" max="100" class="${field}"></label><label class="block text-sm text-slate-300">Ícone<select id="recharge-icon" class="${field}">${[{id:'battery-charging',label:'Bateria'}, {id:'coffee',label:'Café'}, {id:'utensils',label:'Refeição'}, {id:'bed',label:'Descanso'}, {id:'gamepad-2',label:'Jogo'}, {id:'wind',label:'Respiração'}, {id:'footprints',label:'Caminhada'}, {id:'sparkles',label:'Espiritual'}].map(i => `<option value="${i.id}">${i.label}</option>`).join('')}</select></label></div><p class="text-xs text-slate-500 mt-2">O padrão é 0 XP. Descansar não depende de pontuação.</p></details><div class="flex justify-end"><button type="submit" class="rounded-lg bg-emerald-700 hover:bg-emerald-600 text-white px-4 py-2.5 text-sm font-medium">Salvar recarga</button></div></form></details><details ${open('recharge-history')} ontoggle="window.setRecoverySection('recharge-history', this.open)" class="rounded-xl border border-slate-800 p-4"><summary class="${summary}"><span>Histórico de recargas</span><span class="text-xs text-slate-500">Hoje: ${todayLogs.length} · +${totalHpToday} HP</span></summary><div class="mt-4">${window.renderRecoveryHistory('recharge')}</div></details><details ${open('recharge-manage')} ontoggle="window.setRecoverySection('recharge-manage', this.open)" class="rounded-xl border border-slate-800 p-4"><summary class="${summary}"><span>Gerenciar ações</span><i data-lucide="settings-2" class="w-4 h-4 text-slate-500"></i></summary><p class="text-xs text-slate-500 mt-3">Arquivar retira a ação das opções e preserva o histórico.</p><div class="mt-3 divide-y divide-slate-800">${all.map(action => `<div class="flex items-center justify-between gap-4 py-3"><div class="min-w-0"><p class="text-sm text-slate-300 break-words">${window.escapeHtml(action.title)}</p><p class="text-xs text-slate-500 mt-1">${action.active === false ? 'Arquivada' : 'Ativa'} · ${action.isDefault ? 'Padrão' : 'Personalizada'}</p></div><button type="button" onclick="window.${action.active === false ? 'restoreRechargeAction' : 'deleteRechargeAction'}(${window.recoveryHandlerArgument(action.id)})" class="shrink-0 rounded-lg border border-slate-700 px-3 py-2 text-xs text-slate-400 hover:text-white">${action.active === false ? 'Restaurar' : 'Arquivar'}</button></div>`).join('') || '<p class="text-sm text-slate-500 py-3">Nenhuma ação cadastrada.</p>'}</div></details></div></div>`;
        };

        // ==========================================
        // MÓDULO: RITUAIS OPERACIONAIS
        // ==========================================
        window.addRitual = function() {
            const title = document.getElementById('ritual-title')?.value.trim();
            const period = document.getElementById('ritual-period')?.value || 'morning';
            let xp = parseInt(document.getElementById('ritual-xp')?.value, 10);
            let energyDelta = parseInt(document.getElementById('ritual-energy')?.value, 10);

            if (!title) { window.showAlertModal('Nome do ritual é obrigatório.'); return; }
            if (!['morning', 'night'].includes(period)) { window.showAlertModal('Período inválido.'); return; }
            if (isNaN(xp)) xp = 10;
            if (isNaN(energyDelta)) energyDelta = 0;
            xp = Math.max(0, Math.min(100, xp));
            energyDelta = Math.max(-100, Math.min(100, energyDelta));

            state.routineData.rituals.push({
                id: Date.now(),
                title,
                period,
                xp,
                energyDelta,
                active: true,
                createdAt: new Date().toISOString()
            });

            window.clearRecoveryDraft('ritual');
            window.setRecoverySection('ritual-create', false);
            if (typeof window.checkGameTriggers === "function") window.checkGameTriggers();
            window.saveState();
            window.showToast('Ritual criado', 'Protocolo operacional adicionado.', 'clipboard-check', 'text-emerald-400');
        };

        window.completeRitual = function(ritualId) {
            const ritual = state.routineData.rituals.find(r => String(r.id) === String(ritualId) && r.active !== false);
            if (!ritual) { window.showAlertModal('Ritual não encontrado.'); return; }

            const todayKey = window.getLocalDateKey();
            const alreadyDone = state.routineData.logs.some(log => 
                String(log.ritualId) === String(ritualId) && window.getRecoveryLogDateKey(log) === todayKey
            );

            if (alreadyDone) {
                window.showAlertModal('Este ritual já foi concluído hoje.');
                return;
            }

            const xpAwarded = Number.isFinite(Number(ritual.xp)) ? Number(ritual.xp) : 10;
            const energyDeltaPlanned = Number.isFinite(Number(ritual.energyDelta)) ? Number(ritual.energyDelta) : 0;
            const beforeEnergy = state.energy;
            window.changeEnergy(energyDeltaPlanned);

            state.routineData.logs.push({
                id: Date.now(),
                ritualId: ritual.id, title: ritual.title, period: ritual.period,
                date: new Date().toISOString(),
                completedAt: new Date().toISOString(),
                xpAwarded, xpCampaign: window.normalizePrestige().campaign,
                energyDeltaPlanned, energyDeltaApplied: state.energy - beforeEnergy,
                beforeEnergy, afterEnergy: state.energy
            });

            state.xp += xpAwarded;
            window.checkLevelUp();
            if (typeof window.checkGameTriggers === "function") window.checkGameTriggers();
            window.saveState();
            window.showToast('Ritual concluído', `+${xpAwarded} XP. Consistência operacional registrada.`, 'check-circle', 'text-emerald-400');
        };

        window.deleteRitual = function(ritualId) {
            window.showConfirmModal('Deseja arquivar este ritual? O histórico será preservado.', () => {
                const ritual = state.routineData.rituals.find(r => String(r.id) === String(ritualId));
                if (!ritual) { window.showAlertModal('Ritual não encontrado.'); return; }
                ritual.active = false;
                window.saveState();
                window.showToast('Ritual arquivado', 'Histórico preservado.', 'archive', 'text-slate-300');
            });
        };

        window.fillRitualSuggestion = function(title, period, xp, energyDelta) {
            const titleInput = document.getElementById('ritual-title');
            const periodInput = document.getElementById('ritual-period');
            const xpInput = document.getElementById('ritual-xp');
            const energyInput = document.getElementById('ritual-energy');

            if (titleInput) titleInput.value = title;
            if (periodInput) periodInput.value = period;
            if (xpInput) xpInput.value = xp;
            if (energyInput) energyInput.value = energyDelta;
        };

        window.isRitualCompletedToday = function(ritualId) {
            const todayKey = window.getLocalDateKey();
            return state.routineData.logs.some(log => 
                String(log.ritualId) === String(ritualId) && window.getRecoveryLogDateKey(log) === todayKey
            );
        };

        const RITUAL_SUGGESTIONS = [
            { title: 'Beber água', period: 'morning', xp: 10, hp: 5 },
            { title: 'Planejar 3 prioridades', period: 'morning', xp: 15, hp: 0 },
            { title: 'Alongamento leve', period: 'morning', xp: 10, hp: 5 },
            { title: 'Separar roupa do dia seguinte', period: 'night', xp: 10, hp: 0 },
            { title: 'Desligar telas', period: 'night', xp: 15, hp: 5 },
            { title: 'Medicação prescrita', period: 'night', xp: 10, hp: 0 }
        ];
        window.chooseRitualSuggestion = function(index) {
            const suggestion = RITUAL_SUGGESTIONS[index];
            if (!suggestion) return;
            window.openRecoverySection('ritual-create', 'ritual-title');
            window.fillRitualSuggestion(suggestion.title, suggestion.period, suggestion.xp, suggestion.hp);
        };
        window.restoreRitual = function(ritualId) {
            const ritual = state.routineData?.rituals?.find(r => String(r.id) === String(ritualId));
            if (!ritual || ritual.active !== false) return;
            ritual.active = true; window.saveState();
            window.showToast('Ritual restaurado', 'O ritual voltou para sua rotina.', 'rotate-ccw', 'text-emerald-300');
        };
        window.renderRitualsSection = function() {
            const all = state.routineData?.rituals || [];
            const rituals = all.filter(r => r.active !== false);
            const done = rituals.filter(r => window.isRitualCompletedToday(r.id)).length;
            const open = key => uiState.recoverySections?.[key] ? 'open' : '';
            const field = 'w-full mt-1.5 rounded-lg border border-slate-700 bg-slate-950 px-3 py-2.5 text-sm text-white outline-none focus:border-emerald-400';
            const summary = 'flex justify-between items-center gap-3 cursor-pointer text-sm font-medium text-slate-300';
            const renderPeriod = (period, title, icon, color) => {
                const rows = rituals.filter(r => r.period === period);
                const completed = rows.filter(r => window.isRitualCompletedToday(r.id)).length;
                return `<section class="rounded-xl border border-slate-800 bg-slate-950/30 p-4"><div class="flex justify-between items-center gap-3 mb-2"><h3 class="text-sm font-semibold ${color} flex items-center gap-2"><i data-lucide="${icon}" class="w-4 h-4"></i>${title}</h3><span class="text-xs text-slate-500">${completed}/${rows.length}</span></div><div class="divide-y divide-slate-800">${rows.map(r => {
                    const doneToday = window.isRitualCompletedToday(r.id);
                    const xp = Number.isFinite(Number(r.xp)) ? Number(r.xp) : 10;
                    return `<div class="flex items-start justify-between gap-3 py-3"><div class="min-w-0"><p class="text-sm ${doneToday ? 'text-slate-500' : 'text-slate-200'} break-words">${window.escapeHtml(r.title)}</p><div class="flex flex-wrap gap-3 mt-1.5">${window.renderRecoveryEffects(xp, r.energyDelta)}</div></div><button type="button" onclick="window.completeRitual(${window.recoveryHandlerArgument(r.id)})" ${doneToday ? 'disabled' : ''} class="shrink-0 rounded-lg px-3 py-2 text-xs font-medium ${doneToday ? 'text-emerald-400/70 border border-transparent' : 'border border-emerald-800/60 bg-emerald-900/35 text-emerald-200 hover:bg-emerald-900/60'}">${doneToday ? 'Feito hoje' : 'Concluir'}</button></div>`;
                }).join('') || `<p class="text-xs text-slate-500 py-3">Nenhum ritual ${period === 'morning' ? 'matinal' : 'noturno'} ativo.</p>`}</div></section>`;
            };
            return `<div class="space-y-5"><section class="flex flex-wrap items-center justify-between gap-4 rounded-xl border border-emerald-900/40 bg-emerald-950/15 p-5"><div><p class="text-sm font-medium text-slate-200">${rituals.length ? done === rituals.length ? 'Seus rituais de hoje estão concluídos' : 'Sua rotina de hoje' : 'Monte uma rotina que cabe no seu dia'}</p><p class="text-xs text-slate-400 mt-1">${rituals.length ? `${done} de ${rituals.length} concluídos · cada ritual pode ser registrado uma vez por dia.` : 'Comece com um ou dois passos simples. Você pode ajustar depois.'}</p></div><button type="button" onclick="window.openRecoverySection('ritual-create', 'ritual-title')" class="rounded-lg border border-slate-700 text-sm text-slate-300 hover:text-white hover:bg-slate-800 px-3 py-2">${rituals.length ? 'Novo ritual' : 'Criar primeiro ritual'}</button></section>${rituals.length ? `<div class="grid grid-cols-1 lg:grid-cols-2 gap-4">${renderPeriod('morning', 'Manhã', 'sunrise', 'text-amber-200')}${renderPeriod('night', 'Noite', 'moon', 'text-indigo-200')}</div>` : ''}<div class="space-y-3 ${rituals.length ? 'border-t border-slate-800 pt-5' : ''}"><details id="ritual-create-section" ${open('ritual-create')} ontoggle="window.setRecoverySection('ritual-create', this.open)" class="rounded-xl border border-slate-800 p-4"><summary class="${summary}"><span>Criar um ritual</span><i data-lucide="plus" class="w-4 h-4 text-slate-500"></i></summary><form novalidate onsubmit="event.preventDefault(); window.addRitual()" class="space-y-4 mt-4"><label class="block text-sm text-slate-300">Nome do ritual<input id="ritual-title" maxlength="100" placeholder="Ex.: Separar a roupa de amanhã" class="${field}"></label><label class="block text-sm text-slate-300">Período<select id="ritual-period" class="${field}"><option value="morning">Manhã</option><option value="night">Noite</option></select></label><details class="border-t border-slate-800 pt-3"><summary class="text-xs text-slate-400 cursor-pointer">Usar uma sugestão</summary><div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mt-3">${['morning','night'].map(period => `<div><p class="text-xs text-slate-500 mb-2">${period === 'morning' ? 'Manhã' : 'Noite'}</p><div class="flex flex-wrap gap-2">${RITUAL_SUGGESTIONS.map((suggestion,index) => suggestion.period === period ? `<button type="button" onclick="window.chooseRitualSuggestion(${index})" class="rounded-lg border border-slate-700 px-3 py-2 text-xs text-slate-300 hover:bg-slate-800">${suggestion.title}</button>` : '').join('')}</div></div>`).join('')}</div></details><details ${open('ritual-settings')} ontoggle="window.setRecoverySection('ritual-settings', this.open)" class="border-t border-slate-800 pt-3"><summary class="text-xs text-slate-400 cursor-pointer">Ajustar XP e energia</summary><div class="grid grid-cols-2 gap-3 mt-3"><label class="block text-sm text-slate-300">XP por conclusão<input id="ritual-xp" type="number" value="10" min="0" max="100" class="${field}"></label><label class="block text-sm text-slate-300">Variação de HP<input id="ritual-energy" type="number" value="0" min="-100" max="100" class="${field}"></label></div><p class="text-xs text-slate-500 mt-2">HP positivo recupera energia; negativo consome. Use 0 para manter a bateria como está.</p></details><div class="flex justify-end"><button type="submit" class="rounded-lg bg-emerald-700 hover:bg-emerald-600 text-white px-4 py-2.5 text-sm font-medium">Salvar ritual</button></div></form></details><details ${open('ritual-history')} ontoggle="window.setRecoverySection('ritual-history', this.open)" class="rounded-xl border border-slate-800 p-4"><summary class="${summary}"><span>Histórico de rituais</span><i data-lucide="history" class="w-4 h-4 text-slate-500"></i></summary><div class="mt-4">${window.renderRecoveryHistory('ritual')}</div></details><details ${open('ritual-manage')} ontoggle="window.setRecoverySection('ritual-manage', this.open)" class="rounded-xl border border-slate-800 p-4"><summary class="${summary}"><span>Gerenciar rituais</span><i data-lucide="settings-2" class="w-4 h-4 text-slate-500"></i></summary><p class="text-xs text-slate-500 mt-3">Arquivar retira o ritual da rotina e mantém suas conclusões.</p><div class="mt-3 divide-y divide-slate-800">${all.slice().sort((a,b) => Number(a.active === false) - Number(b.active === false)).map(r => `<div class="flex items-center justify-between gap-4 py-3"><div class="min-w-0"><p class="text-sm text-slate-300 break-words">${window.escapeHtml(r.title)}</p><p class="text-xs text-slate-500 mt-1">${r.active === false ? 'Arquivado' : 'Ativo'} · ${r.period === 'morning' ? 'Manhã' : 'Noite'}</p></div><button type="button" onclick="window.${r.active === false ? 'restoreRitual' : 'deleteRitual'}(${window.recoveryHandlerArgument(r.id)})" class="shrink-0 rounded-lg border border-slate-700 px-3 py-2 text-xs text-slate-400 hover:text-white">${r.active === false ? 'Restaurar' : 'Arquivar'}</button></div>`).join('') || '<p class="text-sm text-slate-500 py-3">Nenhum ritual cadastrado.</p>'}</div></details></div></div>`;
        };

        // ==========================================
        // MÓDULO: TEMPO OPERACIONAL (RELÓGIO)
        // ==========================================
        let clockInterval;
        function startClock() {
            if(clockInterval) clearInterval(clockInterval);
            clockInterval = setInterval(() => {
                const el = document.getElementById('time-operational-widget');
                if(el) {
                    const now = new Date();
                    const time = now.toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'});
                    const date = now.toLocaleDateString('pt-BR', {weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'});
                    const hour = now.getHours();
                    let greeting = "Boa noite";
                    if(hour >= 0 && hour < 5) greeting = "Boa madrugada";
                    else if(hour >= 5 && hour < 12) greeting = "Bom dia";
                    else if(hour >= 12 && hour < 18) greeting = "Boa tarde";
                    
                    el.innerHTML = `
                        <div class="flex items-center gap-3">
                            <div>
                                <div class="text-xl font-semibold text-white leading-none tabular-nums">${time}</div>
                                <div class="text-xs text-slate-400 mt-1">${date}</div>
                            </div>
                        </div>
                        <div class="text-xs text-slate-300 mt-2">
                            ${greeting}, ${window.escapeHtml(window.getUserDisplayName())}.
                        </div>
                    `;
                    // Refresh icon only if needed, but since it's static we can skip re-creating lucide inside setInterval usually.
                }
            }, 1000);
        }

        // ==========================================
        // MÓDULO 1: CENTRO DE INTELIGÊNCIA (ESTUDOS)
        // ==========================================
        window.toggleStudyModal = function() { uiState.showStudyModal = !uiState.showStudyModal; render(); };
        window.getStudyAreaForTab = function(tab) {
            if (['planning', 'ciclos'].includes(tab)) return 'planning';
            if (['subjects', 'erros'].includes(tab)) return 'content';
            if (['dashboard', 'reviews'].includes(tab)) return 'progress';
            return 'today';
        };
        window.setStudyArea = function(area) {
            const defaults = { today: 'plano', planning: 'planning', content: 'subjects', progress: 'dashboard' };
            uiState.studyTab = defaults[area] || 'plano';
            render();
        };
        window.setStudyTab = function(tab) { if (!['plano','log','planning','ciclos','subjects','erros','dashboard','reviews'].includes(tab)) return; uiState.studyTab = tab; render(); };

        function renderStudyNavigation() {
            const currentArea = window.getStudyAreaForTab(uiState.studyTab);
            const areas = [
                { id: 'today', icon: 'crosshair', label: 'Hoje', desc: 'Executar' },
                { id: 'planning', icon: 'calendar-days', label: 'Planejar', desc: 'Organizar a semana' },
                { id: 'content', icon: 'library', label: 'Conteúdo', desc: 'Disciplinas e erros' },
                { id: 'progress', icon: 'line-chart', label: 'Progresso', desc: 'Analisar e revisar' }
            ];
            const secondary = {
                today: [
                    { id: 'plano', icon: 'calendar-check', label: 'Plano do dia' },
                    { id: 'log', icon: 'clipboard-pen', label: 'Registrar estudo' }
                ],
                planning: [
                    { id: 'planning', icon: 'calendar-range', label: 'Semana' },
                    { id: 'ciclos', icon: 'refresh-cw', label: 'Ciclos' }
                ],
                content: [
                    { id: 'subjects', icon: 'book-marked', label: 'Disciplinas' },
                    { id: 'erros', icon: 'microscope', label: 'Caderno de erros' }
                ],
                progress: [
                    { id: 'dashboard', icon: 'chart-no-axes-combined', label: 'Desempenho' },
                    { id: 'reviews', icon: 'rotate-cw', label: 'Revisões' }
                ]
            };
            const dueReviews = (state.studyData?.reviews || []).filter(r => {
                if (r.status !== 'pending') return false;
                const due = new Date(r.dueDate);
                const today = new Date();
                due.setHours(0,0,0,0); today.setHours(0,0,0,0);
                return due <= today;
            }).length;
            const openErrors = (state.studyData?.errorLog || []).filter(e => e.status === 'open').length;

            return `
                <div class="grid grid-cols-4 gap-1 mt-4">
                    ${areas.map(area => `
                        <button type="button" aria-pressed="${currentArea === area.id}" onclick="window.setStudyArea('${area.id}')" class="text-left rounded-lg border px-2 sm:px-3 py-2 transition-all ${currentArea === area.id ? 'bg-cyan-950/45 border-cyan-700/60 text-white' : 'bg-slate-950/70 border-slate-800 text-slate-400 hover:border-slate-700 hover:text-slate-200'}">
                            <div class="flex items-center justify-between gap-2">
                                <div class="flex items-center gap-2 min-w-0"><i data-lucide="${area.icon}" class="hidden sm:block w-4 h-4 shrink-0 ${currentArea === area.id ? 'text-cyan-300' : 'text-slate-500'}"></i><span class="text-xs sm:text-sm font-medium truncate">${area.label}</span></div>
                                ${area.id === 'progress' && dueReviews ? `<span class="hidden sm:inline shrink-0 rounded-full bg-red-950 text-red-300 border border-red-900/60 px-1.5 py-0.5 text-[9px] font-black">${dueReviews}</span>` : ''}
                            </div>
                            <div class="hidden sm:block text-xs mt-1 ${currentArea === area.id ? 'text-cyan-500' : 'text-slate-600'}">${area.desc}</div>
                        </button>
                    `).join('')}
                </div>
                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 bg-slate-950 border border-slate-800 rounded-lg p-1.5 mt-2">
                    <div class="flex flex-wrap gap-2">
                        ${(secondary[currentArea] || []).map(tab => `
                            <button type="button" aria-pressed="${uiState.studyTab === tab.id}" onclick="window.setStudyTab('${tab.id}')" class="inline-flex items-center gap-1.5 rounded-lg px-3 py-2 text-xs font-medium transition-colors ${uiState.studyTab === tab.id ? 'bg-cyan-900/60 text-cyan-100 border border-cyan-700/60' : 'text-slate-400 border border-transparent hover:bg-slate-900 hover:text-slate-200'}">
                                <i data-lucide="${tab.icon}" class="w-3.5 h-3.5"></i>${tab.label}${tab.id === 'reviews' && dueReviews ? `<span class="ml-1 rounded-full bg-red-950 text-red-300 border border-red-900/60 px-1.5 py-0.5 text-[9px]">${dueReviews}</span>` : ''}${tab.id === 'erros' && openErrors ? `<span class="ml-1 rounded-full bg-fuchsia-950 text-fuchsia-300 border border-fuchsia-900/60 px-1.5 py-0.5 text-[9px]">${openErrors}</span>` : ''}
                            </button>
                        `).join('')}
                    </div>
                    ${currentArea !== 'today' ? `<button type="button" onclick="window.setStudyTab('log')" class="inline-flex items-center justify-center gap-1.5 rounded-lg bg-cyan-800 hover:bg-cyan-700 text-white px-3 py-2 text-xs font-medium"><i data-lucide="plus" class="w-3.5 h-3.5"></i> Registrar estudo</button>` : ''}
                </div>`;
        }

        window.addSubject = function() {
            const name = document.getElementById('new-subject-name')?.value.trim();
            const trackId = document.getElementById('new-subject-track')?.value || '';
            const color = document.getElementById('new-subject-color')?.value || 'bg-cyan-500';
            if (!name) { window.showAlertModal('Digite o nome da disciplina.'); return; }
            if (!trackId) { window.showAlertModal('Escolha a trilha à qual esta disciplina pertence.'); return; }
            const duplicate = state.studyData.subjects.some(s => String(s.trackId) === String(trackId) && String(s.name || '').trim().toLowerCase() === name.toLowerCase());
            if (duplicate) { window.showAlertModal('Esta disciplina já existe dentro da trilha escolhida.'); return; }
            state.studyData.subjects.push({ id: Date.now(), name, trackId, color, createdAt: new Date().toISOString() });
            const track = window.getStudyTrack(trackId);
            window.showToast('Disciplina adicionada', `${name} entrou na trilha ${track.name}.`, 'book', track.color || 'text-cyan-400');
            window.saveStudyPlanningState();
        };

        window.getStudySubjects = function(trackId = null) {
            const subjects = Array.isArray(state.studyData?.subjects) ? state.studyData.subjects : [];
            const filtered = trackId === null || trackId === undefined || trackId === ''
                ? subjects
                : subjects.filter(s => String(s.trackId || '') === String(trackId));
            return filtered.slice().sort((a, b) => String(a.name || '').localeCompare(String(b.name || ''), 'pt-BR'));
        };

        window.renderStudySubjectOptions = function({ trackId = null, selectedId = '', includeEmpty = true, emptyLabel = 'Sem disciplina vinculada' } = {}) {
            const tracks = window.getStudyTracks(true);
            const selected = String(selectedId || '');
            let html = includeEmpty ? `<option value="">${window.escapeHtml(emptyLabel)}</option>` : '';
            const appendOptions = (subjects, label = '') => {
                if (!subjects.length) return;
                if (label) html += `<optgroup label="${window.escapeHtml(label)}">`;
                html += subjects.map(s => `<option value="${s.id}" ${String(s.id) === selected ? 'selected' : ''}>${window.escapeHtml(s.name)}</option>`).join('');
                if (label) html += '</optgroup>';
            };
            if (trackId !== null && trackId !== undefined && trackId !== '') {
                const track = window.getStudyTrack(trackId);
                appendOptions(window.getStudySubjects(trackId), track.name);
                if (window.getStudySubjects(trackId).length === 0) html += '<option value="" disabled>Nenhuma disciplina cadastrada nesta trilha</option>';
                return html;
            }
            tracks.forEach(track => appendOptions(window.getStudySubjects(track.id), track.name));
            appendOptions(state.studyData.subjects.filter(s => !s.trackId), 'Sem trilha');
            return html;
        };

        window.updateSubjectTrack = function(subjectId, trackId) {
            const subject = state.studyData.subjects.find(s => String(s.id) === String(subjectId));
            const track = window.getStudyTracks(true).find(t => String(t.id) === String(trackId));
            if (!subject || !track) { window.showAlertModal('Disciplina ou trilha não encontrada.'); return; }
            subject.trackId = track.id;
            subject.updatedAt = new Date().toISOString();
            (state.studyData.studyPlan?.weeklyBlocks || []).forEach(block => {
                if (String(block.subjectId) === String(subject.id)) block.trackId = track.id;
            });
            window.saveStudyPlanningState();
            window.showToast('Disciplina reorganizada', `${subject.name} agora pertence à trilha ${track.name}.`, 'route', track.color || 'text-cyan-400');
        };

        window.setStudyPlanningTrack = function(trackId, selectedSubjectId = '') {
            const normalizedTrackId = String(trackId || '');
            uiState.studyPlanningTrackId = normalizedTrackId;
            const subjectSelect = document.getElementById('study-block-subject');
            const subjectLabel = document.getElementById('study-block-subject-label');
            const subjectHelper = document.getElementById('study-block-subject-helper');
            if (!subjectSelect) return;

            if (!normalizedTrackId) {
                subjectSelect.disabled = true;
                subjectSelect.innerHTML = '<option value="">Escolha primeiro uma trilha</option>';
                if (subjectLabel) subjectLabel.textContent = 'Disciplina da trilha';
                if (subjectHelper) subjectHelper.textContent = 'Selecione uma trilha para carregar somente as disciplinas vinculadas a ela.';
                return;
            }

            const track = window.getStudyTrack(normalizedTrackId);
            const subjects = window.getStudySubjects(normalizedTrackId);
            subjectSelect.disabled = false;
            subjectSelect.innerHTML = window.renderStudySubjectOptions({
                trackId: normalizedTrackId,
                selectedId: selectedSubjectId,
                includeEmpty: true,
                emptyLabel: 'Sem disciplina vinculada'
            });
            if (subjectLabel) subjectLabel.textContent = `Disciplina de ${track.name}`;
            if (subjectHelper) {
                subjectHelper.textContent = subjects.length
                    ? `${subjects.length} disciplina${subjects.length === 1 ? '' : 's'} encontrada${subjects.length === 1 ? '' : 's'} em ${track.name}.`
                    : `Nenhuma disciplina está vinculada à trilha ${track.name}. Confira Conteúdo > Disciplinas.`;
            }
        };

        window.updateStudyBlockSubjectOptions = function(selectedSubjectId = '') {
            const trackId = document.getElementById('study-block-track')?.value || '';
            window.setStudyPlanningTrack(trackId, selectedSubjectId);
        };

        window.deleteSubject = function(id) {
            const subject = state.studyData.subjects.find(s => String(s.id) === String(id));
            if (!subject) return;
            window.showConfirmModal(`Excluir a disciplina "${subject.name}"? Sessões, revisões e registros de erro ligados a ela serão apagados. Blocos do planejamento serão preservados sem disciplina vinculada.`, () => {
                state.studyData.subjects = state.studyData.subjects.filter(s => String(s.id) !== String(id));
                state.studyData.sessions = state.studyData.sessions.filter(s => String(s.subjectId) !== String(id));
                state.studyData.reviews = state.studyData.reviews.filter(r => String(r.subjectId) !== String(id));
                state.studyData.errorLog = state.studyData.errorLog.filter(e => String(e.subjectId) !== String(id));
                (state.studyData.studyPlan?.weeklyBlocks || []).forEach(block => {
                    if (String(block.subjectId) === String(id)) block.subjectId = null;
                });
                window.saveStudyPlanningState();
            });
        };

        window.logStudySession = function() {
            const subjectId = parseInt(document.getElementById('session-subject').value);
            const type = document.getElementById('session-type').value;
            const duration = parseInt(document.getElementById('session-duration').value);
            const qTotal = parseInt(document.getElementById('session-q-total').value) || 0;
            const qCorrect = parseInt(document.getElementById('session-q-correct').value) || 0;
            const topic = document.getElementById('session-topic').value.trim();
            const confBefore = parseInt(document.getElementById('session-conf-before').value);
            const confAfter = parseInt(document.getElementById('session-conf-after').value);
            const barriers = Array.from(document.querySelectorAll('input[name="session-barriers"]:checked')).map(cb => cb.value);

            if (!subjectId) { window.showAlertModal('Selecione uma disciplina.'); return; }
            if (!Number.isFinite(duration) || duration < 5) { window.showAlertModal('Informe pelo menos 5 minutos de estudo.'); return; }
            if (qTotal < 0 || qCorrect < 0 || qCorrect > qTotal) { window.showAlertModal('Informe questões e acertos válidos. Os acertos não podem superar o total.'); return; }
            if (![confBefore, confAfter].every(value=>Number.isFinite(value) && value >= 0 && value <= 5)) { window.showAlertModal('Informe a confiança de 0 a 5.'); return; }

            const sessionId = Date.now();
            const typeData = SESSION_TYPES[type] || SESSION_TYPES['leitura'];
            const xpEarned = Math.round(((duration * 1.5) + (qCorrect * 3)) * typeData.mult);
            const energyDelta = -typeData.hp;

            let generatedReviewIds = [];

            // Adicionar repetição espaçada se for teoria ou leitura
            if (['teoria', 'leitura'].includes(type)) {
                [1, 7, 30].forEach(days => {
                    const reviewId = Date.now() + Math.random();
                    generatedReviewIds.push(reviewId);
                    const dueDate = new Date(); dueDate.setDate(dueDate.getDate() + days);
                    state.studyData.reviews.push({ 
                        id: reviewId, 
                        sourceSessionId: sessionId, 
                        subjectId: subjectId, 
                        topic: topic || 'Revisão Geral', 
                        dueDate: dueDate.toISOString(), 
                        intervalDays: days, 
                        status: 'pending',
                        phase: 'initial',
                        cycleStep: days,
                        xpAwarded: 0
                    });
                });
            }

            state.studyData.sessions.push({
                id: sessionId, subjectId, type, duration, qTotal, qCorrect, topic, 
                date: new Date().toISOString(), confBefore, confAfter, barriers,
                xpAwarded: xpEarned, xpCampaign: window.normalizePrestige().campaign, energyDeltaApplied: energyDelta, generatedReviewIds: generatedReviewIds, createdAt: new Date().toISOString()
            });

            state.xp += xpEarned; window.changeEnergy(energyDelta);
            window.checkLevelUp();
            if (typeof window.checkGameTriggers === "function") window.checkGameTriggers();

            if (generatedReviewIds.length > 0) {
                window.showToast('Sessão Registrada!', `+${xpEarned} XP. Revisão programada.`, 'brain', 'text-fuchsia-400');
            } else {
                window.showToast('Sessão Registrada!', `+${xpEarned} XP consolidados.`, 'target', 'text-cyan-400');
            }

            if(state.energy < 20) {
                setTimeout(() => window.showAlertModal("Bateria Executiva Crítica (<20 HP). O sistema recomenda transição para atividades passivas ou encerramento."), 1000);
            }
            window.clearWorkDraft('study', 'log');
            window.saveState();
        };

        window.recalculateLevelFromXp = function() {
            if (state.xp < 0) state.xp = 0;
            state.level = getCorrectLevel(state.xp);
        };

        window.deleteStudySession = function(sessionId) {
            const sessionIndex = state.studyData.sessions.findIndex(s => s.id === sessionId);
            if (sessionIndex === -1) {
                window.showAlertModal("Sessão não encontrada.");
                return;
            }
            const session = state.studyData.sessions[sessionIndex];

            window.showConfirmModal("Tem certeza que deseja excluir esta sessão? O XP, energia e revisões ligadas a ela serão recalculados.", () => {
                state.studyData.sessions.splice(sessionIndex, 1);

                let xpToDeduct = session.xpAwarded;
                if (typeof xpToDeduct === 'undefined') {
                    const typeData = SESSION_TYPES[session.type] || SESSION_TYPES['leitura'];
                    xpToDeduct = Math.round(((session.duration * 1.5) + (session.qCorrect * 3)) * typeData.mult);
                }
                window.revertCampaignXp(xpToDeduct, session.xpCampaign || 1);

                let energyToRevert = session.energyDeltaApplied;
                if (typeof energyToRevert === 'undefined') {
                    const typeData = SESSION_TYPES[session.type] || SESSION_TYPES['leitura'];
                    energyToRevert = -typeData.hp; 
                }
                state.energy -= energyToRevert; 

                const reviewsToRemove = state.studyData.reviews.filter(r => 
                    r.sourceSessionId === sessionId || 
                    (session.generatedReviewIds && session.generatedReviewIds.includes(r.id))
                );
                
                reviewsToRemove.forEach(r => {
                    if (r.xpAwarded) {
                        window.revertCampaignXp(r.xpAwarded, r.xpCampaign || 1);
                    }
                });

                state.studyData.reviews = state.studyData.reviews.filter(r => 
                    r.sourceSessionId !== sessionId && 
                    !(session.generatedReviewIds && session.generatedReviewIds.includes(r.id))
                );

                if (state.xp < 0) state.xp = 0;
                if (state.energy < 0) state.energy = 0;
                if (state.energy > 100) state.energy = 100;

                window.recalculateLevelFromXp();

                window.showToast("Sessão excluída", "XP, energia e revisões foram recalculados.", "trash-2", "text-red-400");
                window.saveState();
            });
        };
        
        window.archiveReview = function(reviewId) {
            const review = state.studyData.reviews.find(r => r.id === reviewId);
            if (!review) {
                window.showAlertModal("Revisão não encontrada.");
                return;
            }
            if (review.status !== "completed") {
                window.showAlertModal("Somente revisões concluídas podem ser arquivadas.");
                return;
            }
            window.showConfirmModal("Deseja arquivar esta revisão concluída? Ela continuará no histórico, mas sairá da lista principal.", () => {
                review.status = "archived";

        window.processReviewDifficulty = function(diffStr) {
            const review = state.studyData.reviews.find(r => r.id === uiState.customPrompt.reviewId);
            if(review) {
                let xp = 0;
                if(diffStr === 'easy') { xp = 20; }
                else if(diffStr === 'medium') { xp = 35; }
                else if(diffStr === 'hard') { xp = 50; }
                else { xp = 60; }
                
                review.status = 'completed'; 
                review.completedAt = new Date().toISOString();
                review.xpAwarded = xp;
                review.xpCampaign = window.normalizePrestige().campaign;
                review.difficultyOrigin = diffStr;
                
                state.xp += xp; window.checkLevelUp();
                
                const phase = review.phase || "initial";
                const step = review.cycleStep || review.intervalDays;
                
                let createNew = false;
                let nextDays = 0;
                let nextPhase = phase;
                let nextCycleStep = 0;

                if (phase === "initial") {
                    if (step === 1 || step === 7) {
                        createNew = false;
                    } else {
                        createNew = true;
                        if(diffStr === 'easy') { nextDays = 60; nextPhase = "maintenance"; nextCycleStep = 60; }
                        else if(diffStr === 'medium') { nextDays = 30; nextPhase = "initial"; nextCycleStep = 30; }
                        else if(diffStr === 'hard') { nextDays = 7; nextPhase = "initial"; nextCycleStep = 7; }
                        else { nextDays = 1; nextPhase = "initial"; nextCycleStep = 1; }
                    }
                } else if (phase === "maintenance") {
                    createNew = true;
                    if(diffStr === 'easy') { nextDays = 90; nextPhase = "maintenance"; nextCycleStep = 90; }
                    else if(diffStr === 'medium') { nextDays = 60; nextPhase = "maintenance"; nextCycleStep = 60; }
                    else if(diffStr === 'hard') { nextDays = 15; nextPhase = "maintenance"; nextCycleStep = 15; }
                    else { nextDays = 3; nextPhase = "maintenance"; nextCycleStep = 3; }
                }

                if (createNew) {
                    const newReviewId = Date.now() + Math.random();
                    review.nextReviewId = newReviewId;
                    
                    const dueDate = new Date(); dueDate.setDate(dueDate.getDate() + nextDays);
                    
                    const session = state.studyData.sessions.find(s => s.id === review.sourceSessionId);
                    if (session && session.generatedReviewIds) {
                        session.generatedReviewIds.push(newReviewId);
                    }

                    state.studyData.reviews.push({ 
                        id: newReviewId, 
                        sourceSessionId: review.sourceSessionId, 
                        subjectId: review.subjectId, 
                        topic: review.topic, 
                        dueDate: dueDate.toISOString(), 
                        intervalDays: nextDays, 
                        status: 'pending', 
                        difficultyOrigin: diffStr,
                        phase: nextPhase,
                        cycleStep: nextCycleStep,
                        xpAwarded: 0
                    });
                    
                    window.showToast('Revisão Calibrada', `+${xp} XP. Nova revisão em ${nextDays} dias.`, 'check-circle', 'text-emerald-400');
                } else {
                    window.showToast('Revisão Concluída', `+${xp} XP. Próxima etapa já estava programada.`, 'check-circle', 'text-emerald-400');
                }
                
                window.closeCustomPrompt(); if (typeof window.checkGameTriggers === "function") window.checkGameTriggers(); window.saveState();
            }
        };

        window.getSubjectStats = function(subjectId) {
            const sessions = (state.studyData?.sessions || []).filter(s => String(s.subjectId) === String(subjectId));
            const totalTime = sessions.reduce((acc, s) => acc + (Number(s.duration) || 0), 0);
            const totalQ = sessions.reduce((acc, s) => acc + (Number(s.qTotal) || 0), 0);
            const correctQ = sessions.reduce((acc, s) => acc + (Number(s.qCorrect) || 0), 0);
            const retention = totalQ > 0 ? Math.round((correctQ / totalQ) * 100) : 0;
            const validSessionTimes = sessions.map(s => new Date(s.date).getTime()).filter(Number.isFinite);
            const lastSession = validSessionTimes.length > 0 ? new Date(Math.max(...validSessionTimes)) : null;
            return { totalTime, totalQ, correctQ, retention, lastSession };
        };

        window.saveStudyPlanBlockChanges = function() {
            const weeklyBlocks = state.studyData?.studyPlan?.weeklyBlocks || [];
            const block = weeklyBlocks.find(b => String(b.id) === String(uiState.editingStudyBlockId));
            if (!block) { window.showAlertModal('O bloco que você estava editando não foi encontrado.'); uiState.editingStudyBlockId = null; render(); return; }

            const title = document.getElementById('study-block-title')?.value.trim();
            const selectedDays = window.getSelectedStudyPlanDays();
            const selectedTrackId = document.getElementById('study-block-track')?.value || '';
            const subjectVal = document.getElementById('study-block-subject')?.value || '';
            const selectedSubject = subjectVal ? state.studyData.subjects.find(s => String(s.id) === String(subjectVal)) : null;
            const trackId = selectedSubject?.trackId || selectedTrackId;
            const studyType = document.getElementById('study-block-type')?.value || 'teoria';
            const plannedMinutes = Math.max(5, Math.min(480, parseInt(document.getElementById('study-block-minutes')?.value) || 30));
            const priority = document.getElementById('study-block-priority')?.value || 'media';
            const energyLevel = document.getElementById('study-block-energy')?.value || 'media';
            const notes = document.getElementById('study-block-notes')?.value.trim() || '';
            const calendarTime = window.readCalendarTimeFields('study-block', plannedMinutes);
            if (!calendarTime) return;

            if (!title) { window.showAlertModal('Digite o tema ou atividade do bloco.'); return; }
            if (selectedDays.length === 0) { window.showAlertModal('Selecione pelo menos um dia da semana.'); return; }
            if (!trackId) { window.showAlertModal('Escolha uma trilha para o bloco.'); return; }
            if (selectedSubject?.trackId && String(selectedSubject.trackId) !== String(selectedTrackId)) {
                window.showAlertModal('A disciplina escolhida pertence a outra trilha. Atualize a seleção e tente novamente.');
                return;
            }

            const now = new Date().toISOString();
            const seriesId = block.seriesId || `study_series_${block.id}`;
            const seriesBlocks = block.seriesId
                ? weeklyBlocks.filter(item => String(item.seriesId || '') === String(block.seriesId))
                : [block];
            const unusedExisting = [...seriesBlocks];
            const keptIds = new Set();

            selectedDays.forEach((day, index) => {
                let target = unusedExisting.find(item => item.day === day);
                if (!target) target = unusedExisting.find(item => !keptIds.has(String(item.id)));

                if (target) {
                    keptIds.add(String(target.id));
                    target.day = day;
                    target.seriesId = seriesId;
                    target.title = title;
                    target.trackId = trackId;
                    target.subjectId = selectedSubject ? selectedSubject.id : null;
                    target.studyType = studyType;
                    target.plannedMinutes = plannedMinutes;
                    target.priority = priority;
                    target.energyLevel = energyLevel;
                    target.notes = notes;
                    target.startTime = calendarTime.startTime;
                    target.endTime = calendarTime.endTime;
                    target.updatedAt = now;
                    target.order = window.getStudyBlocksForDay(day).filter(item => String(item.id) !== String(target.id)).length + 1;
                } else {
                    const newBlock = {
                        id: Date.now() + Math.random() + index,
                        seriesId,
                        day,
                        trackId,
                        subjectId: selectedSubject ? selectedSubject.id : null,
                        title,
                        studyType,
                        plannedMinutes,
                        priority,
                        energyLevel,
                        notes,
                        startTime: calendarTime.startTime,
                        endTime: calendarTime.endTime,
                        status: 'planned',
                        order: window.getStudyBlocksForDay(day).length + 1,
                        linkedSessionId: null,
                        createdAt: now,
                        updatedAt: now
                    };
                    weeklyBlocks.push(newBlock);
                    keptIds.add(String(newBlock.id));
                }
            });

            state.studyData.studyPlan.weeklyBlocks = weeklyBlocks.filter(item => {
                const belongsToEditedSeries = seriesBlocks.some(seriesItem => String(seriesItem.id) === String(item.id));
                return !belongsToEditedSeries || keptIds.has(String(item.id));
            });

            uiState.editingStudyBlockId = null;
            uiState.studyPlanningTrackId = String(trackId);
            window.showToast('Planejamento atualizado', selectedDays.length > 1 ? `A repetição foi ajustada para ${selectedDays.length} dias.` : 'As alterações do bloco foram salvas.', 'pencil', 'text-cyan-400');
            window.saveStudyPlanningState();
        };

        window.updateStudyBlockStatus = function(blockId, status, event = null) {
            if (event) {
                event.preventDefault();
                event.stopPropagation();
            }

            const block = state.studyData.studyPlan.weeklyBlocks.find(b => String(b.id) === String(blockId));
            if (!block) {
                window.showAlertModal('Bloco de planejamento não encontrado.');
                return;
            }

            const viewPosition = window.captureStudyPlanViewPosition(blockId);
            const now = new Date().toISOString();
            const previousStatus = block.status || 'planned';
            const wasCompleted = previousStatus === 'completed';
            const removingPartial = status === 'partial' && block.status === 'partial';
            const nextStatus = removingPartial ? 'planned' : status;

            if (wasCompleted && nextStatus !== 'completed') {
                if (Number(block.rewardedCampaign || 1) === window.normalizePrestige().campaign) window.revokeTacticalCoins(block.rewardedCoins || 0, 'estudo-desmarcado');
                delete block.rewardedCoins;
            }

            block.status = nextStatus;
            block.updatedAt = now;

            if (nextStatus === 'completed') {
                if (!wasCompleted) {
                    const studyCoins = window.getStudyBlockCoinReward(block);
                    block.rewardedCampaign = window.normalizePrestige().campaign;
                    block.rewardedCoins = window.awardTacticalCoins(studyCoins, 'estudo-planejado-concluido', { blockId: block.id, title: block.title, priority: block.priority, showCapToast: false });
                }
                block.completedAt = now;
                delete block.partialAt;
            } else if (nextStatus === 'partial') {
                block.partialAt = now;
                delete block.completedAt;
            } else if (nextStatus === 'planned') {
                delete block.partialAt;
                delete block.completedAt;
            }

            window.saveStudyPlanningState();
            window.restoreStudyPlanViewPosition(viewPosition);

            if (removingPartial) {
                window.showToast('Marcação parcial removida', 'O bloco voltou ao status Planejado.', 'undo-2', 'text-cyan-400');
            } else if (nextStatus === 'partial') {
                window.showToast('Progresso parcial registrado', 'O bloco foi marcado como parcial e permanece no planejamento.', 'circle-dot', 'text-yellow-400');
            } else if (nextStatus === 'completed') {
                window.showToast('Bloco concluído', 'O estudo foi marcado como concluído.', 'check-circle-2', 'text-emerald-400');
            }
        };

        // Exportação financeira XLSX: somente leitura, sem dependências de rede.

            const sheets = [{ name:'Resumo', widths:[44,110], rows:[['Informação','Valor / explicação'],

            const table = (key,name,preferred) => {

                const keys = [...preferred,...new Set(records.flatMap(row=>row && typeof row === 'object' ? Object.keys(row) : ['registro']).filter(field=>!preferred.includes(field)))];

                waitingSince: workflowStatus === 'waiting' ? (document.getElementById('op-demand-waiting-since')?.value || '') : '',
                followUpAt: workflowStatus === 'waiting' ? (document.getElementById('op-demand-followup')?.value || '') : '',
                createdAt: existing?.createdAt || now,
                updatedAt: now,
                lastReviewedAt: existing?.lastReviewedAt || now,
                lastProgressAt: existing?.lastProgressAt || now
            };

            if (existing) {
                const index = operationalControl.demands.findIndex(d => String(d.id) === String(existing.id));
                if (index >= 0) operationalControl.demands[index] = nextDemand;
            } else {
                operationalControl.demands.unshift(nextDemand);
            }

            uiState.operationalDemandDraft = null;
            uiState.showOperationalDemandModal = false;
            uiState.editingOperationalDemandId = null;
            window.showToast(existing ? 'Demanda atualizada' : 'Demanda capturada', 'Base operacional atualizada sem XP, moedas ou combo.', 'radar', 'text-sky-300');
            window.persistOperationalControl(existing ? 'operational-demand-edit' : 'operational-demand-create');
        };

        window.closeOperationalDemand = function(demandId) {
            const demand = window.getOperationalDemand(demandId);
            if (!demand || demand.workflowStatus === 'closed') return;
            window.showConfirmModal(
                `Encerrar a demanda "${demand.title}"? Ela sai da base ativa, mas permanece registrada no histórico operacional.`,
                () => {
                    const now = new Date().toISOString();
                    demand.workflowStatus = 'closed';
                    demand.closedAt = now;
                    demand.updatedAt = now;
                    demand.lastReviewedAt = now;
                    window.showToast('Demanda encerrada', 'O item saiu da base ativa e foi preservado no histórico.', 'check-circle-2', 'text-emerald-300');
                    window.persistOperationalControl('operational-demand-close');
                }
            );
        };

        window.reopenOperationalDemand = function(demandId) {
            const demand = window.getOperationalDemand(demandId);
            if (!demand || demand.workflowStatus !== 'closed') return;
            const now = new Date().toISOString();
            demand.workflowStatus = 'active';
            demand.closedAt = null;
            demand.updatedAt = now;
            demand.lastReviewedAt = now;
            window.showToast('Demanda reaberta', 'O item voltou para a base operacional ativa.', 'rotate-ccw', 'text-sky-300');
            window.persistOperationalControl('operational-demand-reopen');
        };

        window.formatOperationalDate = function(value) {
            if (!value) return '—';
            const raw = String(value);
            const parts = raw.split('-').map(Number);
            if (parts.length === 3 && parts.every(Number.isFinite)) {
                return new Date(parts[0], parts[1] - 1, parts[2]).toLocaleDateString('pt-BR');
            }
            const date = new Date(raw);
            return Number.isNaN(date.getTime()) ? raw : date.toLocaleDateString('pt-BR');
        };

        window.getOperationalDayDateKey = function(dayId = state.activeTab) {
            const weekStart = window.getActivePlanningWeekStartDate();
            const index = Math.max(0, daysOfWeek.findIndex(day => day.id === dayId));
            return dateKeyFromDate(addDaysToDate(weekStart, index));
        };

        window.getOperationalDateDiffDays = function(fromDateKey, toDateKey) {
            if (!fromDateKey || !toDateKey) return null;
            const from = dateFromDateKey(fromDateKey);
            const to = dateFromDateKey(toDateKey);
            if (Number.isNaN(from.getTime()) || Number.isNaN(to.getTime())) return null;
            const ms = new Date(to.getFullYear(), to.getMonth(), to.getDate()).getTime() - new Date(from.getFullYear(), from.getMonth(), from.getDate()).getTime();
            return Math.round(ms / 86400000);
        };

        window.getOperationalSignalsForDate = function(referenceDateKey = dateKeyFromDate(new Date()), horizonDays = null) {
            const operationalControl = window.getOperationalControl();
            const horizon = horizonDays === null
                ? Math.max(0, parseInt(operationalControl.config?.dueSoonDays, 10) || 2)
                : Math.max(0, parseInt(horizonDays, 10) || 0);
            const rows = [];
            const activeDemands = operationalControl.demands.filter(d => d.workflowStatus !== 'closed' && d.workflowStatus !== 'backlog');

            const addSignal = (bucket, kind, severity, label, dateKey = '') => {
                bucket.signals.push({ kind, severity, label, dateKey });
                const rank = { critical: 0, attention: 1, upcoming: 2, info: 3 }[severity] ?? 9;
                bucket.severityRank = Math.min(bucket.severityRank, rank);
            };

            activeDemands.forEach(demand => {
                const bucket = { demand, signals: [], severityRank: 9, nextRelevantDate: '9999-12-31' };

                if (demand.attentionLevel === 'immediate') {
                    addSignal(bucket, 'manual-immediate', 'critical', 'Marcada como ação imediata');
                } else if (demand.attentionLevel === 'attention') {
                    addSignal(bucket, 'manual-attention', 'attention', 'Marcada para atenção');
                }

                if (!String(demand.nextAction || '').trim() && demand.workflowStatus === 'active') {
                    addSignal(bucket, 'missing-next-action', 'attention', 'Sem próxima ação definida');
                }

                if (!String(demand.nextReviewAt || '').trim()) {
                    addSignal(bucket, 'missing-review', 'attention', 'Sem próxima data de revisão');
                }

                if (demand.workflowStatus === 'waiting' && !String(demand.waitingFor || '').trim()) {
                    addSignal(bucket, 'missing-waiting-for', 'attention', 'Aguardando terceiro sem responsável informado');
                }

                if (demand.workflowStatus === 'waiting' && !String(demand.followUpAt || '').trim()) {
                    addSignal(bucket, 'missing-followup', 'attention', 'Aguardando sem data de follow-up');
                }

                const evaluateDate = (dateKey, kind, labels, overdueSeverity = 'attention', todaySeverity = 'attention', upcomingSeverity = 'upcoming') => {
                    if (!dateKey) return;
                    const diff = window.getOperationalDateDiffDays(referenceDateKey, dateKey);
                    if (diff === null) return;
                    if (diff < 0) addSignal(bucket, kind, overdueSeverity, `${labels.overdue} ${Math.abs(diff)}d`, dateKey);
                    else if (diff === 0) addSignal(bucket, kind, todaySeverity, labels.today, dateKey);
                    else if (diff <= horizon) addSignal(bucket, kind, upcomingSeverity, diff === 1 ? labels.tomorrow : `${labels.inDays} ${diff}d`, dateKey);
                    if (diff >= 0 && dateKey < bucket.nextRelevantDate) bucket.nextRelevantDate = dateKey;
                };

                evaluateDate(
                    demand.dueDate,
                    'due',
                    { overdue: 'Prazo final vencido há', today: 'Prazo final hoje', tomorrow: 'Prazo final amanhã', inDays: 'Prazo final em' },
                    'critical', 'critical', 'attention'
                );

                if (demand.workflowStatus === 'waiting') {
                    evaluateDate(
                        demand.followUpAt,
                        'followup',
                        { overdue: 'Follow-up atrasado há', today: 'Follow-up hoje', tomorrow: 'Follow-up amanhã', inDays: 'Follow-up em' },
                        'critical', 'attention', 'upcoming'
                    );
                }

                evaluateDate(
                    demand.nextReviewAt,
                    'review',
                    { overdue: 'Revisão atrasada há', today: 'Revisão prevista para hoje', tomorrow: 'Revisão amanhã', inDays: 'Revisão em' },
                    'attention', 'attention', 'upcoming'
                );

                if (bucket.signals.length) rows.push(bucket);
            });

            rows.sort((a, b) =>
                a.severityRank - b.severityRank ||
                String(a.nextRelevantDate).localeCompare(String(b.nextRelevantDate)) ||
                String(a.demand.title || '').localeCompare(String(b.demand.title || ''), 'pt-BR')
            );
            return rows;
        };

        window.renderOperationalDayPanel = function() {
            const referenceDateKey = window.getOperationalDayDateKey(state.activeTab);
            const horizon = Math.max(0, parseInt(window.getOperationalControl().config?.dueSoonDays, 10) || 2);
            const rows = window.getOperationalSignalsForDate(referenceDateKey, horizon);
            const untilDateKey = dateKeyFromDate(addDaysToDate(dateFromDateKey(referenceDateKey), horizon));

            const severityMeta = {
                critical: { cls: 'border-red-900/60 bg-red-950/20 text-red-300', icon: 'triangle-alert' },
                attention: { cls: 'border-amber-900/60 bg-amber-950/20 text-amber-300', icon: 'calendar-clock' },
                upcoming: { cls: 'border-sky-900/60 bg-sky-950/20 text-sky-300', icon: 'calendar-clock' },
                info: { cls: 'border-slate-800 bg-slate-900 text-slate-300', icon: 'info' }
            };

            if (!rows.length) {
                return `
                    <section class="mb-4 rounded-2xl border border-emerald-900/40 bg-emerald-950/10 px-3 py-3 font-mono flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2">
                        <div class="flex items-start gap-2 min-w-0">
                            <i data-lucide="shield-check" class="w-4 h-4 text-emerald-400 mt-0.5 shrink-0"></i>
