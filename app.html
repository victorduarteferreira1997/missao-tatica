    <style>
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        
        .timer-pulse { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .7; } }
        
        .modal-enter { animation: modalFadeIn 0.25s ease-out forwards; }
        @keyframes modalFadeIn { 
            from { opacity: 0; transform: scale(0.95) translateY(10px); } 
            to { opacity: 1; transform: scale(1) translateY(0); } 
        }
        
        .float-text {
            position: fixed; pointer-events: none; animation: floatUp 1.2s cubic-bezier(0.2, 1, 0.3, 1) forwards;
            font-weight: 900; text-shadow: 0 2px 10px rgba(0,0,0,0.5); z-index: 100;
        }
        @keyframes floatUp {
            0% { opacity: 0; transform: translateY(0) scale(0.5); }
            20% { opacity: 1; transform: translateY(-20px) scale(1.2); }
            100% { opacity: 0; transform: translateY(-60px) scale(1); }
        }

        .toast-enter { animation: slideInRight 0.4s cubic-bezier(0.2, 1, 0.3, 1) forwards; }
        @keyframes slideInRight { 
            from { transform: translateX(100%); opacity: 0; } 
            to { transform: translateX(0); opacity: 1; } 
        }

        .task-drag-over {
            outline: 2px dashed rgba(34, 211, 238, 0.75);
            outline-offset: 4px;
            background: rgba(8, 47, 73, 0.45) !important;
        }
        .drag-handle { cursor: grab; }
        .drag-handle:active { cursor: grabbing; }

        function getCorrectLevel(currentXp) {
            let correctLevel = 1;
            for (let i = 0; i < RANKS.length; i++) {
                if (currentXp >= RANKS[i].max) correctLevel = RANKS[i].level + 1;
                else break;

        // Campanhas usam identificadores monotônicos; excluir histórico não reutiliza IDs.
        window.normalizePrestige = function() {
            if (!state.prestige || typeof state.prestige !== 'object') state.prestige = {};
            const p = state.prestige;
            p.version = 3;
            if (!Array.isArray(p.campaigns)) p.campaigns = [];
            const positiveId = value => Number.isSafeInteger(Number(value)) && Number(value) > 0 && Number(value) < 1000000000 ? Number(value) : 0;
            const used = new Set();
            p.campaigns = p.campaigns.filter(c => c && typeof c === 'object');
            let nextId = Math.max(0, ...p.campaigns.map(c => positiveId(c.number))) + 1;
            p.campaigns.forEach(c => {
                const id = positiveId(c.number);
                c.number = id && !used.has(id) ? id : nextId++;
                used.add(c.number);
                c.xp = Number.isFinite(Number(c.xp)) ? Math.max(0, Number(c.xp)) : 0;
                c.rankLevel = Math.max(1, Math.min(15, parseInt(c.rankLevel, 10) || 15));
            });
            const last = Math.max(0, ...p.campaigns.map(c => Number(c.number) || 0));
            if (!(positiveId(p.campaign) > last)) p.campaign = last + 1;
            p.campaign = Number(p.campaign);
            p.nextCampaignNumber = Math.max(positiveId(p.nextCampaignNumber) || 1, p.campaign + 1, last + 1);
            if (!Array.isArray(p.protectedBadgeIds)) p.protectedBadgeIds = [];
            if (!Array.isArray(p.maxCampaigns)) p.maxCampaigns = [];
            if (typeof p.startedAt === 'undefined') p.startedAt = null;
            if (!CAMPAIGN_THEMES.some(t => t.id === p.themeId)) p.themeId = 'original';
            if (!Array.isArray(p.emblems)) p.emblems = [];
            p.campaigns.forEach(c => {
                if (!CAMPAIGN_THEMES.some(t => t.id === c.themeId)) c.themeId = 'original';
                if (!c.status) c.status = 'completed'; // As versões antigas arquivavam apenas campanhas completas.
                if (!Array.isArray(c.levelEvents)) c.levelEvents = Array.from({ length: Math.min(15, Number(c.rankLevel) || 15) }, (_, i) => ({ level: i + 1, date: null }));
                c.levelEvents = c.levelEvents.filter(e => e && Number.isInteger(Number(e.level)) && e.level >= 1 && e.level <= 15).map(e => ({ level: Number(e.level), date: e.date || null }));
                if (!Array.isArray(c.badgeEvents)) c.badgeEvents = (c.badgeIds || []).map(id => ({ id, date: null, imported: true }));
            });
            if (!Array.isArray(p.bonusClaimedBadgeIds)) p.bonusClaimedBadgeIds = [...new Set([...(state.unlockedBadges || []), ...p.campaigns.flatMap(c => c.badgeIds || [])])];
            if (!Array.isArray(p.badgeEvents)) p.badgeEvents = (state.unlockedBadges || []).filter(id => p.campaign === 1 || !p.protectedBadgeIds.includes(id)).map(id => ({ id, date: null, imported: true }));
            if (!Array.isArray(p.levelEvents)) p.levelEvents = Array.from({ length: Math.max(1, Math.min(15, Number(state.level) || 1)) }, (_, i) => ({ level: i + 1, date: i === 0 ? p.startedAt : null }));
            if (!Array.isArray(p.missionEvents)) p.missionEvents = (state.tasks || []).filter(t => t.completed && Number(t.rewardedCampaign || 1) === p.campaign).map(t => ({ taskId: String(t.id), category: t.category, date: t.completedAt || null }));
            if (!p.currentStats) p.currentStats = p.campaign === 1 ? { ...(state.stats || {}) } : {};
            if (!Array.isArray(p.deletedCampaignIds)) p.deletedCampaignIds = [];
            return p;
        };

        window.getCampaignDefinition = function(id = state.prestige?.themeId) {
            return CAMPAIGN_THEMES.find(t => t.id === id) || CAMPAIGN_THEMES[0];

        window.getCampaignRanks = function() { return window.getCampaignDefinition().ranks; };

        window.getCareerXp = function() {
            return window.normalizePrestige().campaigns.reduce((sum, c) => sum + Math.max(0, Number(c.xp) || 0), 0) + Math.max(0, Number(state.xp) || 0);
        };
        window.canStartPrestige = function() { return state.level === 15 && state.xp >= 90000; };
        window.getCampaignRecordCollections = function() {
            return CAMPAIGN_RECORD_PATHS.map(def => {
                let parent = state;
                const keys = def.path.split('.');
                for (const key of keys.slice(0, -1)) parent = parent?.[key];

        window.recordCampaignMission = function(task, completed) {
            const p = window.normalizePrestige();
            if (Number(task.rewardedCampaign || 1) !== p.campaign) return;
            if (!completed) {
                p.missionEvents = p.missionEvents.filter(e => task.rewardedMissionEventId ? e.eventId !== task.rewardedMissionEventId : e.taskId !== String(task.id));
                delete task.rewardedMissionEventId;
            } else if (typeof window.isNormalMission !== 'function' || window.isNormalMission(task)) {
                if (task.rewardedMissionEventId && p.missionEvents.some(e => e.eventId === task.rewardedMissionEventId)) return;
                p.missionEventSequence = (Number(p.missionEventSequence) || 0) + 1;
                task.rewardedMissionEventId = `${p.campaign}:${p.missionEventSequence}`;
                p.missionEvents.push({ eventId: task.rewardedMissionEventId, taskId: String(task.id), category: task.category, date: new Date().toISOString() });
            }
        };
        window.recordCampaignBadge = function(id, date = new Date().toISOString()) {

            if (!p.badgeEvents.some(e => e.id === id)) p.badgeEvents.push({ id, date });

        window.syncPrestigeMilestones = function(observed = false) {
            const p = window.normalizePrestige();
            const reached = p.campaigns.filter(c => c.status === 'completed').map(c => c.number);
            if (window.canStartPrestige() || p.maxCampaigns.includes(p.campaign)) reached.push(p.campaign);
            p.maxCampaigns = [...new Set(reached)];
            const milestones = [];
            if (p.maxCampaigns.length) milestones.push('campanha_completa');
            if (window.getPrestigeCount()) milestones.push('veterano');
            if (p.maxCampaigns.length >= 3) milestones.push('legado');
            p.badgeEvents = p.badgeEvents.filter(e => !['campanha_completa', 'veterano', 'legado'].includes(e.id) || (e.id === 'campanha_completa' && p.maxCampaigns.includes(p.campaign)));
            state.unlockedBadges = state.unlockedBadges.filter(id => !['campanha_completa', 'veterano', 'legado'].includes(id) || milestones.includes(id));
            milestones.forEach(id => {
                if (!(state.unlockedBadges || []).includes(id)) state.unlockedBadges.push(id);

            if (p.maxCampaigns.includes(p.campaign)) completed.push({ themeId: p.themeId, campaign: p.campaign, earnedAt: p.levelEvents.find(e => e.level === 15)?.date || null });

            state.xp = Math.max(0, state.xp - deducted);
            state.level = getCorrectLevel(state.xp);
            return deducted;

            window.initializeCampaignRecordOrigins();

        window.removeCampaignRecords = function(number, includeUnknown = false) {
            const removedTaskGroups = new Set();
            const removedSessionIds = new Set();
            const removedTasks = [];
            window.getCampaignRecordCollections().forEach(c => {

        function getMondayStartDate(date = new Date()) {
            const d = new Date(date);

            const diff = jsDay === 0 ? -6 : 1 - jsDay;
            d.setDate(d.getDate() + diff);
            return d;
        }

        function addDaysToDate(date, days) {
            const d = new Date(date);

            return d;
        }

        function dateKeyFromDate(date) {
            const d = new Date(date);
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        }

        function dateFromDateKey(dateKey) {
            const [year, month, day] = String(dateKey || '').split('-').map(Number);

        function formatPtShortDate(date, withWeekday = false) {

                ? { weekday: 'short', day: '2-digit', month: '2-digit' }

            return new Date(date).toLocaleDateString('pt-BR', options).replace('.', '');
        }

        function normalizeClockTime(value) {
            const raw = String(value || '').trim();
            if (!raw) return '';
            const match = raw.match(/^(\d{1,2})(?::?(\d{2}))?$/);
            if (!match) return '';
            const hours = parseInt(match[1], 10);
            const minutes = typeof match[2] !== 'undefined' ? parseInt(match[2], 10) : 0;
            if (!Number.isFinite(hours) || !Number.isFinite(minutes) || hours < 0 || hours > 23 || minutes < 0 || minutes > 59) return '';
            return `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}`;
        }

        function minutesFromClock(time) {
            const normalized = normalizeClockTime(time);
            if (!normalized) return null;
            const [hours, minutes] = normalized.split(':').map(Number);
            return (hours * 60) + minutes;
        }

        function addMinutesToClock(time, minutesToAdd = 60) {
            const start = minutesFromClock(time);
            if (start === null) return '';
            const total = Math.max(0, Math.min((24 * 60) - 1, start + (parseInt(minutesToAdd, 10) || 60)));
            const hours = Math.floor(total / 60);
            const minutes = total % 60;
            return `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}`;
        }

        function isValidClockRange(startTime, endTime) {
            const start = minutesFromClock(startTime);
            const end = minutesFromClock(endTime);
            if (start === null || end === null) return true;
            return end > start;
        }

        window.compareCalendarItems = function(a, b, options = {}) {
            const aTime = window.getCalendarSortMinutes(a);
            const bTime = window.getCalendarSortMinutes(b);
            if (aTime !== bTime) return aTime - bTime;
            const completedStatus = options.completedStatus;
            if (completedStatus) {
                const aDone = completedStatus(a) ? 1 : 0;
                const bDone = completedStatus(b) ? 1 : 0;
                if (aDone !== bDone) return aDone - bDone;
            }
            const aOrder = typeof a?.order === 'number' ? a.order : 999999;
            const bOrder = typeof b?.order === 'number' ? b.order : 999999;
            if (aOrder !== bOrder) return aOrder - bOrder;
            const priorityRank = { essencial: 4, alta: 3, media: 2, baixa: 1 };
            const priorityDelta = (priorityRank[b?.priority] || 0) - (priorityRank[a?.priority] || 0);

        window.upsertRecurringTaskOccurrences = function(templateTask, recurrenceDays = [], options = {}) {

            state.economy.rules = state.economy.rules || {};

            state.economy.rules.studyCoins = { ...defaults.studyCoins, ...(state.economy.rules.studyCoins || {}) };

            state.economy.rules.recurringFollowupMultiplier = Number.isFinite(Number(state.economy.rules.recurringFollowupMultiplier)) ? Number(state.economy.rules.recurringFollowupMultiplier) : defaults.recurringFollowupMultiplier;
            if (!Array.isArray(state.economy.history)) state.economy.history = [];
            if (!Array.isArray(state.economy.resetLog)) state.economy.resetLog = [];
            if (typeof state.coins !== 'number' || Number.isNaN(state.coins)) state.coins = parseInt(state.coins, 10) || 0;
            state.coins = Math.max(0, Math.round(state.coins));
            // Metas oficiais acompanham o catálogo; metas personalizadas mantêm seu preço.
            const target = state.economy.targetReward;
            if (target?.type === 'default') {
                const reward = REWARDS_SHOP.find(r => String(r.id) === String(target.id));
                if (reward) target.cost = reward.cost;
            }
            return state.economy;
        };

        window.rollOverEconomyWeekIfNeeded = function() {
            const economy = window.normalizeEconomy();
            const currentWeekKey = window.getCurrentCalendarWeekStartKey();
            if (!economy.weekStartKey) economy.weekStartKey = currentWeekKey;
            if (economy.weekStartKey === currentWeekKey) return;

            const leftover = Math.max(0, parseInt(state.coins, 10) || 0);
            const reserveRoom = Math.max(0, economy.reserveCap - economy.tacticalReserve);
            const transfer = Math.min(Math.floor(leftover * ECONOMY_DEFAULTS.rolloverToReservePercent), reserveRoom);
            if (transfer > 0) economy.tacticalReserve += transfer;
            economy.history.unshift({
                id: Date.now(),
                type: 'weekly-rollover',
                weekFrom: economy.weekStartKey,
                weekTo: currentWeekKey,
                leftover,
                transferredToReserve: transfer,
                expired: Math.max(0, leftover - transfer),
                date: new Date().toISOString()
            });
            economy.history = economy.history.slice(0, 80);
            state.coins = 0;
            economy.weeklyCoinsEarned = 0;
            economy.weekStartKey = currentWeekKey;
        };

        window.getTotalTacticalCoins = function() {
            const economy = window.normalizeEconomy();
            return (parseInt(state.coins, 10) || 0) + (parseInt(economy.tacticalReserve, 10) || 0);
        };

        window.awardTacticalCoins = function(amount, reason = 'missao', details = {}) {
            const economy = window.normalizeEconomy();
            window.rollOverEconomyWeekIfNeeded();
            amount = Math.max(0, Math.round(Number(amount) || 0));
            if (amount <= 0) return 0;
            const remaining = Math.max(0, economy.weeklyCap - economy.weeklyCoinsEarned);
            const awarded = Math.min(amount, remaining);
            if (awarded > 0) {
                state.coins = Math.max(0, (parseInt(state.coins, 10) || 0) + awarded);
                economy.weeklyCoinsEarned = Math.min(economy.weeklyCap, economy.weeklyCoinsEarned + awarded);
                economy.history.unshift({ id: Date.now() + Math.random(), type: 'earn', reason, amount: awarded, requested: amount, details, date: new Date().toISOString() });
                economy.history = economy.history.slice(0, 80);
            } else if (details.showCapToast) {
                window.showToast('Teto semanal atingido', 'Você continua ganhando XP, mas as moedas da semana já chegaram ao limite.', 'lock', 'text-yellow-400');
            }
            return awarded;
        };

        window.revokeTacticalCoins = function(amount, reason = 'reversao') {
            const economy = window.normalizeEconomy();
            amount = Math.max(0, Math.round(Number(amount) || 0));
            if (amount <= 0) return 0;
            const removed = Math.min(amount, parseInt(state.coins, 10) || 0);
            state.coins = Math.max(0, (parseInt(state.coins, 10) || 0) - removed);
            economy.weeklyCoinsEarned = Math.max(0, economy.weeklyCoinsEarned - removed);
            if (removed > 0) {
                economy.history.unshift({ id: Date.now() + Math.random(), type: 'revoke', reason, amount: removed, date: new Date().toISOString() });
                economy.history = economy.history.slice(0, 80);
            }
            return removed;
        };

        window.spendTacticalCoins = function(cost, reason = 'reward') {
            const economy = window.normalizeEconomy();
            cost = Math.max(0, Math.round(Number(cost) || 0));
            if (cost <= 0) return true;
            if (window.getTotalTacticalCoins() < cost) return false;
            const fromWeek = Math.min(cost, parseInt(state.coins, 10) || 0);
            const fromReserve = cost - fromWeek;
            state.coins = Math.max(0, (parseInt(state.coins, 10) || 0) - fromWeek);
            economy.tacticalReserve = Math.max(0, (parseInt(economy.tacticalReserve, 10) || 0) - fromReserve);
            economy.history.unshift({ id: Date.now() + Math.random(), type: 'spend', reason, cost, fromWeek, fromReserve, date: new Date().toISOString() });
            economy.history = economy.history.slice(0, 80);
            return true;
        };

        window.getTaskNature = function(task) {
            const raw = String(task?.missionNature || task?.nature || '').toLowerCase();
            if (TASK_NATURES[raw]) return raw;
            if (task?.impactType === 'recharge' || Number(task?.energyCost) < 0) return 'recharge';
            return 'normal';
        };

        window.getTaskNatureMeta = function(taskOrNature) {

            return TASK_NATURES[nature] || TASK_NATURES.normal;
        };

        window.isNormalMission = function(task) {

                        : 'Modelo HP v1.7.9: com dificuldade e tempo iguais, a drenagem sempre sobe na ordem baixa < média < alta < essencial.';

        window.setTaskNature = function(prefix, nature) {

        window.bindTaskNatureControls = function(root = document) {

        window.getTaskCoinReward = function(task) {
            if (!window.isNormalMission(task)) return 0;
            const economy = window.normalizeEconomy();
            const priority = String(task?.priority || 'media').toLowerCase();
            let base = economy.rules.taskCoins[priority] ?? economy.rules.taskCoins.media ?? 5;
            if (task?.isRecurring && task?.recurrenceGroupId) {
                const completedSameSeries = (state.tasks || []).some(t => String(t.id) !== String(task.id) && String(t.recurrenceGroupId || '') === String(task.recurrenceGroupId) && t.completed && (t.rewardedCoins || 0) > 0);
                if (completedSameSeries) base = Math.max(1, Math.ceil(base * economy.rules.recurringFollowupMultiplier));
            }
            return Math.max(0, Math.round(base));
        };

        window.getStudyBlockCoinReward = function(block) {
            const economy = window.normalizeEconomy();
            const priority = String(block?.priority || 'media').toLowerCase();
            return Math.max(0, Math.round(economy.rules.studyCoins[priority] ?? economy.rules.studyCoins.media ?? 4));
        };

        window.setRewardTarget = function(type, id) {
            const source = type === 'custom' ? (state.customRewards || []).find(r => String(r.id) === String(id) && r.active !== false) : REWARDS_SHOP.find(r => String(r.id) === String(id));
            if (!source) { window.showAlertModal('Recompensa não encontrada.'); return; }
            const economy = window.normalizeEconomy();
            economy.targetReward = { type, id: String(id), title: source.title, cost: parseInt(source.cost, 10) || 0, icon: source.icon || 'gift', updatedAt: new Date().toISOString() };
            window.showToast('Recompensa-alvo definida', `${source.title} virou o seu objetivo de moedas.`, 'target', 'text-yellow-400');
            window.saveState();
        };

        window.clearRewardTarget = function() {

            economy.targetReward = null;
            window.showToast('Alvo removido', 'A meta de recompensa foi limpa.', 'x-circle', 'text-slate-400');
            window.saveState();
        };

        window.resetTacticalCoins = function() {
            window.showConfirmModal('Zerar todas as moedas atuais? Isso vai colocar as Moedas da Semana e a Reserva Tática em 0. XP, patentes, tarefas e histórico continuam preservados.', () => {
                const economy = window.normalizeEconomy();
                economy.resetLog.unshift({ id: Date.now(), previousCoins: state.coins || 0, previousReserve: economy.tacticalReserve || 0, date: new Date().toISOString() });
                economy.resetLog = economy.resetLog.slice(0, 30);
                state.coins = 0;
                economy.tacticalReserve = 0;
                economy.weeklyCoinsEarned = 0;
                economy.targetReward = null;
                window.showToast('Moedas zeradas', 'Economia reiniciada sem mexer no XP nem nas missões.', 'refresh-ccw', 'text-yellow-400');
                window.saveState();

        window.prepareNextWeekPlanning = function() {
            const nextMondayKey = window.getNextCalendarWeekStartKey();
            window.showConfirmModal('Preparar a próxima semana agora? Isso vai limpar as missões comuns da semana atual, preservar missões recorrentes, zerar o status dos estudos planejados e abrir o calendário da próxima semana. Ideal para usar no domingo, depois de revisar/fechar a semana atual.', () => {
                window.normalizeRecurringTaskSchedules();
                const recurringTasks = state.tasks
                    .filter(t => t.isRecurring || (Array.isArray(t.recurrenceDays) && t.recurrenceDays.length > 0))
                    .map(t => {
                        const cleanTask = {
                            ...t,
                            completed: false,
                            workflowStatus: 'planned',
                            skipped: false,
                            subtasks: (Array.isArray(t.subtasks) ? t.subtasks : []).map(st => ({ ...st, completed: false }))
                        };
                        delete cleanTask.rewardedXp;
                        delete cleanTask.rewardedCoins;
                        delete cleanTask.rewardedEnergyCost;
                        return cleanTask;
                    });

                if (state.studyData?.studyPlan?.weeklyBlocks) {
                    state.studyData.studyPlan.weeklyBlocks.forEach(block => {
                        if (block.status !== 'cancelled') block.status = 'planned';
                        delete block.linkedSessionId;
                        delete block.completedAt;
                        delete block.partialAt;
                        delete block.remarkedAt;
                        delete block.lastActionAt;
                    });
                }

                state.tasks = recurringTasks;
                state.quickTasks = [];
                state.combo = 0;
                window.rollOverEconomyWeekIfNeeded();
                state.energy = 100;
                state.activeTab = 'monday';
                state.currentFilter = 'all';
                state.currentPlanningWeekStart = nextMondayKey;
                uiState.mainView = 'week';
                window.saveState();
                window.showToast('Próxima semana preparada', `${recurringTasks.length} missão(ões) recorrente(s) preservada(s). Estudos voltaram para planejado.`, 'calendar-plus', 'text-cyan-300');
            });
        };

        window.validateState = function() {
            if (!state) {
                state = {
                    activeTab: 'monday', focusMode: false, focusedTaskId: null,
                    xp: 0, level: 1, energy: 100, coins: 0, combo: 0,
                    unlockedBadges: [], tasks: [], quickTasks: [], currentFilter: 'all', taskCategories: DEFAULT_TASK_CATEGORIES.map(c => ({...c})),
                    pomodoroSettings: { focus: 25, shortBreak: 5, longBreak: 15, cycles: 4 },
                    focusData: { cycles: [] },
                    rechargeData: { actions: DEFAULT_RECHARGE_ACTIONS.map(a => ({...a})), logs: [] },
                    operationalControl: {
                        version: '1.0', demands: [], scans: [], shutdowns: [],
                        config: { wipLimit: 3, dueSoonDays: 2, staleDays: 5, waitingDays: 3 }
                    },
                    stats: { pomodorosCompleted: 0, tasksMoved: 0, maxComboReached: 0, rewardsBought: 0 }
                };
            }
            if (!state.stats) state.stats = { pomodorosCompleted: 0, tasksMoved: 0, maxComboReached: 0, rewardsBought: 0 };
            if (!state.quickTasks) state.quickTasks = [];
            if (!state.userProfile) state.userProfile = { displayName: '', gender: '', configured: false };
            state.userProfile.displayName = String(state.userProfile.displayName || '').trim();
            if (!['masculino', 'feminino', 'neutro'].includes(state.userProfile.gender)) state.userProfile.gender = '';
            state.userProfile.configured = Boolean(state.userProfile.displayName && state.userProfile.gender);
            if (!Array.isArray(state.taskDeletionLog)) state.taskDeletionLog = [];
            if (!state.unlockedBadges) state.unlockedBadges = [];
            if (!state.tasks) state.tasks = []; 
            window.normalizePrestige();
            window.syncPrestigeMilestones();
            if (!state.currentPlanningWeekStart) state.currentPlanningWeekStart = window.getCurrentCalendarWeekStartKey();
            if (Number.isNaN(dateFromDateKey(state.currentPlanningWeekStart).getTime())) state.currentPlanningWeekStart = window.getCurrentCalendarWeekStartKey();
            if (!state.currentFilter) state.currentFilter = 'all';
            if (!Array.isArray(state.deletedTaskCategoryIds)) state.deletedTaskCategoryIds = [];
            if (!state.taskCategories || !Array.isArray(state.taskCategories)) state.taskCategories = [];
            if (state.taskCategories.length === 0) {
                state.taskCategories = DEFAULT_TASK_CATEGORIES
                    .filter(c => !state.deletedTaskCategoryIds.includes(c.id))
                    .map(c => ({...c}));
            } else {
                DEFAULT_TASK_CATEGORIES.forEach(defaultCat => {
                    if (state.deletedTaskCategoryIds.includes(defaultCat.id)) return;
                    const existing = state.taskCategories.find(c => c.id === defaultCat.id);
                    if (!existing) state.taskCategories.push({...defaultCat});
                    else {
                        existing.label = existing.label || defaultCat.label;
                        existing.icon = existing.icon || defaultCat.icon;
                        existing.color = existing.color || defaultCat.color;
                        if (typeof existing.active === 'undefined') existing.active = true;
                        if (typeof existing.system === 'undefined') existing.system = true;
                    }
                });
            }
            if (!state.taskCategories.some(c => c.active !== false)) {
                state.taskCategories.push({ id: 'geral', label: 'Geral', icon: 'target', color: 'text-slate-400', active: true, system: false, createdAt: new Date().toISOString() });
            }
            daysOfWeek.forEach(day => {
                const tasksForDay = state.tasks
                    .filter(t => t.day === day.id)
                    .sort((a, b) => ((typeof a.order === 'number' ? a.order : 999999) - (typeof b.order === 'number' ? b.order : 999999)) || ((a.id || 0) - (b.id || 0)));
                tasksForDay.forEach((t, index) => { if (typeof t.order !== 'number') t.order = index + 1; });
            });
            state.tasks.forEach(t => { 
                if (!Array.isArray(t.subtasks)) t.subtasks = []; 
                if (!Array.isArray(t.recurrenceDays)) t.recurrenceDays = []; 
                if (typeof t.isRecurring === 'undefined') t.isRecurring = t.recurrenceDays.length > 0;
                if (!TASK_NATURES[t.missionNature]) t.missionNature = (t.impactType === 'recharge' || Number(t.energyCost) < 0) ? 'recharge' : 'normal';
                if (t.missionNature === 'neutral' && !t.completed) {
                    t.xp = 0;
                    t.energyCost = 0;
                    t.impactType = 'drain';
                }
                if (t.missionNature === 'recharge' && !t.completed) {
                    t.xp = 0;
                    t.impactType = 'recharge';
                    if (!(Number(t.energyCost) < 0)) t.energyCost = -20;
                }
                t.startTime = normalizeClockTime(t.startTime);
                t.endTime = t.startTime ? normalizeClockTime(t.endTime) : '';
                if (t.startTime && t.endTime && !isValidClockRange(t.startTime, t.endTime)) t.endTime = '';
                // Não depender de window.getTaskCategory aqui: validateState roda antes de alguns helpers visuais.
                const categoryExistsForTask = state.taskCategories.some(c => c.id === t.category);
                if (!categoryExistsForTask) t.category = state.taskCategories.find(c => c.active !== false)?.id || 'geral';
            });
            window.normalizeRecurringTaskSchedules();
            if (state.currentFilter !== 'all' && !state.taskCategories.some(c => c.id === state.currentFilter && c.active !== false)) state.currentFilter = 'all';
            
            if (!state.customRewards) state.customRewards = [];
            if (!state.rewardPurchases) state.rewardPurchases = [];
            if (typeof window.normalizeEconomy === 'function') {
                window.normalizeEconomy();
                window.rollOverEconomyWeekIfNeeded();
            }

            // Validação Radar de Controle / Situação Operacional
            if (!state.operationalControl || typeof state.operationalControl !== 'object') state.operationalControl = {};
            const operationalControl = state.operationalControl;
            operationalControl.version = operationalControl.version || '1.0';
            if (!Array.isArray(operationalControl.demands)) operationalControl.demands = [];
            if (!Array.isArray(operationalControl.scans)) operationalControl.scans = [];
            if (!Array.isArray(operationalControl.shutdowns)) operationalControl.shutdowns = [];
            if (!operationalControl.config || typeof operationalControl.config !== 'object') operationalControl.config = {};
            operationalControl.config.wipLimit = Math.max(1, Math.min(10, parseInt(operationalControl.config.wipLimit, 10) || 3));
            operationalControl.config.dueSoonDays = Math.max(0, Math.min(30, parseInt(operationalControl.config.dueSoonDays, 10) || 2));
            operationalControl.config.staleDays = Math.max(1, Math.min(90, parseInt(operationalControl.config.staleDays, 10) || 5));
            operationalControl.config.waitingDays = Math.max(1, Math.min(90, parseInt(operationalControl.config.waitingDays, 10) || 3));

            operationalControl.demands.forEach((demand, index) => {
                if (!demand.id) demand.id = `${Date.now()}-${index}-${Math.random().toString(16).slice(2)}`;
                demand.title = String(demand.title || 'Demanda sem título').trim();
                demand.area = String(demand.area || '').trim();
                demand.project = String(demand.project || '').trim();
                demand.nextAction = String(demand.nextAction || '').trim();
                demand.dueDate = String(demand.dueDate || '').trim();
                demand.nextReviewAt = String(demand.nextReviewAt || '').trim();
                demand.owner = String(demand.owner || '').trim();
                demand.requester = String(demand.requester || '').trim();
                demand.waitingFor = String(demand.waitingFor || '').trim();
                demand.waitingSince = String(demand.waitingSince || '').trim();
                demand.followUpAt = String(demand.followUpAt || '').trim();
                demand.source = String(demand.source || 'manual').trim();
                demand.workflowStatus = ['active', 'waiting', 'backlog', 'closed'].includes(demand.workflowStatus) ? demand.workflowStatus : 'active';
                demand.attentionLevel = ['controlled', 'attention', 'immediate'].includes(demand.attentionLevel) ? demand.attentionLevel : 'controlled';
                if (!demand.createdAt) demand.createdAt = new Date().toISOString();
                if (!demand.updatedAt) demand.updatedAt = demand.createdAt;
                if (!demand.lastReviewedAt) demand.lastReviewedAt = demand.updatedAt;
                if (!demand.lastProgressAt) demand.lastProgressAt = demand.updatedAt;
                if (demand.workflowStatus === 'closed' && !demand.closedAt) demand.closedAt = demand.updatedAt;
                if (demand.workflowStatus !== 'waiting') {
                    demand.waitingFor = '';
                    demand.waitingSince = '';
                    demand.followUpAt = '';
                }
            });

            // Validação Módulo de Rituais
            if (!state.routineData) state.routineData = {};
            if (!state.routineData.rituals) state.routineData.rituals = [];
            if (!state.routineData.logs) state.routineData.logs = [];

            // Validação Módulo de Recarga Executiva
            if (!state.rechargeData) state.rechargeData = {};
            if (!Array.isArray(state.rechargeData.actions)) state.rechargeData.actions = [];
            if (!Array.isArray(state.rechargeData.logs)) state.rechargeData.logs = [];
            DEFAULT_RECHARGE_ACTIONS.forEach(defaultAction => {
                const existing = state.rechargeData.actions.find(a => a.id === defaultAction.id);
                if (!existing) {
                    state.rechargeData.actions.push({ ...defaultAction });
                } else {
                    existing.title = existing.title || defaultAction.title;
                    existing.icon = existing.icon || defaultAction.icon;
                    existing.description = existing.description || defaultAction.description;
                    existing.type = existing.type || defaultAction.type;
                    existing.duration = Number.isFinite(Number(existing.duration)) ? Number(existing.duration) : defaultAction.duration;
                    existing.energyGain = Number.isFinite(Number(existing.energyGain)) ? Number(existing.energyGain) : defaultAction.energyGain;

        async function loadFromFirestore(uid) {
            window.updateSyncStatus('Carregando...');
            try {
                const docRef = doc(db, 'users', uid, 'state', 'main');
                const docSnap = await getDoc(docRef);
                if (docSnap.exists()) {
                    const cloudState = JSON.parse(docSnap.data().data);
                    const localState = state ? JSON.parse(JSON.stringify(state)) : null;
                    const localSavedAt = Date.parse(localState?.lastSavedAt || localState?.updatedAt || 0);
                    const cloudSavedAt = Date.parse(cloudState?.lastSavedAt || cloudState?.updatedAt || docSnap.data().updatedAt || 0);
                    const localBelongsToThisUser = localState?.ownerUid && String(localState.ownerUid) === String(uid);

                    // Proteção contra perda de dados: se o navegador tem um estado local mais novo
                    // do mesmo usuário, ele não é sobrescrito por uma cópia antiga da nuvem.
                    if (localBelongsToThisUser && localSavedAt && cloudSavedAt && localSavedAt > cloudSavedAt + 1500) {
                        state = localState;
                        window.validateState();
                        localStorage.setItem('planeamento_semanal_v11', JSON.stringify(state));
                        await writeStateToFirestore(currentUser);
                        window.updateSyncStatus('Salvo na nuvem');

                        state.ownerUid = uid;
                        window.validateState();
                        localStorage.setItem('planeamento_semanal_v11', JSON.stringify(state));
                        window.updateSyncStatus('Conectado');
                    }
                } else {

                }
            } catch(e) { window.updateSyncStatus('Erro de conexão'); }

ompleto</button><p class="text-xs text-slate-500 leading-relaxed mt-1">Opcional antes da limpeza. A importação substitui todos os dados do aplicativo.</p></div></div></div><footer class="px-6 py-4 border-t border-slate-800 flex flex-wrap items-center justify-between gap-3 shrink-0"><p class="text-xs text-slate-500">Você revisa e confirma no próximo passo.</p><div class="flex gap-3"><button type="button" onclick="window.closeDataManager()" class="px-4 py-2.5 rounded-lg border border-slate-700 text-sm text-slate-300 hover:bg-slate-800">Cancelar</button><button type="button" onclick="window.reviewDataCleanup()" ${selected.length ? '' : 'disabled'} class="px-4 py-2.5 rounded-lg text-sm font-semibold bg-red-900/50 border border-red-800/60 text-red-200 hover:bg-red-900/70 disabled:opacity-40 disabled:cursor-not-allowed">Revisar limpeza</button></div></footer></section></div>`;
        };

        // ------------------------------------------
        // EXPORTAÇÃO PARA GOOGLE AGENDA (.ICS)
        // ------------------------------------------
        function formatIcsDate(date) {
            const d = new Date(date);
            return `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}`;
        }

        function formatIcsDateTime(date, clockTime) {
            const [hours, minutes] = normalizeClockTime(clockTime).split(':').map(Number);
            const d = new Date(date);
            d.setHours(hours || 0, minutes || 0, 0, 0);
            return `${formatIcsDate(d)}T${String(d.getHours()).padStart(2, '0')}${String(d.getMinutes()).padStart(2, '0')}00`;
        }

        function icsEscape(value) {
            return String(value ?? '')
                .replace(/\\/g, '\\\\')
                .replace(/;/g, '\\;')
                .replace(/,/g, '\\,')
                .replace(/\r?\n/g, '\\n');
        }

        function foldIcsLine(line) {
            const limit = 72;
            let result = '';
            let current = String(line || '');
            while (current.length > limit) {
                result += current.slice(0, limit) + '\r\n ';
                current = current.slice(limit);
            }
            return result + current;
        }

        function extractMinutesFromTask(task) {
            const raw = parseInt(String(task?.time || '').replace(/[^0-9]/g, ''), 10);
            return Number.isFinite(raw) && raw > 0 ? raw : 30;
        }

        function getIcsByDay(dayId) {
            const map = { monday: 'MO', tuesday: 'TU', wednesday: 'WE', thursday: 'TH', friday: 'FR', saturday: 'SA', sunday: 'SU' };
            return map[dayId] || '';
        }

        function sortDayIdsByWeek(dayIds = []) {
            const order = new Map(daysOfWeek.map((day, index) => [day.id, index]));
            return [...new Set((dayIds || []).filter(dayId => order.has(dayId)))]
                .sort((a, b) => order.get(a) - order.get(b));
        }

        function buildWeeklyRecurrenceRule(dayIds = [], count = 0) {
            const sortedDays = sortDayIdsByWeek(dayIds);
            if (sortedDays.length <= 1 || count <= 1) return '';
            const byday = sortedDays.map(getIcsByDay).filter(Boolean).join(',');
            return byday ? `FREQ=WEEKLY;COUNT=${count};BYDAY=${byday}` : '';
        }

        function buildIcsEvent({ uid, summary, date, startTime, endTime, durationMinutes, description, recurrenceRule }) {
            const now = new Date().toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';
            const cleanStart = normalizeClockTime(startTime);
            const cleanEnd = normalizeClockTime(endTime);
            const cleanRecurrenceRule = String(recurrenceRule || '').trim();
            const lines = ['BEGIN:VEVENT', `UID:${icsEscape(uid)}`, `DTSTAMP:${now}`];
            if (cleanStart) {
                const finalEnd = cleanEnd || addMinutesToClock(cleanStart, durationMinutes || 60);
                lines.push(`DTSTART:${formatIcsDateTime(date, cleanStart)}`);
                lines.push(`DTEND:${formatIcsDateTime(date, finalEnd)}`);
            } else {
                lines.push(`DTSTART;VALUE=DATE:${formatIcsDate(date)}`);
                lines.push(`DTEND;VALUE=DATE:${formatIcsDate(addDaysToDate(date, 1))}`);
            }
            if (cleanRecurrenceRule) lines.push(`RRULE:${cleanRecurrenceRule}`);
            lines.push(`SUMMARY:${icsEscape(summary)}`);
            if (description) lines.push(`DESCRIPTION:${icsEscape(description)}`);
            lines.push('CATEGORIES:Missão Tática');
            lines.push('END:VEVENT');
            return lines.map(foldIcsLine).join('\r\n');
        }

        window.exportVisibleWeekToIcs = function() {
            if (typeof window.normalizeRecurringTaskSchedules === 'function') window.normalizeRecurringTaskSchedules();

            const tasks = Array.isArray(state.tasks) ? state.tasks : [];
            const studyBlocks = (state.studyData?.studyPlan?.weeklyBlocks || []).filter(b => b.status !== 'cancelled');
            const subjects = state.studyData?.subjects || [];
            const weekStart = window.getActivePlanningWeekStartDate();
            const weekEnd = addDaysToDate(weekStart, 6);
            const weekLabel = `${formatPtShortDate(weekStart)} a ${formatPtShortDate(weekEnd)}`;
            const dayIndexMap = new Map(daysOfWeek.map((day, index) => [day.id, index]));
            const items = [];

            const getDayDate = (dayId) => addDaysToDate(weekStart, dayIndexMap.get(dayId) || 0);
            const getDayLabel = (dayId) => daysOfWeek.find(day => day.id === dayId)?.label || dayId;
            const getVisibleDaysFromTasks = (groupTasks, fallbackDays = []) => {
                const taskDays = groupTasks.map(t => t.day).filter(dayId => dayIndexMap.has(dayId));
                const declaredDays = (fallbackDays || []).filter(dayId => dayIndexMap.has(dayId));
                return sortDayIdsByWeek(taskDays.length ? taskDays : declaredDays);
            };

            const addTaskItem = (task, options = {}) => {
                if (!task || !dayIndexMap.has(task.day)) return;
                const cat = window.getTaskCategory(task.category);
                const duration = extractMinutesFromTask(task);
                const subtasks = Array.isArray(task.subtasks) && task.subtasks.length
                    ? `\nSubtarefas: ${task.subtasks.map(st => `${st.completed ? '✓' : '○'} ${st.text}`).join(' | ')}`
                    : '';
                const recurrenceDescription = options.recurrenceDayIds?.length > 1
                    ? `\nRecorrência no arquivo: ${options.recurrenceDayIds.map(getDayLabel).join(', ')}\nObservação: ao editar no Google Agenda, escolha “todos os eventos da série” para aplicar a todos os dias importados.`
                    : '';
                items.push({
                    type: 'task',
                    id: options.id || task.id,
                    day: task.day,
                    date: options.date || getDayDate(task.day),
                    startTime: task.startTime,
                    endTime: task.endTime,
                    sortTime: normalizeClockTime(task.startTime) || '99:99',
                    summary: `Missão Tática — ${task.text || 'Missão'}`,
                    description: `Origem: Missão Tática\nTipo: Missão do board\nDia: ${getDayLabel(task.day)}\nCategoria: ${cat.label || 'Geral'}\nPrioridade: ${task.priority || 'média'}\nStatus: ${task.completed ? 'Concluída' : 'Pendente'}\nDuração estimada: ${duration} min${recurrenceDescription}${subtasks}`,
                    durationMinutes: duration,
                    recurrenceRule: options.recurrenceRule || '',
                    recurrenceDayIds: options.recurrenceDayIds || null,
                    uid: options.uid || null
                });
            };

            const exportedTaskGroups = new Set();
            tasks.forEach(task => {
                if (!task || !dayIndexMap.has(task.day)) return;
                const recurrenceDays = Array.isArray(task.recurrenceDays) ? task.recurrenceDays.filter(dayId => dayIndexMap.has(dayId)) : [];
                const groupId = task.recurrenceGroupId ? String(task.recurrenceGroupId) : '';
                const isRecurringSeries = Boolean(groupId && (task.isRecurring || recurrenceDays.length > 1));

                if (isRecurringSeries) {
                    if (exportedTaskGroups.has(groupId)) return;
                    const groupTasks = tasks.filter(t => String(t.recurrenceGroupId || '') === groupId && dayIndexMap.has(t.day));
                    const seriesDays = getVisibleDaysFromTasks(groupTasks, recurrenceDays);
                    const firstDay = seriesDays[0] || task.day;
                    const source = groupTasks.find(t => t.day === firstDay) || task;
                    const doneCount = groupTasks.filter(t => t.completed).length;
                    const recurrenceRule = buildWeeklyRecurrenceRule(seriesDays, seriesDays.length);
                    addTaskItem(source, {
                        id: `rec-${groupId}`,
                        date: getDayDate(firstDay),
                        recurrenceRule,
                        recurrenceDayIds: seriesDays,
                        uid: `missao-tatica-task-series-${groupId}-${dateKeyFromDate(weekStart)}@missao-tatica`
                    });
                    const lastItem = items[items.length - 1];
                    if (lastItem && recurrenceRule) {
                        lastItem.description += `\nStatus da série na semana: ${doneCount}/${seriesDays.length} ocorrência(s) concluída(s).`;
                    }
                    exportedTaskGroups.add(groupId);
                    return;
                }

                addTaskItem(task);
            });

            const addStudyItem = (block, options = {}) => {
                if (!block || !dayIndexMap.has(block.day)) return;
                const track = window.getStudyTrack(block.trackId);
                const subject = block.subjectId ? subjects.find(s => String(s.id) === String(block.subjectId)) : null;
                const duration = parseInt(block.plannedMinutes, 10) || 30;
                const recurrenceDescription = options.recurrenceDayIds?.length > 1
                    ? `\nRecorrência no arquivo: ${options.recurrenceDayIds.map(getDayLabel).join(', ')}\nObservação: ao editar no Google Agenda, escolha “todos os eventos da série” para aplicar a todos os dias importados.`
                    : '';
                items.push({
                    type: 'study',
                    id: options.id || block.id,
                    day: block.day,
                    date: options.date || getDayDate(block.day),
                    startTime: block.startTime,
                    endTime: block.endTime,
                    sortTime: normalizeClockTime(block.startTime) || '99:99',
                    summary: `Missão Tática — Estudo: ${block.title || 'Bloco de estudo'}`,
                    description: `Origem: Missão Tática\nTipo: Estudo planejado\nDia: ${getDayLabel(block.day)}\nTrilha: ${track.name || 'Trilha'}\nDisciplina: ${subject ? subject.name : 'Sem disciplina vinculada'}\nMétodo: ${window.getStudyTypeLabel(block.studyType)}\nStatus: ${window.getStudyBlockStatusLabel(block.status)}\nDuração planejada: ${duration} min${recurrenceDescription}${block.notes ? `\nObservações: ${block.notes}` : ''}`,
                    durationMinutes: duration,
                    recurrenceRule: options.recurrenceRule || '',
                    recurrenceDayIds: options.recurrenceDayIds || null,
                    uid: options.uid || null
                });
            };

            const exportedStudySeries = new Set();
            studyBlocks.forEach(block => {
                if (!block || !dayIndexMap.has(block.day)) return;
                const seriesId = block.seriesId ? String(block.seriesId) : '';
                const seriesBlocks = seriesId
                    ? studyBlocks.filter(item => String(item.seriesId || '') === seriesId && dayIndexMap.has(item.day))
                    : [];

                if (seriesId && seriesBlocks.length > 1) {
                    if (exportedStudySeries.has(seriesId)) return;
                    const seriesDays = sortDayIdsByWeek(seriesBlocks.map(item => item.day));
                    const firstDay = seriesDays[0] || block.day;
                    const source = seriesBlocks.find(item => item.day === firstDay) || block;
                    const doneCount = seriesBlocks.filter(item => item.status === 'completed').length;
                    const recurrenceRule = buildWeeklyRecurrenceRule(seriesDays, seriesDays.length);
                    addStudyItem(source, {
                        id: `series-${seriesId}`,
                        date: getDayDate(firstDay),
                        recurrenceRule,
                        recurrenceDayIds: seriesDays,
                        uid: `missao-tatica-study-series-${seriesId}-${dateKeyFromDate(weekStart)}@missao-tatica`
                    });
                    const lastItem = items[items.length - 1];
                    if (lastItem && recurrenceRule) {
                        lastItem.description += `\nStatus da série na semana: ${doneCount}/${seriesDays.length} ocorrência(s) concluída(s).`;
                    }
                    exportedStudySeries.add(seriesId);
                    return;
                }

                addStudyItem(block);
            });

            if (!items.length) {
                window.showAlertModal('Não há missões ou estudos planejados na semana visível para exportar.');
                return;
            }

            items.sort((a, b) => (a.date - b.date) || String(a.sortTime).localeCompare(String(b.sortTime)) || String(a.summary).localeCompare(String(b.summary)));
            const events = items.map(item => buildIcsEvent({
                uid: item.uid || `missao-tatica-${item.type}-${item.id}-${dateKeyFromDate(item.date)}@missao-tatica`,
                summary: item.summary,
                date: item.date,
                startTime: item.startTime,
                endTime: item.endTime,
                durationMinutes: item.durationMinutes,
                description: item.description,
                recurrenceRule: item.recurrenceRule
            })).join('\r\n');

            const calendar = [
                'BEGIN:VCALENDAR',
                'VERSION:2.0',
                'PRODID:-//Missao Tatica//Agenda Semanal//PT-BR',
                'CALSCALE:GREGORIAN',
                'METHOD:PUBLISH',
                `X-WR-CALNAME:${icsEscape('Missão Tática — Semana ' + weekLabel)}`,
                events,
                'END:VCALENDAR'
            ].join('\r\n');

            const blob = new Blob([calendar], { type: 'text/calendar;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `missao_tatica_agenda_${dateKeyFromDate(weekStart)}.ics`;
            document.body.appendChild(link);
            link.click();
            link.remove();
            setTimeout(() => URL.revokeObjectURL(url), 1000);

            const occurrenceCount = items.reduce((total, item) => total + (Array.isArray(item.recurrenceDayIds) && item.recurrenceDayIds.length > 1 ? item.recurrenceDayIds.length : 1), 0);
            const seriesCount = items.filter(item => item.recurrenceRule).length;

        window.getCurrentlyQualifiedBadgeIds = function() {

            const tasks = state.tasks.filter(t => belongs(t) || (t.completed && Number(t.rewardedCampaign || 1) === p.campaign));

        window.rollbackTaskBadges = function(task) {
            const badgeIds = Array.isArray(task?.rewardedBadgeIds) ? task.rewardedBadgeIds : [];
            if (!badgeIds.length || Number(task.rewardedCampaign || 1) !== window.normalizePrestige().campaign) return;
            const p = window.normalizePrestige();
            const stillQualified = window.getCurrentlyQualifiedBadgeIds();
            const removed = badgeIds.filter(id => !stillQualified.includes(id));
            p.badgeEvents = p.badgeEvents.filter(e => !removed.includes(e.id));
            state.unlockedBadges = state.unlockedBadges.filter(id => !removed.includes(id) || p.protectedBadgeIds.includes(id));
            const bonusIds = task.rewardedBadgeBonusIds || badgeIds.filter(id => !p.protectedBadgeIds.includes(id));
            const bonus = removed.filter(id => bonusIds.includes(id)).reduce((sum, id) => sum + (BADGES_DB.find(b => b.id === id)?.xpReward ?? 100), 0);

        window.checkGameTriggers = function() {

        window.getRankProgress = function(level = state.level, xp = state.xp) {

ss="text-xs font-bold text-slate-400 uppercase tracking-widest">Prévia do perfil</p><p id="profile-preview-name" class="text-lg font-bold text-white mt-3">${name || 'Seu nome'}</p><p id="profile-preview-title" class="text-sm mt-1" style="color:${theme.color}">${window.escapeHtml(window.getRankName())}</p><p class="text-xs text-slate-400 mt-2">${theme.name} · Campanha ${window.normalizePrestige().campaign}</p></div><div class="flex justify-end gap-3">${needsSetup ? '' : '<button type="button" onclick="window.closeProfileModal()" class="text-sm font-semibold text-slate-300 border border-slate-700 px-4 py-2.5 rounded-lg">Cancelar</button>'}<button type="button" onclick="window.saveUserProfile()" class="bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-bold px-4 py-2.5 rounded-lg">Salvar perfil</button></div></div></section></div>`;

        window.checkLevelUp = function() {

            let nextMax = window.getXpForCurrentLevel(); let levelChanged = false;

        window.getMissionStatus = function(task) {
            if (task?.completed) return 'completed';
            if (['planned', 'in_progress', 'paused'].includes(task?.workflowStatus)) return task.workflowStatus;
            return task?.subtasks?.some(st => st.completed) ? 'in_progress' : 'planned';

        window.setMissionStatus = function(taskId, nextStatus, event) {
            if (event) event.stopPropagation();
            if (!['planned', 'in_progress', 'paused', 'completed'].includes(nextStatus)) return;
            const task = state.tasks.find(t => String(t.id) === String(taskId));
            if (!task || window.getMissionStatus(task) === nextStatus) return;
            // Concluir/reabrir sempre usa a regra existente de recompensas.
            if (nextStatus === 'completed') { window.toggleTask(taskId, event); return; }
            task.workflowStatus = nextStatus;
            if (task.completed) { window.toggleTask(taskId, event); return; }
            window.saveState();
        };

        window.toggleTask = function(taskId, event) {
            const task = state.tasks.find(t => t.id == taskId);
            if (!task) return;

            const nature = window.getTaskNature(task);

            if (task.completed) {
                task.completed = false; task.skipped = false;
                const deductedXp = task.rewardedXp || 0;
                const deductedCoins = task.rewardedCoins || 0;
                const energyToRestore = typeof task.rewardedEnergyCost === 'number' ? task.rewardedEnergyCost : task.energyCost;
                const affectedCombo = typeof task.rewardedAffectsCombo === 'boolean' ? task.rewardedAffectsCombo : (deductedXp > 0 || deductedCoins > 0);

                const xpReverted = deductedXp > 0 ? window.revertCampaignXp(deductedXp, task.rewardedCampaign || 1) : 0;
                if (deductedCoins > 0 && Number(task.rewardedCampaign || 1) === window.normalizePrestige().campaign) window.revokeTacticalCoins(deductedCoins, 'missao-desmarcada');
                window.recordCampaignMission(task, false);
                if (energyToRestore) window.changeEnergy(energyToRestore);
                if (affectedCombo) state.combo = Math.max(0, state.combo - 1);
                if (affectedCombo) window.rollbackTaskBadges(task);
                if (typeof getCorrectLevel === 'function') state.level = getCorrectLevel(state.xp);

                delete task.rewardedXp;
                delete task.rewardedCoins;
                delete task.rewardedEnergyCost;
                delete task.rewardedAffectsCombo;
                delete task.rewardedNature;
                delete task.rewardedCampaign;

                const undoText = xpReverted > 0 ? `-${xpReverted} XP` : 'Missão reaberta';
                window.spawnFloatingText(event, undoText, deductedXp > 0 ? 'text-red-400' : 'text-slate-400');
            } else {
                task.completed = true;
                task.rewardedNature = nature;
                task.rewardedCampaign = window.normalizePrestige().campaign;
                window.recordCampaignMission(task, true);

                if (nature === 'neutral') {
                    task.rewardedXp = 0;
                    task.rewardedCoins = 0;
                    task.rewardedEnergyCost = 0;
                    task.rewardedAffectsCombo = false;
                    window.spawnFloatingText(event, 'Logística concluída', 'text-slate-300');
                } else if (nature === 'recharge') {
                    const rechargeAmount = Math.max(0, Math.abs(task.energyCost || 0));
                    task.rewardedXp = 0;
                    task.rewardedCoins = 0;
                    task.rewardedEnergyCost = -rechargeAmount;
                    task.rewardedAffectsCombo = false;
                    if (rechargeAmount > 0) window.changeEnergy(rechargeAmount);
                    window.spawnFloatingText(event, rechargeAmount ? `+${rechargeAmount} HP` : 'Recarga concluída', 'text-emerald-400');
                } else {
                    const badgesBefore = window.getCampaignBadgeEvents().map(e => e.id);
                    const bonusBefore = [...window.normalizePrestige().bonusClaimedBadgeIds];
                    const multiplier = window.getComboMultiplier();
                    const finalXp = Math.round(task.xp * multiplier);
                    const baseCoins = window.getTaskCoinReward(task);

                    task.rewardedXp = finalXp;
                    task.rewardedCoins = earnedCoins;
                    task.rewardedEnergyCost = task.energyCost;
                    task.rewardedAffectsCombo = true;
                    state.xp += finalXp;
                    window.changeEnergy(-task.energyCost);
                    state.combo += 1;
                    window.checkGameTriggers();
                    task.rewardedBadgeIds = window.getCampaignBadgeEvents().map(e => e.id).filter(id => !badgesBefore.includes(id));
                    task.rewardedBadgeBonusIds = window.normalizePrestige().bonusClaimedBadgeIds.filter(id => !bonusBefore.includes(id));
                    window.spawnFloatingText(event, `+${finalXp} XP${earnedCoins ? ` / +${earnedCoins} MT` : ''}`, 'text-indigo-400');
                    if (typeof window.playMissionCompleteSound === 'function') window.playMissionCompleteSound();
                }
            }
            window.checkLevelUp(); window.saveState();

        window.confirmDeleteMainTask = async function(reason = 'cancelada', event = null) {
            if (event) { event.stopPropagation(); event.preventDefault(); }
            const taskId = uiState.deleteTaskPrompt?.taskId;
            const task = state.tasks.find(t => String(t.id) === String(taskId));
            if (!task) { uiState.deleteTaskPrompt = { show: false, taskId: null }; render(); return; }
            const reasonLabels = {
                substituida: 'Substituída por outra missão',
                nao_fiz: 'Não fiz / não vou conseguir fazer',
                cancelada: 'Cancelada ou perdeu prioridade'
            };
            const preserveCombo = reason === 'substituida';
            if (!Array.isArray(state.taskDeletionLog)) state.taskDeletionLog = [];
            const recurrenceGroupId = task.recurrenceGroupId || null;
            const deletedDay = task.day;
            const wasRecurring = Boolean(task.isRecurring || (Array.isArray(task.recurrenceDays) && task.recurrenceDays.length));
            state.taskDeletionLog.push({
                id: Date.now() + Math.random(),
                deletedAt: new Date().toISOString(),
                reason,
                reasonLabel: reasonLabels[reason] || 'Excluída',
                preserveCombo,
                comboBefore: state.combo || 0,
                taskSnapshot: {
                    id: task.id, text: task.text, day: task.day, category: task.category, startTime: task.startTime || '', endTime: task.endTime || '',
                    completed: Boolean(task.completed), isRecurring: Boolean(task.isRecurring), recurrenceGroupId: task.recurrenceGroupId || null,
                    recurrenceDays: Array.isArray(task.recurrenceDays) ? [...task.recurrenceDays] : []
                }
            });

            state.tasks = state.tasks.filter(t => String(t.id) !== String(taskId));

            // Correção crítica: se a missão fazia parte de uma recorrência, remover apenas o dia excluído
            // da série. Sem isso, a validação/relogin recriava a ocorrência apagada.
            if (wasRecurring && recurrenceGroupId && deletedDay) {
                const validDays = daysOfWeek.map(d => d.id);
                const groupTasks = state.tasks.filter(t => String(t.recurrenceGroupId || '') === String(recurrenceGroupId));
                const remainingDays = [...new Set(groupTasks
                    .flatMap(t => Array.isArray(t.recurrenceDays) ? t.recurrenceDays : [t.day])
                    .filter(day => validDays.includes(day) && day !== deletedDay)
                )];

                if (!remainingDays.length) {
                    state.tasks = state.tasks.filter(t => String(t.recurrenceGroupId || '') !== String(recurrenceGroupId));
                } else {
                    state.tasks.forEach(t => {
                        if (String(t.recurrenceGroupId || '') === String(recurrenceGroupId)) {
                            t.recurrenceDays = [...remainingDays];
                            t.isRecurring = true;
                        }
                    });
                }
            }

            if (!preserveCombo) window.breakCombo();
            uiState.deleteTaskPrompt = { show: false, taskId: null };
            await window.saveStateNow();
            window.showToast('Missão excluída', preserveCombo ? 'Substituição registrada. Frenesi preservado.' : 'Exclusão registrada. Frenesi ajustado.', 'trash-2', preserveCombo ? 'text-cyan-300' : 'text-orange-300');
        };

        window.sortTasksByManualOrder = function(tasks = []) {
            return [...tasks].sort((a, b) => {
                const aOrder = typeof a?.order === 'number' ? a.order : 999999;
                const bOrder = typeof b?.order === 'number' ? b.order : 999999;
                if (aOrder !== bOrder) return aOrder - bOrder;
                const aTime = window.getCalendarSortMinutes(a);
                const bTime = window.getCalendarSortMinutes(b);
                if (aTime !== bTime) return aTime - bTime;
                return String(a?.text || '').localeCompare(String(b?.text || ''));
            });
        };

        window.handleTaskDrop = function(targetTaskId, event) {
            if (!event || !event.dataTransfer) return;
            event.preventDefault();
            event.stopPropagation();
            if (event.currentTarget) event.currentTarget.classList.remove('task-drag-over');
            const draggedTaskId = event.dataTransfer.getData('text/plain');
            if (!draggedTaskId || String(draggedTaskId) === String(targetTaskId)) return;
            const dragged = state.tasks.find(t => String(t.id) === String(draggedTaskId));
            const target = state.tasks.find(t => String(t.id) === String(targetTaskId));
            if (!dragged || !target) return;
            dragged.day = target.day;
            const ordered = window.sortTasksForDay(target.day).filter(t => String(t.id) !== String(dragged.id));
            const targetIndex = ordered.findIndex(t => String(t.id) === String(target.id));
            ordered.splice(targetIndex < 0 ? ordered.length : targetIndex, 0, dragged);
            ordered.forEach((t, index) => { t.order = index + 1; });
            window.saveState();
            window.showToast('Ordem atualizada', 'Missões reorganizadas no dia.', 'grip-vertical', 'text-cyan-400');
        };

        window.moveTaskOrder = function(taskId, direction, event) {
            if (event) event.stopPropagation();
            const task = state.tasks.find(t => t.id == taskId);
            if (!task) return;
            const ordered = window.sortTasksForDay(task.day);
            const index = ordered.findIndex(t => t.id == taskId);
            const nextIndex = index + direction;
            if (index < 0 || nextIndex < 0 || nextIndex >= ordered.length) return;
            const [item] = ordered.splice(index, 1);
            ordered.splice(nextIndex, 0, item);
            ordered.forEach((t, i) => { t.order = i + 1; });
            window.saveState();
        };

        window.getPomodoroLockedTask = function(taskIdFromButton = null) {
            let lockedTask = null;

            // Prioridade máxima: o ID EXATO exibido pelo seletor de missão do foco.
            // Não usar parseInt aqui, porque IDs de tarefas podem ter casas decimais.
            // parseInt cortava o ID e fazia o Pomodoro cair em outra tarefa.
            const selectEl = document.getElementById('pomodoro-focused-task-select');
            const selectedId = selectEl ? selectEl.value : '';
            lockedTask = window.findTaskByExactId(selectedId);

            // Fallback: id passado pelo botão, usado apenas quando não houver seletor.
            if (!lockedTask && taskIdFromButton !== null && typeof taskIdFromButton !== 'undefined' && taskIdFromButton !== '') {
                lockedTask = window.findTaskByExactId(taskIdFromButton);
            }

            // Último fallback: regra antiga do alvo atual.
            if (!lockedTask && window.getCurrentFocusTargetTask) lockedTask = window.getCurrentFocusTargetTask();
            return lockedTask || null;
        };

        window.togglePomodoro = function(taskIdFromButton = null) {
            if (pomodoro.isRunning) { 
                clearInterval(pomodoro.intervalId); 
                pomodoro.isRunning = false; 
            } else { 
                pomodoro.isRunning = true; 
                if (pomodoro.mode === 'focus' && !pomodoro.currentFocusStartedAt) {
                    pomodoro.currentFocusStartedAt = new Date().toISOString();
                    const lockedTask = window.getPomodoroLockedTask(taskIdFromButton);
                    const lockedId = lockedTask ? String(lockedTask.id) : null;
                    pomodoro.currentFocusTaskId = lockedId;
                    pomodoro.currentFocusTaskText = lockedTask ? lockedTask.text : null;
                    pomodoro.currentFocusTaskDay = lockedTask ? lockedTask.day : null;
                    pomodoro.currentFocusTaskCategory = lockedTask ? lockedTask.category : null;
                    pomodoro.focusLock = lockedTask ? {
                        id: lockedId,
                        text: lockedTask.text,
                        day: lockedTask.day,
                        category: lockedTask.category,
                        lockedAt: new Date().toISOString()
                    } : null;
                }
                pomodoro.intervalId = setInterval(() => { 
                    if (pomodoro.timeLeft > 0) { 
                        pomodoro.timeLeft--; 
                        const display = document.getElementById('pomodoro-display'); 
                        if (display) display.innerText = window.formatTime(pomodoro.timeLeft); 
                    } else { 
                        window.handlePomodoroEnd(); 
                    } 
                }, 1000); 
            }
            render();
        };

        window.handlePomodoroEnd = function() {
            clearInterval(pomodoro.intervalId); 
            pomodoro.isRunning = false; 
            try { new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3').play(); } catch(e) {}
            const s = state.pomodoroSettings;
            if (pomodoro.mode === 'focus') {
                const focusMinutes = parseInt(s.focus) || 25;
                const activeFocusLock = pomodoro.focusLock || null;
                const lockedTaskId = activeFocusLock ? activeFocusLock.id : pomodoro.currentFocusTaskId;
                const lockedTaskText = activeFocusLock ? activeFocusLock.text : pomodoro.currentFocusTaskText;
                const hasLockedTask = lockedTaskId !== null && typeof lockedTaskId !== 'undefined' && lockedTaskId !== '';
                const focusedTask = hasLockedTask ? (window.findTaskByExactId(lockedTaskId) || null) : null;
                const fallbackTask = !hasLockedTask && window.getCurrentFocusTargetTask ? window.getCurrentFocusTargetTask() : null;
                const finalTaskId = hasLockedTask ? String(lockedTaskId) : (fallbackTask ? String(fallbackTask.id) : null);
                const finalTaskText = lockedTaskText || (focusedTask ? focusedTask.text : (fallbackTask ? fallbackTask.text : 'Ciclo sem tarefa vinculada'));
                const startedAt = pomodoro.currentFocusStartedAt || new Date(Date.now() - (focusMinutes * 60000)).toISOString();

                if (pomodoro.cycle % s.cycles === 0) { 
                    pomodoro.mode = 'longBreak'; 
                    pomodoro.timeLeft = s.longBreak * 60; 
                } else { 
                    pomodoro.mode = 'shortBreak'; 
                    pomodoro.timeLeft = s.shortBreak * 60; 
                }
                const earnedXP = 30 * window.getComboMultiplier(); 
                const earnedCoins = window.awardTacticalCoins(state.economy?.rules?.pomodoroCoins ?? ECONOMY_DEFAULTS.pomodoroCoins, 'pomodoro', { showCapToast: false });
                state.xp += Math.round(earnedXP); 
                window.recordCampaignStat('pomodorosCompleted');

        window.calculatePomodoroEfficiency = function(focusRating, distractions) {
            const rating = Math.max(1, Math.min(5, parseInt(focusRating) || 3));
            const dist = Math.max(0, parseInt(distractions) || 0);
            return Math.max(0, Math.min(100, Math.round((rating * 20) - (dist * 7))));
        };

        window.savePomodoroEvaluation = function() {
            const data = uiState.pomodoroEvaluationData;
            if (!data) { window.skipPomodoroEvaluation(); return; }
            const focusRating = Math.max(1, Math.min(5, parseInt(document.getElementById('pomo-eval-focus')?.value) || 3));
            const distractions = Math.max(0, parseInt(document.getElementById('pomo-eval-distractions')?.value) || 0);
            const notes = document.getElementById('pomo-eval-notes')?.value.trim() || '';
            const efficiency = window.calculatePomodoroEfficiency(focusRating, distractions);
            if (!state.focusData) state.focusData = { cycles: [] };
            if (!Array.isArray(state.focusData.cycles)) state.focusData.cycles = [];

                ...data,

                distractions,
                notes,

        window.getFocusEfficiencyByTask = function() {
            const cycles = (state.focusData && Array.isArray(state.focusData.cycles)) ? state.focusData.cycles : [];
            const grouped = {};
            cycles.forEach(c => {
                const key = c.taskId ? `task_${c.taskId}` : `text_${c.taskText || 'sem_tarefa'}`;
                if (!grouped[key]) grouped[key] = { taskText: c.taskText || 'Ciclo sem tarefa', total: 0, count: 0, lastDate: c.date };
                grouped[key].total += parseInt(c.efficiency) || 0;
                grouped[key].count += 1;
                if (!grouped[key].lastDate || new Date(c.date) > new Date(grouped[key].lastDate)) grouped[key].lastDate = c.date;
            });
            return Object.values(grouped)
                .map(g => ({ ...g, avg: Math.round(g.total / Math.max(1, g.count)) }))
                .sort((a, b) => new Date(b.lastDate) - new Date(a.lastDate))
                .slice(0, 8);
        };

            const oldDay = task.day;

            const activeCategories = window.getTaskCategories();
            const selectedCategory = document.getElementById('et-category')?.value || activeCategories[0]?.id || task.category || 'geral';
            const priority = document.getElementById('et-priority')?.value || task.priority || 'media';
            const complexity = parseInt(document.getElementById('et-complexity')?.value, 10) || 1;

            const cost = window.calculateTaskCost(priority, complexity, timeVal, impactType, missionNature);
            const calendarTime = window.readCalendarTimeFields('et', timeVal);
            if (!calendarTime) return;
            const recurrenceDays = daysOfWeek

            };

            if (isRecurring) {
                const groupId = task.recurrenceGroupId || `rec-${Date.now()}-${Math.random().toString(16).slice(2)}`;
                const oldGroupDays = state.tasks
                    .filter(t => String(t.recurrenceGroupId || '') === String(groupId) || String(t.id) === String(task.id))
                    .map(t => t.day)
                    .filter(Boolean);

                applyValues(task, recurrenceDays.includes(newDay) ? newDay : recurrenceDays[0]);

        window.calculateTaskCost = function(priority, complexity, time, impactType, missionNature = 'normal') {
            const nature = TASK_NATURES[missionNature] ? missionNature : 'normal';

            // Modelo neurocognitivo v1.7.9 de drenagem de HP.
            // Ideia central: carga mental sobe com dificuldade, atenção sustentada e pressão da prioridade.
            // Ordem garantida, mantendo dificuldade e tempo iguais: baixa < media < alta < essencial.
            const compVal = Math.max(1, Math.min(5, parseInt(complexity, 10) || 1));
            const timeVal = Math.max(5, Math.min(240, parseInt(time, 10) || 15));
            const normalizedPriority = String(priority || 'media').toLowerCase();

            if (nature === 'neutral') {
                return { xp: 0, hp: 0, nature };
            }

            const priorityPressure = {
                baixa: 0.70,
                media: 1.00,
                alta: 1.25,
                essencial: 1.50,
                critica: 1.65
            }[normalizedPriority] || 1.00;

            const switchingOverhead = 4; // custo fixo de iniciar/trocar contexto
            const difficultyLoad = compVal * 5; // memória de trabalho, controle inibitório e decisão
            const sustainedAttentionLoad = Math.sqrt(timeVal / 30) * 8; // fadiga por duração com crescimento não linear

            let calcHp = Math.round((switchingOverhead + difficultyLoad + sustainedAttentionLoad) * priorityPressure);
            calcHp = Math.max(3, Math.min(calcHp, 70));

            if (nature === 'recharge') {
                const recovery = Math.round(6 + (Math.sqrt(timeVal / 30) * 7) + (compVal * 1.5));
                return { xp: 0, hp: -Math.max(5, Math.min(recovery, 35)), nature };
            }

            const prioMult = {
                baixa: 0.85,
                media: 1.00,
                alta: 1.20,
                essencial: 1.45,
                critica: 1.55
            }[normalizedPriority] || 1.00;

            const calcXp = Math.round((18 + (compVal * 14) + (timeVal * 1.2)) * prioMult);
            return { xp: calcXp, hp: calcHp, nature };
        };
