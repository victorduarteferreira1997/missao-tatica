        // --- SAÚDE/CORPO ---
        window.renderHealthForm = function(tab) {
            const field='w-full mt-1.5 rounded-lg border border-slate-700 bg-slate-950 px-3 py-2.5 text-sm text-white outline-none focus:border-rose-400';
            const input=(id,label,attrs='')=>`<label class="block text-sm text-slate-300">${label}<input id="${id}" ${attrs} class="${field}"></label>`;
            const select=(id,label,options,empty=false)=>`<label class="block text-sm text-slate-300">${label}<select id="${id}" class="${field}">${empty?'<option value="">Não informar</option>':''}${options.map(item=>`<option>${item}</option>`).join('')}</select></label>`;
            const configs={
                treinos:{title:'Registrar treino',handler:'logWorkout',body:`<div class="grid grid-cols-1 sm:grid-cols-2 gap-4">${select('wo-type','Modalidade',Object.keys(WORKOUT_TYPES))}${select('wo-intensity','Intensidade',Object.keys(WORKOUT_INTENSITIES))}</div>${input('wo-duration','Duração (min)','type="number" min="1" value="45"')}<label class="block text-sm text-slate-300">Anotações <span class="text-xs text-slate-500">(opcional)</span><textarea id="wo-notes" rows="3" maxlength="2000" class="${field}"></textarea></label><p class="text-xs text-slate-500">XP e bateria seguem as regras do jogo. A bateria não é uma avaliação da sua condição física.</p>`},
                metricas:{title:'Registrar medidas',handler:'logBodyMetric',body:`<p class="text-sm text-slate-400">Preencha as medidas que você acompanhou. As demais podem ficar em branco.</p><div class="grid grid-cols-1 sm:grid-cols-2 gap-4">${input('metric-weight','Peso (kg)','type="number" min="0.1" step="0.1" inputmode="decimal"')}${input('metric-waist','Cintura (cm)','type="number" min="0.1" step="0.1" inputmode="decimal"')}</div>`},
                habitos:{title:'Registrar check-in',handler:'logHabit',body:`<p class="text-sm text-slate-400">Registre o que você sabe sobre o dia. Não precisa preencher tudo.</p><div class="grid grid-cols-1 sm:grid-cols-2 gap-4">${input('habit-sleep','Sono (horas)','type="number" min="0" max="24" step="0.5" inputmode="decimal"')}${input('habit-water','Água (litros)','type="number" min="0" step="0.1" inputmode="decimal"')}${select('habit-mood','Humor',['Muito ruim','Ruim','Neutro','Bom','Excelente'],true)}${select('habit-fatigue','Fadiga',['Nenhuma','Leve','Moderada','Alta'],true)}</div><p class="text-xs text-slate-500">Um registro concede 20 XP pelas regras atuais.</p>`}
            };
            const config=configs[tab];if(!config)return'';
            return `<details ${uiState.healthSections?.[tab]?'open':''} ontoggle="window.setHealthSection('${tab}',this.open)" class="rounded-xl border border-slate-800 bg-slate-950/30 p-4"><summary class="cursor-pointer text-sm font-medium text-slate-300">${config.title}</summary><form novalidate onsubmit="event.preventDefault();window.${config.handler}()" class="space-y-4 mt-4">${config.body}<div class="flex justify-end"><button type="submit" class="rounded-lg border border-rose-800/60 bg-rose-900/30 px-4 py-2.5 text-sm text-rose-200 hover:bg-rose-900/60">${config.title}</button></div></form></details>`;
        };
        window.renderHealthRow = function(row,tab) {
            const esc=window.escapeHtml;
            const metric=(value,unit)=>value!==null&&value!==undefined&&String(value).trim()!==''&&Number.isFinite(Number(value))?`${Number(value)} ${unit}`:'Não informado';
            const content=tab==='treinos'?`<h4 class="text-sm font-medium text-slate-200">${esc(row.type || 'Treino')}</h4><p class="text-xs text-slate-400 mt-1">${esc(row.intensity || 'Intensidade não informada')} · ${metric(row.duration,'min')}</p>${row.notes?`<p class="text-sm text-slate-400 mt-2 whitespace-pre-line break-words">${esc(row.notes)}</p>`:''}`:tab==='metricas'?`<p class="text-sm text-slate-200">Peso: ${metric(row.weight,'kg')} · Cintura: ${metric(row.waist,'cm')}</p>`:`<p class="text-sm text-slate-200">Sono: ${metric(row.sleep,'h')} · Água: ${metric(row.water,'L')}</p><p class="text-xs text-slate-400 mt-1">Humor: ${esc(row.mood || 'Não informado')} · Fadiga: ${esc(row.fatigue || 'Não informada')}</p>`;
            return `<article class="py-4"><p class="text-xs text-slate-500 mb-2">${window.formatFinanceDate(row.date)}</p>${content}</article>`;
        };
        window.renderHealthHistory = function(tab) {
            const rows=window.getHealthRows(tab),pages=Math.max(1,Math.ceil(rows.length/10)),page=Math.min(pages-1,Math.max(0,Number(uiState.healthPages?.[tab])||0));
            return `<section class="rounded-xl border border-slate-800 px-4"><div class="flex justify-between items-center gap-3 pt-4"><h3 class="text-sm font-medium text-slate-300">Histórico</h3><span class="text-xs text-slate-500">${rows.length} registro${rows.length===1?'':'s'}</span></div><div class="divide-y divide-slate-800">${rows.slice(page*10,page*10+10).map(row=>window.renderHealthRow(row,tab)).join('') || '<p class="text-sm text-slate-500 py-4">Nenhum registro ainda.</p>'}</div>${pages>1?`<div class="flex justify-between items-center border-t border-slate-800 py-3"><button type="button" onclick="window.setHealthPage('${tab}',${page-1})" ${page?'':'disabled'} class="text-xs text-slate-300 disabled:opacity-30 px-3 py-2 border border-slate-700 rounded-lg">Anterior</button><span class="text-xs text-slate-500">${page+1} de ${pages}</span><button type="button" onclick="window.setHealthPage('${tab}',${page+1})" ${page<pages-1?'':'disabled'} class="text-xs text-slate-300 disabled:opacity-30 px-3 py-2 border border-slate-700 rounded-lg">Próxima</button></div>`:''}</section>`;
        };
        function renderHealthContent() {
            const tab=uiState.healthTab || 'dashboard';
            if(tab==='dashboard'){
                const summary=window.getHealthSummary();
                return `<div class="space-y-5"><section class="rounded-xl border border-slate-800 p-5"><div class="flex flex-wrap justify-between items-start gap-4"><div><h3 class="text-sm font-medium text-slate-300">Seu movimento registrado</h3><p class="text-xs text-slate-500 mt-2">Acompanhe o histórico no seu ritmo.</p></div><button type="button" onclick="window.openHealthForm('treinos')" class="rounded-lg border border-rose-800/60 bg-rose-900/30 px-4 py-2.5 text-sm text-rose-200 hover:bg-rose-900/60">Registrar treino</button></div><div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mt-5 pt-4 border-t border-slate-800"><div><p class="text-xs text-slate-500">Últimos 7 dias, incluindo hoje</p><p class="text-xl font-medium text-slate-100 mt-1">${summary.recent} treino${summary.recent===1?'':'s'}</p><p class="text-xs text-slate-500 mt-1">${summary.minutes} min registrados</p></div><div><p class="text-xs text-slate-500">Todo o histórico</p><p class="text-xl font-medium text-slate-100 mt-1">${summary.total} treino${summary.total===1?'':'s'}</p></div><div><p class="text-xs text-slate-500">Último treino com data válida</p><p class="text-lg font-medium text-slate-100 mt-1">${summary.lastKey?window.formatFinanceDate(summary.lastKey):'Nenhum ainda'}</p>${summary.days!==null?`<p class="text-xs text-slate-500 mt-1">${summary.days===0?'Hoje':`Há ${summary.days} dia${summary.days===1?'':'s'}`}</p>`:''}</div></div></section><div class="flex flex-wrap gap-3"><button type="button" onclick="window.openHealthForm('habitos')" class="text-sm text-slate-300 border border-slate-700 rounded-lg px-3 py-2 hover:bg-slate-800">Check-in do dia</button><button type="button" onclick="window.openHealthForm('metricas')" class="text-sm text-slate-400 rounded-lg px-3 py-2 hover:bg-slate-800">Registrar medidas</button></div><section class="rounded-xl border border-slate-800 px-4"><div class="flex justify-between items-center gap-3 pt-4"><h3 class="text-sm font-medium text-slate-300">Treinos recentes</h3><button type="button" onclick="window.setHealthTab('treinos')" class="text-xs text-slate-400 hover:text-white">Ver histórico</button></div><div class="divide-y divide-slate-800">${window.getHealthRows('treinos').slice(0,3).map(row=>window.renderHealthRow(row,'treinos')).join('')||'<p class="text-sm text-slate-500 py-4">Nenhum treino registrado. Seu histórico aparece após o primeiro registro.</p>'}</div></section></div>`;
            }
            return `<div class="space-y-5"><div class="flex justify-end"><button type="button" onclick="window.openHealthForm('${tab}')" class="rounded-lg border border-slate-700 px-3 py-2 text-sm text-slate-300 hover:bg-slate-800">${tab==='treinos'?'Registrar treino':tab==='metricas'?'Registrar medidas':'Registrar check-in'}</button></div>${window.renderHealthForm(tab)}${window.renderHealthHistory(tab)}</div>`;
        }

        // --- FINANÇAS ---
        window.renderFinanceForm = function(tab) {
            const field = 'w-full mt-1.5 rounded-lg border border-slate-700 bg-slate-950 px-3 py-2.5 text-sm text-white outline-none focus:border-yellow-400';
            const input = (id,label,type='text') => `<label class="block text-sm text-slate-300">${label}<input id="${id}" type="${type}" ${type === 'number' ? 'min="0.01" step="0.01" inputmode="decimal"' : 'maxlength="200"'} class="${field}"></label>`;
            const select = (id,label,options) => `<label class="block text-sm text-slate-300">${label}<select id="${id}" class="${field}">${options.map(option=>`<option>${option}</option>`).join('')}</select></label>`;
            const settings = {
                receitas:{ title:'Registrar receita',handler:'addIncome',body:`<div class="grid grid-cols-1 sm:grid-cols-2 gap-3">${input('inc-desc','Origem')}${input('inc-amount','Valor (R$)','number')}</div>${select('inc-cat','Categoria',['Salário','Consultoria / PJ','Extra','Outro'])}` },
                fixas:{ title:'Adicionar conta fixa',handler:'addFixedExpense',body:`<div class="grid grid-cols-1 sm:grid-cols-2 gap-3">${input('fix-desc','Nome da conta')}${input('fix-amount','Valor (R$)','number')}</div>${select('fix-cat','Categoria',['Moradia','Água/Luz/Internet','Saúde','Educação','Assinaturas','Dívidas','Outro'])}` },
                variaveis:{title:'Registrar gasto',handler:'tryAddVariableExpense',body:`<div class="grid grid-cols-1 sm:grid-cols-2 gap-3">${input('var-desc','Descrição')}${input('var-amount','Valor (R$)','number')}</div><div class="grid grid-cols-1 sm:grid-cols-2 gap-3">${select('var-cat','Categoria',['Alimentação fora','Mercado','Transporte','Saúde','Lazer','Roupas','Tecnologia','Educação','Outro'])}${select('var-trigger','Contexto da compra',['Necessidade real','Planejado','Ansiedade','Cansaço','Recompensa','Impulso','Tédio'])}</div><p class="text-xs text-slate-500">Compras a partir de R$ 150 ou com determinados contextos passam pela revisão antes de registrar.</p>`},
                diario:{title:'Escrever uma reflexão',handler:'logMoneyJournal',body:`${input('mj-event','O que aconteceu?')}${select('mj-mood','Como você se sentiu?',['Ansioso com contas','Confiante','Frustrado com gastos','Calmo'])}<label class="block text-sm text-slate-300">Reflexão <span class="text-xs text-slate-500">(opcional)</span><textarea id="mj-thought" rows="3" maxlength="2000" class="${field}"></textarea></label><p class="text-xs text-slate-500">Registrar uma reflexão concede 15 XP.</p>`}
            };
            const form = settings[tab]; if (!form) return '';
            return `<details ${uiState.financeSections?.[`${tab}:form`] ? 'open' : ''} ontoggle="window.setFinanceSection('${tab}', 'form', this.open)" class="rounded-xl border border-slate-800 bg-slate-950/30 p-4"><summary class="cursor-pointer text-sm font-medium text-slate-300">${form.title}</summary><form novalidate onsubmit="event.preventDefault(); window.${form.handler}()" class="space-y-4 mt-4">${form.body}<div class="flex justify-end"><button type="submit" class="rounded-lg border border-yellow-800/60 bg-yellow-900/35 text-yellow-200 hover:bg-yellow-900/60 px-4 py-2.5 text-sm font-medium">${form.title}</button></div></form></details>`;
        };
        window.renderFinanceRows = function(tab) {
            const all = window.getFinanceRows(tab);
            const page = Math.min(Math.max(0, Math.ceil(all.length / 10) - 1), uiState.financePages?.[tab] || 0);
            const pages = Math.max(1, Math.ceil(all.length / 10));
            const handler = { receitas:'deleteIncome', fixas:'deleteFixed', variaveis:'deleteVariable' }[tab];
            return `<div class="divide-y divide-slate-800">${all.slice(page * 10, page * 10 + 10).map(row => {
                const arg = window.recoveryHandlerArgument(row.id);
                if (tab === 'diario') return `<article class="py-4"><p class="text-xs text-slate-500">${window.formatFinanceDate(row.date)} · ${window.escapeHtml(row.mood || 'Sem humor registrado')}</p><h4 class="text-sm font-medium text-slate-200 mt-2 break-words">${window.escapeHtml(row.event)}</h4>${row.action ? `<p class="text-xs text-emerald-300 mt-2">${window.escapeHtml(row.action)}</p>` : ''}${row.thought ? `<p class="text-sm text-slate-400 mt-2 whitespace-pre-line break-words">${window.escapeHtml(row.thought)}</p>` : ''}</article>`;
                return `<div class="flex items-start justify-between gap-4 py-4"><div class="flex items-start gap-3 min-w-0">${tab === 'fixas' ? `<button type="button" onclick="window.toggleFixedPaid(${arg})" aria-label="${window.escapeHtml(`${row.paid ? 'Marcar como pendente' : 'Marcar como paga'}: ${row.description}`)}" aria-pressed="${Boolean(row.paid)}" class="mt-0.5 text-slate-500 hover:text-emerald-300"><i data-lucide="${row.paid ? 'check-circle' : 'circle'}" class="w-5 h-5 ${row.paid ? 'text-emerald-400' : ''}"></i></button>` : ''}<div class="min-w-0"><p class="text-sm font-medium ${row.paid && tab === 'fixas' ? 'text-slate-500' : 'text-slate-200'} break-words">${window.escapeHtml(row.description)}</p><p class="text-xs text-slate-500 mt-1">${tab === 'fixas' ? row.paid ? 'Paga' : 'Pendente' : window.formatFinanceDate(row.date)}${row.category ? ` · ${window.escapeHtml(row.category)}` : ''}</p>${tab === 'variaveis' && row.trigger ? `<p class="text-xs text-slate-500 mt-1">${window.escapeHtml(row.trigger)}</p>` : ''}</div></div><div class="flex items-center gap-3 shrink-0"><span class="text-sm tabular-nums ${tab === 'receitas' ? 'text-emerald-300' : 'text-slate-300'}">${window.formatFinanceMoney(row.amount)}</span><button type="button" onclick="window.${handler}(${arg})" aria-label="${window.escapeHtml('Excluir registro: ' + row.description)}" class="text-slate-600 hover:text-red-300 focus:text-red-300 p-1"><i data-lucide="trash-2" class="w-4 h-4"></i></button></div></div>`;
            }).join('') || '<p class="text-sm text-slate-500 py-6 text-center">Nenhum registro neste período.</p>'}</div>${pages > 1 ? `<div class="flex justify-between items-center gap-3 border-t border-slate-800 pt-3"><button type="button" onclick="window.setFinancePage('${tab}', ${page - 1})" ${page ? '' : 'disabled'} class="rounded-lg border border-slate-700 px-3 py-2 text-xs text-slate-300 disabled:opacity-30">Anterior</button><span class="text-xs text-slate-500">${page + 1} de ${pages}</span><button type="button" onclick="window.setFinancePage('${tab}', ${page + 1})" ${page < pages - 1 ? '' : 'disabled'} class="rounded-lg border border-slate-700 px-3 py-2 text-xs text-slate-300 disabled:opacity-30">Próxima</button></div>` : ''}`;
        };
        function renderFinanceContent() {
            const tab = uiState.financeTab || 'dashboard';
            const summary = window.getFinanceSummary();
            if (tab === 'dashboard') {
                return `<div class="space-y-5"><section class="rounded-xl border border-yellow-900/40 bg-yellow-950/10 p-5"><div class="flex flex-wrap justify-between items-start gap-4"><div><p class="text-sm text-slate-400">Resultado estimado</p><p class="text-3xl font-semibold tabular-nums mt-2 ${summary.result < 0 ? 'text-amber-200' : 'text-slate-100'}">${window.formatFinanceMoney(summary.result)}</p><p class="text-xs text-slate-500 mt-2">Receitas − contas fixas cadastradas − gastos variáveis do período.</p></div><button type="button" onclick="window.openFinanceForm('variaveis')" class="rounded-lg border border-yellow-800/60 bg-yellow-900/35 px-4 py-2.5 text-sm text-yellow-200 hover:bg-yellow-900/60">Registrar gasto</button></div><div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mt-5 pt-4 border-t border-slate-800">${[{label:'Receitas',value:summary.incomeTotal,tab:'receitas'},{label:'Contas fixas',value:summary.fixedTotal,tab:'fixas'},{label:'Gastos variáveis',value:summary.variableTotal,tab:'variaveis'}].map(metric=>`<button type="button" onclick="window.setFinanceTab('${metric.tab}')" class="text-left rounded-lg hover:bg-slate-800/40 p-2 -m-2"><p class="text-xs text-slate-500">${metric.label}</p><p class="text-lg font-medium tabular-nums text-slate-200 mt-1">${window.formatFinanceMoney(metric.value)}</p></button>`).join('')}</div></section>${summary.unpaid.length ? `<section class="rounded-xl border border-slate-800 p-4 flex justify-between items-center gap-4"><div><p class="text-sm text-slate-300">${summary.unpaid.length} conta${summary.unpaid.length === 1 ? '' : 's'} fixa${summary.unpaid.length === 1 ? '' : 's'} pendente${summary.unpaid.length === 1 ? '' : 's'}</p><p class="text-xs text-slate-500 mt-1">${window.formatFinanceMoney(summary.unpaidTotal)} · status marcado manualmente</p></div><button type="button" onclick="window.setFinanceTab('fixas')" class="text-sm text-yellow-200 shrink-0">Ver contas</button></section>` : ''}<section class="rounded-xl border border-slate-800 p-4"><div class="flex justify-between items-center gap-3"><h3 class="text-sm font-medium text-slate-200">Gastos recentes</h3><button type="button" onclick="window.setFinanceTab('variaveis')" class="text-xs text-slate-400 hover:text-white">Ver todos</button></div><div class="divide-y divide-slate-800 mt-2">${summary.variable.slice(0,5).map(row=>`<div class="flex justify-between items-start gap-4 py-3"><div class="min-w-0"><p class="text-sm text-slate-300 break-words">${window.escapeHtml(row.description)}</p><p class="text-xs text-slate-500 mt-1">${window.formatFinanceDate(row.date)}${row.category ? ` · ${window.escapeHtml(row.category)}` : ''}</p></div><p class="text-sm text-slate-300 tabular-nums shrink-0">${window.formatFinanceMoney(row.amount)}</p></div>`).join('') || '<p class="text-sm text-slate-500 py-4">Nenhum gasto registrado neste período.</p>'}</div></section><details ${uiState.financeSections?.['dashboard:context'] ? 'open' : ''} ontoggle="window.setFinanceSection('dashboard', 'context', this.open)" class="rounded-xl border border-slate-800 p-4"><summary class="cursor-pointer text-sm text-slate-400">Contexto dos gastos</summary><p class="text-sm text-slate-300 mt-3">${window.formatFinanceMoney(summary.contextTotal)} marcados como Ansiedade, Cansaço, Recompensa ou Impulso.</p><p class="text-xs text-slate-500 mt-2">A classificação vem do que você informou ao registrar. Consulte o diário para acompanhar suas decisões.</p></details><details ${uiState.financeSections?.['dashboard:calculation'] ? 'open' : ''} ontoggle="window.setFinanceSection('dashboard', 'calculation', this.open)" class="rounded-xl border border-slate-800 p-4"><summary class="cursor-pointer text-sm text-slate-400">Como este resultado é calculado</summary><p class="text-xs leading-relaxed text-slate-400 mt-3">Todas as contas fixas cadastradas entram no cálculo, pagas ou pendentes. Elas não possuem competência mensal. Receitas e gastos variáveis seguem o período escolhido. O resultado não representa saldo bancário e não inclui dívidas, metas ou orçamentos que não tenham sido registrados como despesas.</p></details>${window.getFinancePeriodKey() && summary.undated ? `<p class="text-xs text-slate-500">${summary.undated} lançamento${summary.undated === 1 ? '' : 's'} sem data válida fica${summary.undated === 1 ? '' : 'm'} fora do filtro mensal. Consulte Todo o histórico.</p>` : ''}</div>`;
            }
            if (!FINANCE_COLLECTIONS[tab]) return '';
            const count = window.getFinanceRows(tab).length;
            const heading = { receitas:'Receitas registradas', fixas:'Contas fixas cadastradas', variaveis:'Gastos registrados', diario:'Reflexões e decisões' }[tab];
            return `<div class="space-y-5"><div class="flex flex-wrap justify-between items-center gap-3"><div><h3 class="text-sm font-medium text-slate-200">${heading}</h3><p class="text-xs text-slate-500 mt-1">${count} registro${count === 1 ? '' : 's'}${tab === 'fixas' ? ' · status manual, sem competência mensal' : ''}</p></div><button type="button" onclick="window.openFinanceForm('${tab}')" class="rounded-lg border border-slate-700 px-3 py-2 text-sm text-slate-300 hover:bg-slate-800">${tab === 'diario' ? 'Nova reflexão' : tab === 'fixas' ? 'Adicionar conta' : tab === 'receitas' ? 'Registrar receita' : 'Registrar gasto'}</button></div>${window.renderFinanceForm(tab)}<section class="rounded-xl border border-slate-800 px-4">${window.renderFinanceRows(tab)}</section></div>`;
        }

    </script>
</body>
</html>
