<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Prévia — Layout Simplification</title>
</head>
<body style="margin:0;background:#020617;color:#cbd5e1;font-family:system-ui;padding:24px">
  <div id="status">Carregando prévia da branch de layout...</div>
  <script>
    fetch('https://raw.githubusercontent.com/victorduarteferreira1997/missao-tatica/codex/layout-simplification/app.html?ts=' + Date.now())
      .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
      .then(html => { document.open(); document.write(html); document.close(); })
      .catch(err => { document.getElementById('status').textContent = 'Não foi possível carregar a prévia: ' + err.message; });
  </script>
</body>
</html>
